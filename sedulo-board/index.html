<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Sedulo on one page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,500;1,600&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Sedulo on one page: the team's overview. A readout up top (one tick per task, the road as five stations),
   five departments that open into their own view, a matrix and a calendar; any task opens in a side panel.
   Look: the readout direction. Motion: Emil Kowalski's rules (ease-out in, short, interruptible, transform/opacity). */
:root{
  --ground:#F0F1F4; --card:#FFFFFF; --card-2:#F5F6F8; --ink:#151617; --ink-2:#565A62; --ink-3:#8A8D94;
  --line:#E2E4E9; --line-2:#CDD0D7;
  --blue:#2747D6; --on-blue:#FFFFFF; --blue-tint:#EDF0FD; --blue-ink:#13235E;
  --teal:#2B9C8F; --unknown:#B09F7B; --late:#C26616;
  --btn:#151617; --btn-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(19,35,94,.05),0 10px 28px rgba(19,35,94,.06);
  --lift:0 2px 6px rgba(19,35,94,.06),0 24px 60px rgba(19,35,94,.14);
  --scrim:rgba(14,15,17,.30);
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",sans-serif;
  --r:22px;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-io:cubic-bezier(.77,0,.175,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --ground:#0E0F11; --card:#17181B; --card-2:#1D1E22; --ink:#F1F2F4; --ink-2:#A6A9B1; --ink-3:#777A83;
    --line:#2A2C32; --line-2:#3B3E45;
    --blue:#8CA2FF; --on-blue:#0E0F11; --blue-tint:rgba(140,162,255,.12); --blue-ink:#C9D3FF;
    --teal:#7FD6C8; --unknown:#A99B7D; --late:#F2A04A;
    --btn:#F1F2F4; --btn-ink:#121314;
    --shadow:0 0 0 1px #24262B; --lift:0 0 0 1px #2C2F35,0 24px 60px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html.lock,html.lock body{overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}
.wrap{max-width:1380px;margin:0 auto;padding-left:max(clamp(16px,3vw,40px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,3vw,40px),env(safe-area-inset-right,0px));padding-block:22px 64px;display:grid;gap:16px}
.wrap>*,main>section{min-width:0}
.label{font:500 11px/1.25 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.press{transition:transform 160ms var(--ease-out)}
.press:active{transform:scale(.97)}

/* entrances: one per container, non-uniform delays, first load only */
@keyframes rise{from{opacity:0;transform:translateY(var(--rise,10px))}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.in{animation:rise 520ms var(--ease-out) both;animation-delay:var(--d,0ms)}
.fadein{animation:fade 360ms ease both;animation-delay:var(--d,0ms)}
.swap{--rise:6px;animation:rise 240ms var(--ease-out) both}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px}
.top h1{margin:0;font:600 24px/1.15 var(--sans);letter-spacing:-.015em}
.top .label{display:block;margin-top:3px}
.me{display:flex;align-items:center;gap:8px}

/* people */
.ava{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font:600 11px/1 var(--sans);color:var(--on-blue);background:var(--blue);flex:none}
.ava.j{background:var(--teal)}
.ava.both{width:34px;background:linear-gradient(90deg,var(--blue) 50%,var(--teal) 50%);border-radius:999px}
.ava.none{background:transparent;color:var(--ink-3);box-shadow:0 0 0 1.5px var(--line-2) inset;border:0}
.ava.sm{width:20px;height:20px;font-size:10px}
.ava.sm.both{width:28px}

/* the readout */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px 32px;padding:22px 26px 20px;align-items:center}
.num{display:flex;align-items:baseline;gap:4px;font-family:var(--display);font-style:italic;line-height:.85}
.num b{font-weight:600;font-size:72px;letter-spacing:-.01em}
.num span{font-weight:500;font-size:30px;color:var(--ink-3)}
.reading{display:grid;gap:6px;min-width:110px}
.gauge{display:grid;gap:10px;min-width:0}
.scale{display:flex;gap:4px;height:44px;align-items:stretch;padding-bottom:6px;border-bottom:1px solid var(--line-2)}
.scale i{flex:1 1 0;min-width:2px;border-radius:3px;background:var(--line);transition:background 420ms var(--ease-out)}
.scale i.done{background:var(--blue)}
.scale i.doing{background:linear-gradient(to top,var(--blue) 0 42%,var(--line) 42%)}
.scale i.unknown{background:linear-gradient(to top,var(--unknown) 0 42%,var(--line) 42%)}
.scale.sm{height:14px;gap:3px;padding-bottom:0;border-bottom:0}
.scale.sm i{max-width:14px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.legend .ring{width:13px;height:13px;border-width:1.5px;padding:2px;pointer-events:none}
.legend .ring svg{display:none}

/* the road: five stations */
.route{grid-column:1/-1;position:relative;display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));padding-top:6px}
.route::before{content:"";position:absolute;left:calc(100%/var(--n,5)/2);right:calc(100%/var(--n,5)/2);top:17px;height:2px;background:var(--line);border-radius:2px}
.route .done-line{position:absolute;left:calc(100%/var(--n,5)/2);top:17px;height:2px;background:var(--blue);border-radius:2px;transform-origin:left;width:var(--w,0%);transition:width 700ms var(--ease-out)}
.stn{all:unset;cursor:pointer;position:relative;display:grid;justify-items:center;gap:5px;text-align:center;min-width:0;padding:0 4px}
.stn:focus-visible{outline:2px solid var(--blue);outline-offset:4px;border-radius:8px}
.dot{width:14px;height:14px;margin-top:5px;border-radius:50%;background:var(--card);box-shadow:0 0 0 2px var(--line-2) inset;transition:transform 160ms var(--ease-out)}
.stn:active .dot{transform:scale(.9)}
.stn.past .dot{background:var(--blue);box-shadow:none}
.stn.now .dot{width:22px;height:22px;margin-top:1px;background:var(--blue);box-shadow:0 0 0 6px var(--blue-tint)}
.stn b{font:600 13px/1.2 var(--sans);overflow-wrap:anywhere}
.stn.future b{color:var(--ink-2);font-weight:500}
.stn small{font:500 10.5px/1.2 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.stn.now small{color:var(--blue)}

/* next steps */
.next{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.nx{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start;padding:16px 18px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);min-width:0;transition:transform 160ms var(--ease-out),box-shadow 200ms ease}
.nx:active{transform:scale(.98)}
.nx:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.nx .ava{margin-top:1px}
.nx-b{display:grid;gap:4px;min-width:0}
.nx-t{font:600 15.5px/1.25 var(--sans)}
.nx-s{font-size:13.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nx.empty{cursor:default}

/* view bar */
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:4px;border-radius:14px;background:var(--card-2);box-shadow:0 0 0 1px var(--line) inset}
.seg a,.seg button{border:0;background:transparent;padding:8px 14px;border-radius:10px;font:500 13.5px/1 var(--sans);color:var(--ink-2);text-decoration:none;white-space:nowrap;transition:background-color 200ms ease,color 200ms ease,transform 160ms var(--ease-out)}
.seg a:active,.seg button:active{transform:scale(.97)}
.seg a[aria-current="page"],.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg.sm a,.seg.sm button{padding:6px 11px;font-size:13px}
.who{display:flex;align-items:center;gap:8px}

/* status ring with a check that draws */
.ring{appearance:none;width:22px;height:22px;margin-top:1px;border-radius:50%;border:2px solid var(--line-2);background:transparent;padding:0;position:relative;flex:none;display:grid;place-items:center;transition:transform 160ms var(--ease-out),border-color 200ms ease,background-color 200ms ease}
.ring:active:not([disabled]){transform:scale(.9)}
.ring svg{width:12px;height:12px;overflow:visible}
.ring path{fill:none;stroke:var(--on-blue);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14;stroke-dashoffset:14;transition:stroke-dashoffset 240ms var(--ease-out) 60ms}
.ring.doing{border-color:var(--blue);background:conic-gradient(var(--blue) 0 50%,transparent 0) content-box;padding:3px}
.ring.doing svg{display:none}
.ring.done{border-color:var(--blue);background:var(--blue)}
.ring.done path{stroke-dashoffset:0}
.ring.unknown{border-style:dashed;border-color:var(--unknown)}
.ring.unknown svg{display:none}
.ring.unknown::after{content:"?";font:600 11px/1 var(--sans);color:var(--unknown)}
@media (hover:hover) and (pointer:fine){.ring:hover:not([disabled]){border-color:var(--blue)}}
@keyframes pop{0%{transform:scale(.82)}100%{transform:scale(1)}}
.ring.just{animation:pop 300ms var(--ease-out)}

/* rows */
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 8px;border-radius:12px;transition:background-color 150ms ease}
@media (hover:hover) and (pointer:fine){.row:hover{background:var(--card-2)}}
.open{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:0}
.open:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}
.rt{font:500 14.5px/1.3 var(--sans);overflow-wrap:anywhere}
.row.is-done .rt,.tcard.is-done .rt{color:var(--ink-3)}
.rm{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.chip{font:500 10.5px/1.2 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.chip.dec{color:var(--blue-ink);background:var(--blue-tint);padding:3px 7px;border-radius:999px}
.chip.late{color:var(--late)}
.none{margin:4px 8px;font-size:13.5px;color:var(--ink-3)}

/* subtask bar: one segment per subtask */
.segbar{display:flex;gap:3px;height:4px;width:min(120px,100%)}
.segbar i{flex:1;border-radius:2px;background:var(--line);overflow:hidden;position:relative}
.segbar i::after{content:"";position:absolute;inset:0;background:var(--blue);transform:scaleX(0);transform-origin:left;transition:transform 300ms var(--ease-out)}
.segbar i.on::after{transform:scaleX(1)}

/* departments */
.depts{display:grid;gap:14px;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start}
.dept{padding:10px 10px 12px;display:grid;gap:10px;min-width:0}
.dept-head{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:8px 8px 6px;border-radius:14px;transition:background-color 150ms ease,transform 160ms var(--ease-out)}
.dept-head:active{transform:scale(.98)}
.dept-head:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (hover:hover) and (pointer:fine){.dept-head:hover{background:var(--card-2)}.dept-head:hover .go{opacity:1;transform:none}}
.dept h2{margin:0;font:600 16.5px/1.2 var(--sans);text-wrap:balance}
.dh-side{display:flex;align-items:center;gap:8px}
.pr{position:relative;width:38px;height:38px;flex:none}
.pr svg{width:38px;height:38px;transform:rotate(-90deg)}
.pr circle{fill:none;stroke-width:4}
.pr .bg{stroke:var(--line)}
.pr .fg{stroke:var(--blue);stroke-linecap:round;transition:stroke-dashoffset 700ms var(--ease-out)}
.pr span{position:absolute;inset:0;display:grid;place-items:center;font:600 italic 14px/1 var(--display)}
.dh-meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.dh-meta .unset{color:var(--late)}
.go{font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--blue);opacity:.0;transform:translateX(-4px);transition:opacity 200ms ease,transform 200ms var(--ease-out)}
.dept .scale.sm{margin:0 8px}
.add{display:flex;padding:2px 2px 0}
.add input{flex:1;min-width:0;border:1px dashed var(--line-2);background:transparent;border-radius:12px;padding:9px 12px;font-size:13.5px}
.add input::placeholder{color:var(--ink-3)}
.add input:focus{outline:none;border-style:solid;border-color:var(--blue)}

/* one department, full width */
.focus{position:relative;padding:22px 22px 24px;display:grid;gap:18px}
.focus.morphing{background:transparent;box-shadow:none}
.fh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px 20px;align-items:center}
.back{border:0;background:var(--card-2);border-radius:999px;padding:9px 14px;font:500 13.5px/1 var(--sans);color:var(--ink-2);display:inline-flex;gap:8px;align-items:center;transition:transform 160ms var(--ease-out)}
.back:active{transform:scale(.96)}
.fh h2{margin:0;font:600 italic 46px/.95 var(--display);letter-spacing:-.005em}
.fh-sub{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:13px;color:var(--ink-2)}
.fh-num{font-family:var(--display);font-style:italic;line-height:.85;display:flex;align-items:baseline;gap:3px}
.fh-num b{font-size:56px;font-weight:600}
.fh-num span{font-size:24px;font-weight:500;color:var(--ink-3)}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.tcard{border-radius:18px;background:var(--card-2);padding:14px 14px 12px;display:grid;gap:10px;align-content:start;min-width:0}
.tcard.dec{box-shadow:0 0 0 1.5px var(--blue-tint) inset}
.tc-h{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start}
.tc-h .rt{font-size:16px;font-weight:600}
.tc-next{margin:0 0 0 32px;font-size:13.5px;color:var(--ink-2)}
.tc-next b{color:var(--ink);font-weight:500}
.subs{list-style:none;margin:0 0 0 32px;padding:0;display:grid;gap:2px}
.sub{display:grid;grid-template-columns:18px minmax(0,1fr);gap:9px;align-items:start;padding:4px 0;font-size:13.5px}
.sub.on span{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
.sbx{appearance:none;width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line-2);background:var(--card);padding:0;display:grid;place-items:center;margin-top:1px;transition:transform 160ms var(--ease-out),background-color 200ms ease,border-color 200ms ease}
.sbx:active:not([disabled]){transform:scale(.88)}
.sbx svg{width:10px;height:10px;overflow:visible}
.sbx path{fill:none;stroke:var(--on-blue);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14;stroke-dashoffset:14;transition:stroke-dashoffset 220ms var(--ease-out) 40ms}
.sbx.on{background:var(--blue);border-color:var(--blue)}
.sbx.on path{stroke-dashoffset:0}
.tc-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-left:32px}
.focus .scale i{max-width:40px}
.morph{position:fixed;z-index:30;background:var(--card);border-radius:var(--r);box-shadow:var(--lift);pointer-events:none;transform-origin:0 0;will-change:transform}

/* matrix */
.matrix{display:grid;grid-template-columns:28px repeat(2,minmax(0,1fr));gap:12px}
.ax{display:flex;align-items:center;justify-content:center}
.ax-y{writing-mode:vertical-rl;transform:rotate(180deg)}
.quad{padding:16px 10px 10px;display:grid;gap:8px;align-content:start;min-width:0}
.quad.q-do{background:var(--blue-tint);box-shadow:none}
.quad-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 8px}
.quad-h h3{margin:0;font:600 17px/1.2 var(--sans)}
.quad-h b{font:600 italic 30px/1 var(--display)}
.done-toggle{all:unset;cursor:pointer;margin:2px 8px;font-size:12.5px;color:var(--ink-3)}

/* calendar */
.cal-card{padding:18px 18px 14px}
.cal-scroll{overflow-x:auto}
.cal{position:relative;display:grid;gap:8px;padding-bottom:4px}
.days{display:grid;grid-template-columns:repeat(var(--days),minmax(0,1fr))}
.ruler{height:46px;align-items:end;border-bottom:1px solid var(--line-2)}
.ruler i{grid-row:1;align-self:end;height:6px;border-left:1px solid var(--line-2)}
.ruler i.mon{height:12px;border-left-color:var(--ink-3)}
.ruler .wk{grid-row:1;align-self:start;font:500 11px/1 var(--mono);color:var(--ink-3);padding-left:4px;white-space:nowrap}
.ruler .mo{grid-row:1;align-self:start;margin-top:16px;font:500 11px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);padding-left:4px;white-space:nowrap}
.lane{row-gap:6px}
.cal .days,.cal .weeks{position:relative;z-index:1}
.sbar{all:unset;cursor:pointer;min-width:0;border-radius:10px;padding:8px 10px;background:var(--card-2);box-shadow:0 0 0 1px var(--line) inset;font:500 13px/1.2 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform 160ms var(--ease-out)}
.sbar:active{transform:scale(.98)}
.sbar.now{background:var(--blue);color:var(--on-blue);box-shadow:none}
.sbar.band{padding:6px 10px;font-size:12.5px;color:var(--ink-2);background:var(--card);box-shadow:0 0 0 1px var(--line-2) inset;border-radius:999px}
.weeks{display:grid;grid-template-columns:repeat(var(--weeks),minmax(0,1fr));min-height:60px}
.wcol{display:grid;gap:6px;align-content:start;padding:8px 4px;border-left:1px solid var(--line);min-width:0}
.wchip{all:unset;cursor:pointer;display:block;min-width:0;padding:6px 8px;border-radius:9px;background:var(--card-2);font:500 12.5px/1.25 var(--sans);overflow-wrap:anywhere;transition:transform 160ms var(--ease-out)}
.wchip:active{transform:scale(.97)}
.wchip small{display:block;font:500 10.5px/1.2 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.wchip.late small{color:var(--late)}
.wchip.is-done{color:var(--ink-3)}
.today{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--blue);pointer-events:none;z-index:0}
.today span{position:absolute;top:-2px;left:4px;font:500 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--blue);background:var(--card);padding:2px 3px;white-space:nowrap}
.agenda{display:none;gap:12px}
.ag{padding:16px 10px 10px;display:grid;gap:6px}
.ag-h{padding:0 8px;display:grid;gap:2px}
.ag-h h3{margin:0;font:600 16px/1.25 var(--sans)}
.ag.now{box-shadow:0 0 0 2px var(--blue) inset}

/* states */
.state{padding:44px 24px;text-align:center;display:grid;gap:8px;justify-items:center}
.state h2{margin:0;font:600 18px/1.3 var(--sans)}
.state p{margin:0;max-width:46ch;color:var(--ink-2)}
.lock-ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--blue-tint);color:var(--blue);margin-bottom:6px}

/* side panel */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;transition:opacity 300ms ease}
.scrim.on{opacity:1}

.pills button:active{transform:scale(.96)}

.field{display:grid;gap:8px;align-content:start;min-width:0}

.people{display:flex;flex-wrap:wrap;gap:6px}

.hint{font-size:12.5px;color:var(--ink-3)}
.sec{display:grid;gap:5px}

.linkish{all:unset;cursor:pointer;font-size:14px;color:var(--blue);text-decoration:underline;text-underline-offset:3px}

  .ring.just{animation:none}
}

<body>
<div class="wrap">
  <header class="top">
    <div><h1>Sedulo on one page</h1><span class="label" id="asof"></span></div>
    <div class="me" id="meWrap" hidden><button type="button" class="btn2" data-act="copylink" style="padding:7px 12px;font-size:13px">Copy link for Justus</button><span class="label">I am</span><div class="seg sm" id="meSeg" role="group" aria-label="Who is using the board"></div></div>
  </header>

  <section class="hero card" id="hero" hidden>
    <div class="reading">
      <div class="num" aria-hidden="true"><b id="doneN">0</b><span>/<span id="totalN">0</span></span></div>
      <span class="label">tasks done</span>
    </div>
    <div class="gauge">
      <div class="scale" id="scale" role="img"></div>
      <ul class="legend" aria-label="What the ticks mean">
        <li><span class="ring done"></span>Done</li>
        <li><span class="ring doing"></span>In progress</li>
        <li><span class="ring"></span>Not started</li>
        <li><span class="ring unknown"></span>Not known</li>
      </ul>
    </div>
    <nav class="route" id="route" aria-label="Roadmap"></nav>
  </section>

  <section class="next" id="next" aria-label="Next steps" hidden></section>

  <div class="bar" id="bar" hidden>
    <nav class="seg tabs" aria-label="Views">
      <a href="#board" data-view="board">Departments</a>
      <a href="#matrix" data-view="matrix">Matrix</a>
      <a href="#calendar" data-view="calendar">Calendar</a>
    </nav>
    <div class="who"><span class="label">Show</span><div class="seg" id="who" role="group" aria-label="Whose tasks"></div></div>
  </div>

  <main id="main">
    <div class="state card" id="state">
      <h2>Loading the board</h2>
      <p>Departments, tasks and the road appear here in a moment.</p>
    </div>
    <section id="v-board" hidden><div class="depts" id="depts"></div></section>
    <section id="v-focus" hidden></section>
    <section id="v-matrix" hidden><div class="matrix" id="matrixGrid"></div></section>
    <section id="v-calendar" hidden>
      <div class="cal-card card"><div class="cal-scroll"><div class="cal" id="cal"></div></div></div>
      <div class="agenda" id="agenda"></div>
    </section>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dwTitle" hidden>
  <div class="dw-head"><span class="label" id="dwEyebrow"></span><button class="x" id="dwClose" type="button">Close</button></div>
  <div class="dw-scroll">
    <div id="dwBody"></div>
    <section class="notes sec" id="dwNotesWrap">
      <span class="label">Notes</span>
      <ol id="dwNotes"></ol>
      <form class="composer" id="noteForm">
        <label for="noteText" hidden>Write a note</label>
        <textarea id="noteText" placeholder="Write a note"></textarea>
        <div class="row-end"><button class="btn2" type="submit">Add note</button></div>
      </form>
    </section>
  </div>
  <div class="dw-foot" id="dwFoot"></div>
</aside>
<div class="toast off" id="toast" role="status" aria-live="polite"></div>

<script>

    $("#dwEyebrow").textContent = s.band ? "The whole time" : "Road, step " + s.order + (now && now.id === s.id ? ", now" : "");
    var h = '<div class="sec" style="gap:6px"><h2 class="dw-title" id="dwTitle">' + esc(s.title) + '</h2><p style="color:var(--ink-2)">' + esc(s.when || "") +
      (a && b && !s.band ? " (" + esc(fmtDay(a)) + " to " + esc(fmtDay(b)) + ")" : "") + '</p></div>';
    if (s.items && s.items.length) h += '<div class="sec"><span class="label">What it takes</span><ul class="subs dw">' + s.items.map(function (x) { return '<li class="sub"><span class="sbx" aria-hidden="true"></span><span>' + esc(x) + '</span></li>'; }).join("") + '</ul></div>';
    h += '<div class="sec"><span class="label">Tasks</span>' + (list.length ? '<ul class="rows" style="margin:0 -8px">' + list.map(function (t) { return rowHTML(t, { dept: true }); }).join("") + '</ul>' : '<p class="none">None yet.</p>') + '</div>';
    $("#dwBody").innerHTML = '<div style="display:grid;gap:20px">' + h + '</div>';
    $("#dwNotesWrap").hidden = true; $("#dwFoot").innerHTML = "";
  }
  function renderNotes() {
    if (!S.open || S.open.kind !== "task") return;
    var list = S.notes.filter(function (n) { return n.task === S.open.id; });
    $("#dwNotes").innerHTML = list.length ? list.map(function (n) {
      return '<li class="note">' + ava(n.by === "Adam" || n.by === "Justus" ? n.by : "Not set", true) + '<div class="note-b"><span class="label">' + esc(n.by || "Someone") + ', ' + esc(fmtStamp(n.at)) + '</span><p>' + esc(n.text) + '</p></div></li>';
    }).join("") : '<li class="none" style="margin:0">No notes yet.</li>';
  }

  /* ---------- motion: one department, opened and closed ---------- */
  var running = [];
  function anim(el, kf, opt) { if (!el || !el.animate) return null; var a = el.animate(kf, opt); running.push(a); return a; }
  function stopMotion() {
    running.forEach(function (a) { try { a.cancel(); } catch (e) { } }); running = [];
    $$(".morph").forEach(function (m) { m.remove(); });
    var f = $("#focus"); if (f) f.classList.remove("morphing");
  }
  function morph(from, to, dur) {
    var m = document.createElement("div");
    m.className = "morph";
    m.style.left = to.left + "px"; m.style.top = to.top + "px"; m.style.width = to.width + "px"; m.style.height = to.height + "px";
    document.body.appendChild(m);
    var a = anim(m, [
      { transform: "translate(" + (from.left - to.left) + "px," + (from.top - to.top) + "px) scale(" + (from.width / to.width) + "," + (from.height / to.height) + ")" },
      { transform: "none" }
    ], { duration: dur, easing: "cubic-bezier(.32,.72,0,1)", fill: "forwards" });
    return { el: m, a: a };
  }
  function scrollToMain() {
    var y = $("#main").getBoundingClientRect().top + window.scrollY - 16;
    if (window.scrollY > y) window.scrollTo(0, y);
  }
  function openDept(id, card) {
    if (reduced || !card || !card.animate) { navigate("dept-" + id); return; }
    stopMotion();
    var first = card.getBoundingClientRect(), y0 = window.scrollY, fx = first.left + first.width / 2;
    /* the four others step back together, away from the one you opened */
    $$(".dept").forEach(function (c) {
      if (c === card) return;
      var r = c.getBoundingClientRect(), dir = (r.left + r.width / 2) < fx ? -16 : 16;
      anim(c, [{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateX(" + dir + "px) scale(.96)" }], { duration: 200, easing: "cubic-bezier(.23,1,.32,1)", fill: "forwards" });
    });
    anim(card, [{ opacity: 1 }, { opacity: 0 }], { duration: 120, easing: "ease", fill: "forwards" });
    setTimeout(function () {
      S.focus = id; S.view = "board";
      history.pushState(null, "", "#dept-" + id);
      showView();
      scrollToMain();
      var panel = $("#focus"); if (!panel) return;
      var to = panel.getBoundingClientRect(), dy = y0 - window.scrollY;
      var from = { left: first.left, top: first.top + dy, width: first.width, height: first.height };
      panel.classList.add("morphing");
      var inner = $(".focus-in", panel);
      inner.style.opacity = "0";
      var mo = morph(from, to, 560);
      /* the department's own content lands with the panel: header first, then its tasks in a short wave */
      setTimeout(function () {
        inner.style.opacity = "";
        anim($(".fh", panel), [{ opacity: 0, transform: "translateY(14px)" }, { opacity: 1, transform: "none" }], { duration: 420, easing: "cubic-bezier(.23,1,.32,1)", fill: "backwards" });
        anim($(".scale", panel), [{ opacity: 0 }, { opacity: 1 }], { duration: 360, delay: 60, easing: "ease", fill: "backwards" });
        $$(".tcard", panel).forEach(function (c, i) {
          var dly = 90 + Math.round(240 * (1 - Math.pow(1 - Math.min(i, 8) / 8, 2)));
          anim(c, [{ opacity: 0, transform: "translateY(" + (18 - Math.min(i, 6)) + "px) scale(.985)" }, { opacity: 1, transform: "none" }], { duration: 460, delay: dly, easing: "cubic-bezier(.23,1,.32,1)", fill: "backwards" });
        });
        anim($(".add", panel), [{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: 300, easing: "ease", fill: "backwards" });
      }, 300);
      if (mo.a) mo.a.onfinish = function () { panel.classList.remove("morphing"); mo.el.remove(); };
      else { panel.classList.remove("morphing"); mo.el.remove(); }
    }, 130);
  }
  function closeDept() {
    var panel = $("#focus"), id = S.focus;
    if (reduced || !panel || !panel.animate) { navigate("board"); return; }
    stopMotion();
    var first = panel.getBoundingClientRect(), y0 = window.scrollY;
    anim($(".focus-in", panel), [{ opacity: 1 }, { opacity: 0 }], { duration: 140, easing: "ease", fill: "forwards" });
    setTimeout(function () {
      S.focus = null; S.view = "board";
      history.pushState(null, "", "#board");
      showView();
      var card = $('.dept[data-dept="' + id + '"]');
      if (!card) return;
      var to = card.getBoundingClientRect(), dy = y0 - window.scrollY;
      var from = { left: first.left, top: first.top + dy, width: first.width, height: first.height };
      card.style.opacity = "0";
      var others = $$(".dept").filter(function (c) { return c !== card; });
      var mo = morph(from, to, 460);
      others.forEach(function (c, i) {
        anim(c, [{ opacity: 0, transform: "scale(.97)" }, { opacity: 1, transform: "none" }], { duration: 320, delay: 180 + i * 28, easing: "cubic-bezier(.23,1,.32,1)", fill: "backwards" });
      });
      var done = function () { card.style.opacity = ""; mo.el.remove(); anim(card, [{ opacity: .4 }, { opacity: 1 }], { duration: 160, easing: "ease" }); };
      if (mo.a) mo.a.onfinish = done; else done();
    }, 120);
  }

  /* ---------- routing and the whole page ---------- */
  function routeFromHash() {
    var h = (location.hash || "").slice(1);
    var m = h.match(/^dept-([a-z0-9_-]+)$/);
    if (m) { S.view = "board"; S.focus = m[1]; return; }
    S.focus = null;
    S.view = ["board", "matrix", "calendar"].indexOf(h) >= 0 ? h : "board";
  }
  function navigate(h) { location.hash = h; }
  function showView(animate) {
    var focus = S.view === "board" && S.focus && renderFocus();
    if (!focus) S.focus = null;
    var target = focus ? "focus" : S.view;
    ["board", "focus", "matrix", "calendar"].forEach(function (v) { $("#v-" + v).hidden = v !== target; });
    $$(".tabs a").forEach(function (a) { a.setAttribute("aria-current", a.dataset.view === S.view ? "page" : "false"); });
    if (target === "board") renderBoard(); else if (target === "matrix") renderMatrix(); else if (target === "calendar") renderCalendar();
    if (animate && !reduced) { var el = $("#v-" + target); el.classList.remove("swap"); void el.offsetWidth; el.classList.add("swap"); }
  }
  function render() {
    var st = $("#state"), msg = null;
    if (!S.key) msg = ["lock", "This board is private", "Open it with your link. Adam has it."];
    else if (S.failed === "badkey") msg = ["lock", "This link doesn't open the board", "Ask Adam for the current link."];
    else if (S.failed === "error" && !S.loaded) msg = ["", "The board did not load", "Check the connection. It tries again by itself."];
    else if (!S.loaded) msg = ["", "Loading the board", "Departments, tasks and the road appear here in a moment."];
    else if (!S.tasks.length || !depts().length) msg = ["", "No tasks yet", "Ask Claude to fill the board."];
    var showAll = !msg;
    ["#hero", "#next", "#bar", "#meWrap"].forEach(function (s) { $(s).hidden = !showAll; });
    if (msg) {
      ["board", "focus", "matrix", "calendar"].forEach(function (v) { $("#v-" + v).hidden = true; });
      st.hidden = false;
      st.innerHTML = (msg[0] === "lock" ? '<div class="lock-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>' : "") +
        "<h2>" + esc(msg[1]) + "</h2><p>" + esc(msg[2]) + "</p>";
      return;
    }
    st.hidden = true;
    renderTop();
    if (S.firstPaint && !reduced) {
      $("#hero").classList.add("in"); $("#hero").style.setProperty("--d", "0ms");
      $$(".nx", $("#next")).forEach(function (el, i) { el.classList.add("in"); el.style.setProperty("--d", [70, 118, 152][i] + "ms"); el.style.setProperty("--rise", "8px"); });
      $("#bar").classList.add("fadein"); $("#bar").style.setProperty("--d", "170ms");
    }
    if (!$(".morph")) showView(false);
    if (S.open) renderPanel();
    S.firstPaint = false;
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b) { if (e.target === $("#scrim")) closePanel(); return; }
    var act = b.dataset.act, id = b.dataset.id, t = task(id);
    if (act === "open" && t) openPanel("task", id, b);
    else if (act === "stage") openPanel("stage", id, b);
    else if (act === "tick" && t) {
      var wasDone = t.status === "done";
      toggleDone(t);
      if (!wasDone && !reduced) $$('.ring[data-id="' + id + '"]').forEach(function (r) { r.classList.add("just"); });
    }
    else if (act === "sub" && t) toggleSub(t, b.dataset.sub);
    else if (act === "subdel" && t) delSub(t, b.dataset.sub);
    else if (act === "status" && S.open) { var tt = task(S.open.id); if (tt) setStatus(tt, id); }
    else if (act === "owner" && S.open) { var to = task(S.open.id); if (to) patchTask(to, { owner: id }); }
    else if (act === "quad" && S.open) { var tq = task(S.open.id); if (tq) patchTask(tq, { quadrant: id }); }
    else if (act === "who") { S.who = id; store("sedulo-board-who", id); render(); }
    else if (act === "copylink") {
      var link = location.origin + location.pathname + "#k=" + S.key;
      var ok = function () { toast("Link copied. Send it to Justus: it opens the board for him."); };
      var fallback = function () {
        var ta = document.createElement("textarea"); ta.value = link; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); ok(); } catch (er) { toast("Copy didn't work in this browser."); }
        ta.remove();
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(ok, fallback); else fallback();
    }
    else if (act === "me") { S.me = S.me === id ? null : id; store("sedulo-board-me", S.me); render(); }
    else if (act === "showdone") { S.showDone[id] = !S.showDone[id]; render(); }
    else if (act === "focus") openDept(id, b.closest(".dept"));
    else if (act === "unfocus") closeDept();
    else if (act === "delete" && t) { if (S.armedDelete) deleteTask(t); else { S.armedDelete = true; renderPanel(); } }
  });
  document.addEventListener("change", function (e) {
    if (e.target.id !== "pDue" || !S.open) return;
    var t = task(S.open.id); if (t) patchTask(t, { due: e.target.value || null });
  });
  document.addEventListener("submit", function (e) {
    var f = e.target;
    if (f.classList.contains("add")) {
      e.preventDefault();
      var inp = $("input", f), title = (inp.value || "").trim();
      if (title) { inp.value = ""; addTask(f.dataset.dept, title.slice(0, 80)); }
    } else if (f.id === "subForm") {
      e.preventDefault();
      var si = $("#subText"), st = (si.value || "").trim(), t = S.open && task(S.open.id);
      if (st && t) { si.value = ""; addSub(t, st.slice(0, 80)); }
    } else if (f.id === "noteForm") {
      e.preventDefault();
      var ta = $("#noteText"), text = (ta.value || "").trim();
      if (!text || !S.open) return;
      if (!S.me) { toast("Pick who you are at the top first: Adam or Justus."); return; }
      var btn = $("button", f); btn.disabled = true;
      addNote(S.open.id, text.slice(0, 2000)).then(function (ok) { btn.disabled = false; if (ok) ta.value = ""; });
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { if (S.open) { e.preventDefault(); closePanel(); } else if (S.focus) { e.preventDefault(); navigate("board"); } }
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && document.activeElement === $("#noteText")) { e.preventDefault(); $("#noteForm").requestSubmit(); }
  });
  $("#dwClose").addEventListener("click", closePanel);
  window.addEventListener("hashchange", function () { stopMotion(); routeFromHash(); if (S.loaded) showView(true); });
  window.addEventListener("popstate", function () { stopMotion(); routeFromHash(); if (S.loaded) showView(true); });

  var toastTimer = null;
  function toast(msg) {
    var el = $("#toast"); el.textContent = msg; el.classList.remove("off");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.add("off"); }, 4200);
  }

  /* ---------- start: the key comes once in the link, then lives in this browser ---------- */
  (function start() {
    var m = (location.hash || "").match(/(?:^#|&)k=([A-Za-z0-9_-]{24,200})/);
    if (m) { store("sedulo-board-key", m[1]); history.replaceState(null, "", location.pathname + location.search + "#board"); }
    S.key = load("sedulo-board-key");
    S.me = load("sedulo-board-me");
    var w = load("sedulo-board-who"); if (w && WHO.some(function (x) { return x.id === w; })) S.who = w;
    routeFromHash();
    render();
    if (!S.key) return;
    var tries = 0;
    (function first() {
      fetchAll().then(function () { render(); poll(); }).catch(function () {
        S.failed = "error"; render();
        if (++tries < 30) setTimeout(first, 10000);
      });
    })();
  })();
})();
</script>
</body>
</html>
