<!doctype html>
<html lang="en" data-brand="readout">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>readout for trainers, iPad app</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap">
<script>if(innerWidth<1100)location.replace("../?mode=app")</script>
<style>
/* The package's shared kit: two brand looks (readout, about ten.), the shell, cards, figures, charts and motion.
   Rule for these screens: numbers and pictures first, labels of one or two words, no sentences. */
:root{--ease:cubic-bezier(.23,1,.32,1);--ease-io:cubic-bezier(.77,0,.175,1);--ease-drawer:cubic-bezier(.32,.72,0,1);--side:240px}
[data-brand="readout"]{--bg:#F5F5F2;--card:#fff;--ink:#17181A;--mute:#62666D;--mute2:#8B8D90;--line:#E3E4E0;--soft:#EEEEEB;
  --acc:#2747D6;--acc2:#1539F5;--accsoft:#EEF1FE;--good:#1F8A5B;--warn:#C26616;--amber:#C26616;--teal:#2B9C8F;
  --hero:radial-gradient(120% 140% at 15% 0%,#4A68EC 0%,#2747D6 26%,#16267A 62%,#0A1236 100%);
  --r0:#F0F2FB;--r1:#C9D3FF;--r2:#8CA2FF;--r3:#4C68E6;--r4:#2747D6;--r5:#13235E;
  --c1:#2747D6;--c2:#8CA2FF;--c3:#C26616;--c4:#2B9C8F;--c5:#17181A;
  --t:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--m:"Geist Mono",ui-monospace,Menlo,monospace;--d:"Geist",system-ui,sans-serif;
  --rad:22px;--radsm:14px;--shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.045)}
[data-brand="abten"]{--bg:#F1F0EE;--card:#fff;--ink:#0A0A0A;--mute:#66625C;--mute2:#8E8A83;--line:#E3E1DC;--soft:#F4F3F0;
  --acc:#D7201B;--acc2:#B3140F;--accsoft:#FBE3E1;--good:#2E7D4F;--warn:#C26616;--amber:#C26616;--teal:#2E7D6F;
  --hero:radial-gradient(120% 130% at 30% 10%,#C21A1B 0%,#8C0D10 48%,#350405 100%);
  --r0:#FBEDEC;--r1:#F6C9C6;--r2:#EE8C86;--r3:#D7201B;--r4:#A3120E;--r5:#4A0607;
  --c1:#D7201B;--c2:#F2A39F;--c3:#0A0A0A;--c4:#8E8A83;--c5:#6E0B09;
  --t:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--m:"Instrument Sans",system-ui,sans-serif;--d:"Instrument Serif","Times New Roman",serif;
  --rad:20px;--radsm:14px;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 30px -8px rgba(40,20,10,.08)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--t);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
p,h1,h2,h3,h4{margin:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* type */
.lab{font-family:var(--m);font-size:.68rem;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
[data-brand="abten"] .lab{font-size:.8rem;font-weight:600;letter-spacing:0;text-transform:lowercase}
.ttl{font-family:var(--d);font-weight:500;font-size:2rem;letter-spacing:-.035em;line-height:1.05}
[data-brand="abten"] .ttl{font-weight:400;font-size:2.8rem;letter-spacing:-.01em;line-height:.92;text-transform:lowercase}
.num{font-family:var(--d);font-weight:400;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
[data-brand="abten"] .num{letter-spacing:-.02em}
.mute{color:var(--mute)}
.smp{display:inline-flex;align-items:center;gap:6px;font-family:var(--m);font-size:.64rem;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:var(--card)}
[data-brand="abten"] .smp{font-size:.74rem;letter-spacing:0;text-transform:lowercase;font-weight:600}
.smp::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn)}

/* shell */
.app{min-height:100vh;display:grid;grid-template-columns:var(--side) minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:16px;padding:22px 14px 18px;border-right:1px solid var(--line)}
.logo{display:inline-flex;flex-direction:column;gap:5px;text-decoration:none;padding:0 8px}
.logo b{font-weight:600;font-size:1.45rem;letter-spacing:-.045em;line-height:1}
.logo .ticks{display:flex;gap:3px;align-items:flex-end;height:10px}.logo .ticks i{width:1.5px;height:5px;background:#B9BBBE;border-radius:1px}.logo .ticks i.on{height:10px;background:var(--acc)}
[data-brand="abten"] .logo b{font-family:var(--d);font-style:italic;font-weight:400;font-size:1.9rem;letter-spacing:-.01em}
[data-brand="abten"] .logo .ticks{display:none}
.logo small{font-family:var(--m);font-size:.64rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
[data-brand="abten"] .logo small{font-size:.78rem;letter-spacing:0;text-transform:lowercase;font-weight:600}
.who{padding:0 8px;display:flex;gap:10px;align-items:center}
.who b{display:block;font-weight:600;font-size:.95rem}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:.86rem;background:var(--accsoft);color:var(--acc2)}
.av.lg{width:64px;height:64px;font-size:1.3rem}
[data-brand="abten"] .av{font-family:var(--d);font-weight:400;font-size:1.05rem}
[data-brand="abten"] .av.lg{font-size:1.7rem}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--mute);font-weight:500;font-size:.95rem;transition:background-color .15s ease,color .15s ease}
.nav a svg{flex:none}
.nav a .badge{margin-left:auto;min-width:22px;height:22px;border-radius:999px;background:var(--acc);color:#fff;font-size:.74rem;font-weight:600;display:grid;place-items:center;padding:0 6px}
.nav a[aria-current="page"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
[data-brand="abten"] .nav a{text-transform:lowercase}
@media (hover:hover) and (pointer:fine){.nav a:hover{color:var(--ink)}}
.sidefoot{margin-top:auto;padding:0 8px;display:grid;gap:8px}
.wk{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px}
.wk button{width:34px;height:34px;border:0;border-radius:10px;background:none;display:grid;place-items:center;transition:background-color .15s ease,transform .16s var(--ease)}
.wk button:active{transform:scale(.94)}.wk button:disabled{opacity:.3;cursor:default}
.wk div{text-align:center;line-height:1.2}.wk div b{display:block;font-weight:600;font-size:.92rem}.wk div span{font-size:.74rem;color:var(--mute)}
[data-brand="abten"] .wk div b{text-transform:lowercase}
.top,.tabbar{display:none}
main{min-width:0;padding:26px 34px 60px;max-width:1320px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:20px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* cards and controls */
.card{background:var(--card);border-radius:var(--rad);box-shadow:var(--shadow);padding:20px;min-width:0;position:relative}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.ch h3{font-weight:500;font-size:1rem;letter-spacing:-.01em}
[data-brand="abten"] .ch h3{font-family:var(--d);font-weight:400;font-size:1.55rem;line-height:1;text-transform:lowercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:9px 16px;border:1px solid var(--line);background:var(--card);font-weight:500;font-size:.88rem;text-decoration:none;white-space:nowrap;transition:transform .16s var(--ease),background-color .2s ease,border-color .2s ease,color .2s ease}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
[data-brand="readout"] .btn.p{background:var(--ink);border-color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:.82rem}
[data-brand="abten"] .btn{text-transform:lowercase}
@media (hover:hover) and (pointer:fine){.btn:hover{border-color:var(--mute2)}.btn.p:hover{filter:brightness(1.12)}}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.76rem;font-weight:500;background:var(--soft);color:var(--mute);white-space:nowrap}
[data-brand="abten"] .chip{text-transform:lowercase}
.chip.on{background:var(--ink);color:#fff}
.chip.a{background:var(--accsoft);color:var(--acc2)}
.chip.g{background:#E3F4EA;color:var(--good)}
.chip.w{background:#FFF1DE;color:#94500F}
.chip svg{flex:none}
.seg{display:inline-flex;gap:3px;background:var(--soft);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 13px;font-weight:500;font-size:.84rem;color:var(--mute);transition:background-color .2s ease,color .2s ease}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
[data-brand="abten"] .seg button{text-transform:lowercase}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:.8rem;font-weight:600;font-variant-numeric:tabular-nums;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--mute)}
.delta.up{background:#E3F4EA;color:var(--good)}.delta.down{background:#FCE9E3;color:#B5480E}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.rows2{grid-row:span 2}

/* figures */
.fig{display:grid;gap:6px;align-content:start}
.fig .num{font-size:2.3rem}
.fig.big .num{font-size:clamp(2.6rem,4.6vw,3.8rem)}
.hero .fig.big .num{font-size:clamp(2rem,3vw,3rem)}
[data-brand="abten"] .hero .fig.big .num{font-size:clamp(2.4rem,3.6vw,3.6rem)}
.hb.wide div{grid-template-columns:minmax(0,1.6fr) minmax(40px,1fr) 40px}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}

/* hero band */
.hero{position:relative;overflow:hidden;border-radius:calc(var(--rad) + 4px);background:var(--hero);color:#fff;padding:24px 26px}
.hero .lab{color:rgba(255,255,255,.72)}
.hero .num{color:#fff}
.hero .delta{background:rgba(255,255,255,.16);color:#fff}
.hero .mute{color:rgba(255,255,255,.7)}
.hero h1{font-family:var(--d);font-weight:500;font-size:clamp(1.9rem,3.4vw,2.8rem);letter-spacing:-.04em;line-height:1}
[data-brand="abten"] .hero h1{font-weight:400;font-size:clamp(2.6rem,5vw,4.2rem);letter-spacing:-.01em;text-transform:lowercase;line-height:.9}
.glow{position:absolute;inset:auto -20% -60% 30%;height:120%;background:radial-gradient(closest-side,rgba(255,255,255,.18),rgba(255,255,255,0));pointer-events:none;animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-12%,-6%) scale(1.08)}}

/* charts */
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;padding:7px 10px;font-size:.8rem;line-height:1.3;box-shadow:0 8px 20px rgba(0,0,0,.2);opacity:0;transform:translateY(4px);transition:opacity .12s ease,transform .12s ease;white-space:nowrap}
.tip.on{opacity:1;transform:none}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:.76rem;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hb{display:grid;gap:9px}
.hb div{display:grid;grid-template-columns:minmax(0,1fr) minmax(60px,1.4fr) minmax(44px,auto);gap:10px;align-items:center;font-size:.86rem}
.hb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb i{height:8px;border-radius:4px;background:var(--soft);position:relative;overflow:hidden}
.hb i u{position:absolute;inset:0 auto 0 0;background:var(--acc);border-radius:4px;transform-origin:left}
.hb em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}

/* motion: things arrive once, then numbers and bars move when the week changes */
.m-in{animation:min .6s var(--ease) both}
@keyframes min{from{opacity:0;transform:translateY(10px)}}
.gb{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(var(--s,1));transition:transform .75s var(--ease) var(--dl,0ms)}
.gx{transform-origin:left;transform:scaleX(var(--s,1));transition:transform .8s var(--ease) var(--dl,0ms)}
.dr{stroke-dasharray:1;stroke-dashoffset:var(--o,0);transition:stroke-dashoffset 1.2s var(--ease) var(--dl,0ms)}
.hc{transform-box:fill-box;transform-origin:center;opacity:var(--op,1);transform:scale(var(--sc,1));transition:opacity .4s ease var(--dl,0ms),transform .5s var(--ease) var(--dl,0ms)}
.pop{transform-box:fill-box;transform-origin:center;transform:scale(var(--sc,1));opacity:var(--op,1);transition:transform .6s var(--ease) var(--dl,0ms),opacity .3s ease var(--dl,0ms)}
.rg{transition:stroke-dasharray 1.1s var(--ease) var(--dl,0ms)}
.pulse{animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.55}70%{transform:scale(2.2);opacity:0}100%{opacity:0}}
.lift{transition:transform .2s var(--ease),box-shadow .2s ease}
@media (hover:hover) and (pointer:fine){.lift:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(0,0,0,.05),0 18px 36px rgba(0,0,0,.08)}}
.lift:active{transform:scale(.98)}

/* drawer, toast */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(10,10,12,.28);opacity:0;pointer-events:none;transition:opacity .3s ease}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:80;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);box-shadow:-20px 0 60px rgba(0,0,0,.18);transform:translateX(102%);transition:transform .32s var(--ease-io);overflow-y:auto;overscroll-behavior:contain;visibility:hidden}
.drawer.on{transform:none;visibility:visible;transition:transform .5s var(--ease-drawer)}
.dhead{position:sticky;top:0;z-index:2;background:var(--bg);padding:18px 20px 12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line)}
.dhead h2{font-weight:600;font-size:1.6rem;letter-spacing:-.035em;line-height:1.1}
[data-brand="abten"] .dhead h2{font-family:var(--d);font-weight:400;font-size:2.4rem;letter-spacing:-.01em;line-height:.95;text-transform:lowercase}
.dbody{padding:16px 20px 40px;display:grid;gap:14px}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none;transition:transform .16s var(--ease)}
.x:active{transform:scale(.94)}
.toast{position:fixed;z-index:96;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:.9rem;box-shadow:0 12px 30px rgba(0,0,0,.25);transition:transform .35s var(--ease),opacity .25s ease;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{font-family:var(--m);font-weight:500;font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
[data-brand="abten"] th{font-size:.78rem;letter-spacing:0;text-transform:lowercase;font-weight:600}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer;transition:background-color .12s ease}
@media (hover:hover) and (pointer:fine){tbody tr.click:hover{background:var(--soft)}}
.n{text-align:right}
.tblwrap{overflow-x:auto}

/* the iPad frame for the app view */
.ipad-stage{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(90% 80% at 50% 30%,#FFFFFF,var(--bg))}
.ipad-stage > div{width:100%;display:grid;justify-items:center}
.ipad{position:relative;width:min(1180px,calc((100vh - 120px) * 1.44),calc(100vw - 56px));aspect-ratio:1180/820;border-radius:44px;padding:16px;background:linear-gradient(155deg,#dcdcdf,#a9abb0 30%,#e8e8ea 55%,#9fa1a6 80%,#cfd0d3);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7),inset 0 0 0 5px rgba(0,0,0,.12),0 2px 4px rgba(0,0,0,.18),0 40px 90px -30px rgba(0,0,0,.45)}
.ipad::before{content:"";position:absolute;inset:6px;border-radius:38px;background:#08090a}
.ipad iframe{position:relative;z-index:1;width:100%;height:100%;border:0;border-radius:26px;background:var(--bg);display:block}
.ipad .cam{position:absolute;z-index:2;left:50%;top:9px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#2b3550,#05070c)}
.under{margin-top:18px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}

/* responsive */
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.figs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:980px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.span3{grid-column:1/-1}.fgrid{grid-template-columns:1fr!important}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{display:flex;position:sticky;top:0;z-index:40;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .top .wk{grid-template-columns:30px auto 30px;padding:3px;border-radius:12px}.top .wk button{width:30px;height:30px}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px max(8px,env(safe-area-inset-bottom))}
  .tabbar a{display:grid;justify-items:center;gap:3px;font-size:.68rem;font-weight:500;color:var(--mute);text-decoration:none;padding:4px 0}
  [data-brand="abten"] .tabbar a{text-transform:lowercase}
  .tabbar a[aria-current="page"]{color:var(--acc)}
  main{padding:18px 16px 110px}
  .drawer{width:100%;top:auto;height:92vh;border-radius:22px 22px 0 0;transform:translateY(102%)}
  .g2,.g3{grid-template-columns:1fr}.span2,.span3{grid-column:auto}
}
@media (max-width:900px){.hero > .grid{grid-template-columns:1fr!important}}
@media (max-width:560px){.hero .figs{grid-template-columns:repeat(2,minmax(0,1fr))!important}.hero .fig.big .num,[data-brand="abten"] .hero .fig.big .num{font-size:2.1rem}
.g4,.figs{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fig .num{font-size:1.9rem}.ttl{font-size:1.7rem}[data-brand="abten"] .ttl{font-size:2.3rem}.card{padding:16px}.hide-s{display:none!important}}
/* the app mode: big touch targets, a tab bar, no sidebar, the way it sits on an iPad */
[data-mode="app"] .app{grid-template-columns:1fr}
[data-mode="app"] .side{display:none}
[data-mode="app"] .top{display:flex;position:sticky;top:0;z-index:40;align-items:center;justify-content:space-between;gap:10px;padding:14px 22px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
[data-mode="app"] .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 24px max(10px,env(safe-area-inset-bottom))}
[data-mode="app"] .tabbar a{display:grid;justify-items:center;gap:3px;font-size:.72rem;font-weight:500;color:var(--mute);text-decoration:none;padding:4px 0}
[data-mode="app"][data-brand="abten"] .tabbar a{text-transform:lowercase}
