  +'<p class="lab" style="text-align:center;margin:10px 0 0">readout for trainers, a concept with sample data</p></div>',
live:()=>'<div class="wscr"><div class="card banner"><span class="ic">'+av(LV.c,'s')+'</span><div style="flex:1;min-width:0"><p class="t">'+esc(LV.c.name)+'</p><p class="s">'+esc(LV.ex.name)+', '+kgs(LV.ex.kg)+' kg</p></div><button type="button" class="rb" data-close aria-label="close"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2 L10 10 M10 2 L2 10" fill="none" stroke="#151617" stroke-width="1.7" stroke-linecap="round"/></svg></button></div><div id="lvDyn">'+UI.liveDyn()+'</div>'
  +'<div class="bottom"><button type="button" class="btn" data-close>Done watching</button></div></div>',
liveDyn:()=>{const t=goal(LV.set),rest=LV.phase==='rest',done=LV.phase==='done';
  const top=rest?'<div class="cnt"><p class="lab">Rest, set '+(LV.set+1)+' next</p><p class="n num">'+mmss(Math.max(0,LV.rest))+'</p><p class="z">Set '+LV.set+' done, '+LV.done[LV.set-1]+' reps</p></div>':done?'<div class="cnt"><p class="lab">Done</p><p class="n num">'+LV.done.reduce((a,b)=>a+b,0)+'</p><p class="z">Reps in three sets, then '+esc(nextEx(LV.c)[1].name.toLowerCase())+'</p></div>':'<div class="cnt"><span class="n num lv-n">'+LV.rep+'</span><p class="z">Reps, set '+LV.set+' of 3, target '+t+'</p></div>';
  return top+'<div class="livewave">'+waveSVG(LV.amps.length&&!done?LV.amps:[0],180,t+.4,false)+'</div>'
  +'<div class="tiles"><div class="tile"><p class="lab">Weight</p><p class="v">'+kgs(LV.ex.kg)+'<sup>KG</sup></p></div><div class="tile"><p class="lab">Last time</p><p class="v">'+(LV.ex.last?LV.ex.last.sets[0][0]+'<sup>@ '+kgs(LV.ex.last.sets[0][1])+'</sup>':'-')+'</p></div>'
  +'<div class="tile"><p class="lab">Sets</p><p class="v">'+[0,1,2].map(i=>LV.done[i]!=null?LV.done[i]:'-').join(' ')+'</p></div><div class="tile"><p class="lab">Rest</p><p class="v">'+(rest?mmss(Math.max(0,LV.rest)):'1:30')+'</p></div></div>'},
sent:c=>'Plan sent to '+c.first,nudged:c=>'Nudge sent to '+c.first+' (sample)',assign:()=>'Choose a client in Clients'};

const P=window.PEOPLE,C=P.clients,AB=document.documentElement.dataset.brand==='abten';
const Q=new URLSearchParams(location.search),STILL=Q.has('still');
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kgs=v=>(Math.round(v*10)/10).toLocaleString('en-US');
const e1=(w,r)=>w*(1+r/30);
const lastOf=(c,x)=>{for(let i=c.sessions.length-1;i>=0;i--){const e=c.sessions[i].ex.find(e=>e.name===x);if(e)return {s:c.sessions[i],e}}return null};
const firstOf=(c,x)=>{for(const s of c.sessions){const e=s.ex.find(e=>e.name===x);if(e)return {s,e}}return null};
const planEx=c=>[...new Set(c.plan.days.flatMap(d=>d.ex))];
const stronger=c=>{const g=planEx(c).map(x=>{const a=firstOf(c,x),b=lastOf(c,x);return a&&b?e1(b.e.sets[0][1],b.e.sets[0][0])/e1(a.e.sets[0][1],a.e.sets[0][0])-1:null}).filter(v=>v!=null);return Math.round(g.reduce((a,b)=>a+b,0)/Math.max(1,g.length)*100)};
const nextEx=c=>c.next.ex.map(x=>{const st=c.state[x],l=lastOf(c,x),d=l?st.kg-l.e.sets[0][1]:0;return {name:x,kg:st.kg,reps:st.reps,up:d>0?d:0,last:l&&l.e}});
const ups=c=>nextEx(c).filter(e=>e.up>0);
const four=(c,o)=>{o=o||0;const w=c.weeks.slice(c.weeks.length-4-o,c.weeks.length-o);return {n:w.reduce((a,x)=>a+x.n,0),of:c.per*4}};
const less=c=>{const f=four(c);return f.n/f.of<.7};
const MO=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'],WD=['sun','mon','tue','wed','thu','fri','sat'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const dname=d=>{const x=new Date(d+'T12:00:00');return WD[x.getDay()]+' '+x.getDate()+' '+MO[x.getMonth()]};
const WORDS=['no','one','two','three','four','five','six','seven','eight','nine','ten'];
const andList=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const TODAY=P.schedule.map(s=>Object.assign({},s,{c:C[s.client-1]}));
const UPT=TODAY.filter(s=>ups(s.c).length);
const team4=o=>{let n=0,of=0;C.forEach(c=>{const f=four(c,o);n+=f.n;of+=f.of});return Math.round(n/of*100)};
const AVG=Math.round(C.reduce((a,c)=>a+c.avg,0)/C.length);
const AVGP=Math.round(C.reduce((a,c)=>{const s=c.sessions.slice(-8,-4);return a+s.reduce((x,y)=>x+y.score,0)/Math.max(1,s.length)},0)/C.length);
const LASTWK=C.reduce((a,c)=>a+c.weeks[c.weeks.length-1].n,0);
const WENTUP=(()=>{let n=0;const cut=new Date(P.now);cut.setDate(cut.getDate()-7);const cs=P.day(cut);C.forEach(c=>{const seen={};c.sessions.forEach(s=>{s.ex.forEach(e=>{const kg=e.sets[0][1];if(s.date>=cs&&seen[e.name]!=null&&kg>seen[e.name])n++;seen[e.name]=kg})})});return n})();
const mainEx=c=>{const n={};c.sessions.forEach(s=>s.ex.forEach(e=>n[e.name]=(n[e.name]||0)+1));return Object.keys(n).sort((a,b)=>n[b]-n[a])[0]};
const series=(c,x)=>c.sessions.map(s=>{const e=s.ex.find(e=>e.name===x);return e?{d:s.date,v:e1(e.sets[0][1],e.sets[0][0]),kg:e.sets[0][1]}:null}).filter(Boolean);
const LESS=C.filter(less),TOPB=C.filter(c=>c.pr30>=c.per*3);
const FB=AB?'':'<div class="fb"></div>';
/* the sound kit (the about ten. app's, synthesised; silent until the first tap; a switch in You) */
const SND=(()=>{let ctx=null,m=null;const K='trainer.sounds';const on=()=>{try{return localStorage.getItem(K)!=='off'}catch(e){return true}};const set=v=>{try{localStorage.setItem(K,v?'on':'off')}catch(e){}};
  const unlock=()=>{try{if(!ctx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;ctx=new A();m=ctx.createGain();m.gain.value=.9;m.connect(ctx.destination)}if(ctx.state!=='running')ctx.resume()}catch(e){}};
  const ok=()=>ctx&&ctx.state==='running'&&on();
  const tone=(f,t0,d,g,f2)=>{const o=ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);const G=ctx.createGain();G.gain.setValueAtTime(.0001,t0);G.gain.exponentialRampToValueAtTime(g,t0+.006);G.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(G);G.connect(m);o.start(t0);o.stop(t0+d+.03)};
  return {on,set,unlock,rep:()=>{ok()&&(tone(2093,ctx.currentTime,.11,.035),tone(4186,ctx.currentTime,.05,.008))},open:()=>{ok()&&tone(660,ctx.currentTime,.12,.014,990)},
    close:()=>{ok()&&(tone(1318.5,ctx.currentTime,.24,.026),tone(987.8,ctx.currentTime+.08,.34,.022))},tick:()=>{ok()&&tone(1975,ctx.currentTime,.05,.018)},
    chime:()=>{ok()&&[1046.5,1318.5,1568].forEach((f,i)=>tone(f,ctx.currentTime+i*.075,.32,.02))},toggle:v=>{ok()&&(tone(v?1320:1760,ctx.currentTime,.05,.018),tone(v?1760:1320,ctx.currentTime+.045,.06,.016))}}})();
document.addEventListener('pointerdown',SND.unlock,{passive:true});
/* the live set: the first client of the day on the first machine of the plan, counted by the sensor (simulated) */
const LV={c:TODAY[0].c,set:1,sets:3,rep:0,phase:'lift',rest:0,hold:0,amps:[],done:[]};LV.ex=nextEx(LV.c)[0];LV.target=LV.ex.reps;
const goal=s=>s===3?LV.target-1:LV.target;
function lvStep(){if(LV.phase==='lift'){LV.rep++;LV.amps.push(.76*(1-(LV.rep-1)*.03)*(.93+((LV.rep*37)%10)/100));if($('#live.in'))SND.rep();if(LV.rep>=goal(LV.set)){LV.done[LV.set-1]=LV.rep;LV.phase='rest';LV.rest=90}}
  else if(LV.phase==='rest'){LV.rest-=15;if(LV.rest<=0){if(LV.set>=LV.sets){LV.phase='done';LV.hold=4;if($('#live.in'))SND.chime()}else{LV.set++;LV.rep=0;LV.amps=[];LV.phase='lift'}}}
  else if(--LV.hold<=0){LV.set=1;LV.rep=0;LV.amps=[];LV.done=[];LV.phase='lift'}
  paintLive()}
if(STILL){LV.set=2;LV.done=[LV.target];for(let i=0;i<5;i++){LV.rep++;LV.amps.push(.76*(1-i*.03))}}else setInterval(lvStep,1250);
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
/* navigation: tabs, pushed pages, the live sheet */
let TAB='today';
function render(t,first){const pg=$('#tab-'+t+' .page[data-root]');pg.innerHTML=FB+UI[t]();post(pg,first)}
function post(pg,first){if(first&&!STILL)$$('[data-count]',pg).forEach(el=>{const to=+el.dataset.count,s=performance.now(),d=900;const f=n=>{const p=Math.min(1,(n-s)/d),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e);if(p<1)requestAnimationFrame(f)};el.textContent='0';requestAnimationFrame(f)});
  if(STILL||!first)pg.classList.add('settled')}
function setTab(t){if(t===TAB){$$('#tab-'+t+' .page.push').forEach(p=>p.remove());const r=$('#tab-'+t+' .page[data-root]');r.classList.remove('under');r.scrollTop=0;bar();return}
  TAB=t;$$('.tabpage').forEach(p=>p.classList.toggle('on',p.dataset.tab===t));$$('.tabbar button').forEach(b=>{b.classList.toggle('on',b.dataset.tab===t);b.setAttribute('aria-selected',String(b.dataset.tab===t))});render(t,false);bar();SND.tick()}
function push(html){const box=$('#tab-'+TAB),all=$$(':scope > .page',box),under=all[all.length-1],p=document.createElement('div');p.className='page push settled';
  p.innerHTML=FB+UI.back()+html;box.appendChild(p);SND.open();
  if(STILL){p.classList.add('in');under&&under.classList.add('under')}else requestAnimationFrame(()=>requestAnimationFrame(()=>{p.classList.add('in');under&&under.classList.add('under')}));bar()}
function pop(){const box=$('#tab-'+TAB),all=$$(':scope > .page',box);if(all.length<2)return;const p=all[all.length-1],u=all[all.length-2];p.classList.remove('in');u.classList.remove('under');SND.close();setTimeout(()=>p.remove(),STILL?0:470);setTimeout(bar,0)}
function bar(){const b=$('#cta');if(!b)return;const pushed=$$('#tab-'+TAB+' .page.push').length>0;b.classList.toggle('off',TAB!=='today'||pushed)}
function openLive(){const l=$('#live');l.innerHTML=UI.live();l.hidden=false;$('#app')&&$('#app').classList.add('lv');SND.open();if(STILL)l.classList.add('in');else requestAnimationFrame(()=>requestAnimationFrame(()=>l.classList.add('in')))}
function closeLive(){const l=$('#live');l.classList.remove('in');SND.close();setTimeout(()=>{if(!l.classList.contains('in')){l.hidden=true;$('#app')&&$('#app').classList.remove('lv')}},STILL?0:520)}
function paintLive(){const n=$('#nowRep');if(n){n.textContent=LV.phase==='lift'?LV.rep:(LV.done[LV.set-1]||LV.rep);$('#nowSet').textContent=UI.nowLine()}
  const d=$('#lvDyn');if(d&&$('#live.in')){d.innerHTML=UI.liveDyn();const b=$('.lv-n',d);if(b&&LV.phase==='lift'&&!STILL){b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}}}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('in');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('in'),2200)}
document.addEventListener('click',e=>{let x;
  if((x=e.target.closest('[data-tab]'))){setTab(x.dataset.tab);return}
  if((x=e.target.closest('[data-back]'))){pop();return}
  if((x=e.target.closest('[data-go]'))){push(UI.client(C[+x.dataset.go-1]));return}
  if((x=e.target.closest('[data-close]'))){closeLive();return}
  if((x=e.target.closest('[data-live]'))){openLive();return}
  if((x=e.target.closest('[data-send]'))){SND.chime();toast(UI.sent(C[+x.dataset.send-1]));return}
  if((x=e.target.closest('[data-nudge]'))){SND.chime();toast(UI.nudged(C[+x.dataset.nudge-1]));return}
  if((x=e.target.closest('[data-assign]'))){SND.tick();toast(UI.assign());return}
  if((x=e.target.closest('[data-seg]'))){UI.segv=x.dataset.seg;SND.tick();render('clients',false);return}
  if((x=e.target.closest('[data-snd]'))){const v=!SND.on();if(!v)SND.toggle(false);SND.set(v);if(v){SND.unlock();setTimeout(()=>SND.toggle(true),30)}$$('[data-snd]').forEach(b=>b.setAttribute('aria-checked',String(v)));return}
  if((x=e.target.closest('[data-ptab]'))){$$('[data-ptab]').forEach(b=>b.classList.toggle('on',b===x));$$('.pane').forEach(p=>p.hidden=p.dataset.pane!==x.dataset.ptab);SND.tick();return}
  if((x=e.target.closest('[data-screen]'))){goScreen(x.dataset.screen);return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#live.in'))closeLive();else pop()}else if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-live]')){e.preventDefault();openLive()}});
function goScreen(s){if($('#live.in')&&s!=='live')closeLive();if(s==='live'){if(TAB!=='today')setTab('today');openLive();return}
  if(s==='client'){if(TAB!=='clients')setTab('clients');else setTab('clients');push(UI.client(C[0]));return}
  setTab(s);if(TAB===s&&$$('#tab-'+s+' .page.push').length)setTab(s)}
/* the phone on a desk, the whole screen on a phone */
function fit(){const h=document.documentElement,ph=innerWidth<520;h.classList.toggle('phone',ph);const D=$('#device'),H=$('#holder');
  if(ph){D.style.transform='';H.style.width=H.style.height='';return}
  const W=AB?414:393,HH=AB?868:852,k=Math.min(1,(innerHeight-(AB?48:76))/HH);D.style.transform='scale('+k+')';H.style.width=W*k+'px';H.style.height=HH*k+'px'}
addEventListener('resize',fit);fit();
if(STILL)document.documentElement.classList.add('still');
if($('#cta'))$('#cta').innerHTML='<i class="live"></i>follow '+esc(LV.c.first)+' live';
['today','clients','plans','you'].forEach(t=>render(t,t==='today'));bar();
const S0=Q.get('screen');if(S0&&S0!=='today')goScreen(S0);
})();</script></body></html>
