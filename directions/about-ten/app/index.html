  };
  // Thump: a kick that settles back, for the thing that just counted.
  S.thump = function (el, kick) {
    if (S.reduced() || !el) return;
    if (el._thump) el._thump.stop();
    el._thump = S.spring({
      from: 1,
      to: 1,
      velocity: kick == null ? 0.9 : kick,
      response: 0.3,
      damping: 0.42,
      restDelta: 0.001,
      restSpeed: 0.01,
      onUpdate: (v) => (el.style.transform = 'scale(' + v + ')'),
      onDone: () => (el.style.transform = ''),
    });
  };
  // Enter: a group arrives as one wave, the first leading; delays shrink so it never queues.
  S.enter = function (els, o) {
    if (S.reduced()) return;
    o = o || {};
    const delays = [0, 45, 85, 120, 150, 175, 195, 210];
    Array.prototype.slice.call(els, 0, delays.length).forEach(function (el, i) {
      el.animate([{ opacity: 0, transform: 'translateY(' + (o.y == null ? 18 : o.y) + 'px) scale(0.98)' }, { opacity: 1, transform: 'none' }], {
        duration: 420,
        delay: (o.delay || 0) + delays[i],
        easing: EASE_OUT,
        fill: 'backwards',
      });
    });
  };
  // A ring of light leaving an element (the sensor heard a rep).
  S.ripple = function (host, o) {
    if (S.reduced()) return;
    o = o || {};
    const r = document.createElement('span');
    r.className = 'ripple';
    host.appendChild(r);
    const a = r.animate([{ transform: 'scale(' + (o.from || 0.86) + ')', opacity: 0.9 }, { transform: 'scale(' + (o.to || 1.18) + ')', opacity: 0 }], {
      duration: o.duration || 560,
      easing: EASE_OUT,
    });
    a.onfinish = a.oncancel = () => r.remove();
  };

  // ---- rolling numbers ---------------------------------------------------------------------------------
  // Each character has its own slot; when it changes, the old one leaves and the new one arrives from the
  // direction the number moved (1 = up, -1 = down). Tabular digits keep the width still.
  S.roller = function (el, o) {
    o = o || {};
    const dist = o.dist == null ? 0.42 : o.dist;
    el.classList.add('roller');
    let cur = null;
    function slot(ch) {
      const s = document.createElement('span');
      s.className = 'rs';
      const d = document.createElement('span');
      d.className = 'rd';
      d.textContent = ch;
      s.appendChild(d);
      return s;
    }
    function build(text) {
      el.textContent = '';
      for (const ch of text) el.appendChild(slot(ch));
    }
    function rollIn(d, dir, delay) {
      d.animate([{ transform: 'translateY(' + dir * dist + 'em)', opacity: 0 }, { transform: 'translateY(0)', opacity: 1 }], {
        duration: 260,
        delay: delay || 0,
        easing: EASE_OUT,
        fill: 'backwards',
      });
    }
    function rollOut(d, dir) {
      const a = d.animate([{ transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(' + -dir * dist + 'em)', opacity: 0 }], {
        duration: 150,
        easing: EASE_OUT,
        fill: 'forwards',
      });
      a.onfinish = a.oncancel = () => d.remove();
    }
    return {
      set: function (text, dir) {
        text = String(text);
        if (text === cur) return;
        const prev = cur;
        cur = text;
        if (prev == null || !dir || S.reduced() || !el.isConnected) {
          build(text);
          return;
        }
        if (prev.length !== text.length) {
          build(text);
          Array.prototype.forEach.call(el.children, (s, i) => rollIn(s.firstChild, dir, i * 24));
          return;
        }
        for (let i = 0; i < text.length; i++) {
          if (text[i] === prev[i]) continue;
          const s = el.children[i];
          while (s.children.length > 1) s.firstChild.remove();
          const old = s.firstChild;
          const d = document.createElement('span');
          d.className = 'rd';
          d.textContent = text[i];
          s.appendChild(d);
          rollOut(old, dir);
          rollIn(d, dir, 0);
        }
      },
      get: function () {
        return cur;
      },
    };
  };

  // ---- particles ---------------------------------------------------------------------------------------
  // A short burst of small bright pieces, for the two moments that earn it: passing last time, and the summary.
  S.fx = (function () {
    let canvas = null;
    let ctx = null;
    let parts = [];
    let raf = 0;
    let last = 0;
    let dpr = 1;
    let W = 0;
    let H = 0;
    function size() {
      const r = canvas.getBoundingClientRect();
      dpr = Math.min(2, window.devicePixelRatio || 1);
      W = r.width;
      H = r.height;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
    }
    function frame(t) {
      const dt = Math.min(0.033, (t - last) / 1000 || 0.016);
      last = t;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      parts = parts.filter((p) => p.life > 0);
      for (const p of parts) {
        p.vy += 1500 * dt * p.g;
        p.vx *= 1 - 1.8 * dt;
        p.vy *= 1 - 0.6 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;
        p.life -= dt;
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 0.35));
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        if (p.round) {
          ctx.beginPath();
          ctx.arc(0, 0, p.size / 2, 0, 6.2832);
          ctx.fill();
        } else {
          ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        }
        ctx.restore();
      }
      if (parts.length) raf = requestAnimationFrame(frame);
      else {
        raf = 0;
        ctx.clearRect(0, 0, W, H);
      }
    }
    return {
      init: function (app) {
        canvas = document.createElement('canvas');
        canvas.className = 'fx';
        canvas.setAttribute('aria-hidden', 'true');
        app.appendChild(canvas);
        ctx = canvas.getContext('2d');
        size();
        window.addEventListener('resize', size);
      },
      count: function () {
        return parts.length;
      },
      burst: function (x, y, o) {
        if (S.reduced() || !canvas) return;
        o = o || {};
        const cs = getComputedStyle(document.getElementById('app'));
        const colors = o.colors || [cs.getPropertyValue('--a1').trim(), cs.getPropertyValue('--a2').trim(), '#ffffff', cs.getPropertyValue('--a-hi').trim()];
        const n = o.n || 26;
        const speed = o.speed || 520;
        for (let i = 0; i < n; i++) {
          const ang = (o.angle == null ? -Math.PI / 2 : o.angle) + (Math.random() - 0.5) * (o.spread == null ? Math.PI * 2 : o.spread);
          const v = speed * (0.35 + Math.random() * 0.75);
          parts.push({
            x: x,
            y: y,
            vx: Math.cos(ang) * v,
            vy: Math.sin(ang) * v,
            g: o.gravity == null ? 1 : o.gravity,
            size: 4 + Math.random() * 6,
            color: colors[i % colors.length],
            rot: Math.random() * 6,
            vr: (Math.random() - 0.5) * 14,
            life: 0.7 + Math.random() * 0.7,
            round: Math.random() < 0.4,
          });
        }
        if (!raf) {
          last = performance.now();
          raf = requestAnimationFrame(frame);
        }
      },
    };

  // On an iPhone (iOS 18 and later) a tap on a switch control gives a light tick. In the app this becomes a
  // native call; here it is a hidden switch, and it only fires from a tap.
  let hapticLabel = null;

      }
      hapticLabel.click();
      if (navigator.vibrate) navigator.vibrate(8);
    } catch (e) {
      /* no haptics here */
    }
  };

  // ---- icons -------------------------------------------------------------------------------------------
  const STROKE = 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
  const ICONS = {
    machine:
      '<rect x="5.5" y="2.75" width="13" height="18.5" rx="2.5"/><path d="M12 2.75V9"/><rect x="8.5" y="11" width="7" height="2.4" rx="1"/><rect x="8.5" y="14.6" width="7" height="2.4" rx="1"/><path d="M8.5 19h7"/>',
    cable: '<circle cx="12" cy="5" r="2.25"/><path d="M12 7.25V16.5"/><path d="M7.5 16.5h9"/><path d="M8.5 16.5v2.5M15.5 16.5v2.5"/>',
    barbell:
      '<path d="M2.5 12h19"/><rect x="5" y="7" width="2.6" height="10" rx="1"/><rect x="16.4" y="7" width="2.6" height="10" rx="1"/><rect x="2.8" y="9" width="1.8" height="6" rx=".8"/><rect x="19.4" y="9" width="1.8" height="6" rx=".8"/>',
    dumbbell:
      '<path d="M8.5 12h7"/><rect x="4" y="8.25" width="4.5" height="7.5" rx="1.6"/><rect x="15.5" y="8.25" width="4.5" height="7.5" rx="1.6"/>',
    sensor: '<rect x="4" y="7" width="16" height="10" rx="5"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/>',
    sliders: '<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
    home: '<path d="M4 11.2 12 4.5l8 6.7"/><path d="M6.2 9.8v9.2h11.6V9.8"/>',
    chart: '<path d="M4 19.5h16"/><path d="M5 15.5 9.6 11l3.6 3.2L19 7.5"/>',
    back: '<path d="M14.5 5.5 8 12l6.5 6.5"/>',
    down: '<path d="M6 9.5 12 15.5l6-6"/>',
    chevron: '<path d="M9.5 6 15.5 12l-6 6"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    minus: '<path d="M5 12h14"/>',
    check: '<path d="M5.5 12.5 10 17l8.5-9.5"/>',
    search: '<circle cx="11" cy="11" r="6.25"/><path d="m16 16 3.75 3.75"/>',
    tap: '<path d="M9.5 11.5V6.25a1.75 1.75 0 0 1 3.5 0V11"/><path d="M13 10.25a1.75 1.75 0 0 1 3.5 0V12"/><path d="M16.5 11a1.75 1.75 0 0 1 3.5 0v3.5a6.5 6.5 0 0 1-6.5 6.5h-1a6 6 0 0 1-4.75-2.3L4.5 15.5a1.7 1.7 0 0 1 2.6-2.2l2.4 2.2"/>',
  };
  S.icon = function (name, cls) {
    return '<svg class="icon ' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true" ' + STROKE + '>' + ICONS[name] + '</svg>';
  };
  S.thumb = function (exId, cls) {
    const ex = S.exercise(exId);
    return '<span class="thumb ' + (cls || '') + '">' + S.icon(ex ? ex.kind : 'machine') + '</span>';
  };
  // The up mark: a small solid triangle. Only "more than last time" gets it.
  S.up = function (cls) {
    return '<svg class="up ' + (cls || '') + '" viewBox="0 0 10 10" aria-label="more than last time"><path d="M5 1.2 9.2 8.6H.8z" fill="currentColor" stroke="currentColor" stroke-width="0.8" stroke-linejoin="round"/></svg>';
  };
  S.upBadge = function () {
    return '<span class="up-badge">' + S.up() + '</span>';
  };

  // ---- change signal ----------------------------------------------------------------------------------
  const listeners = [];
  S.onChange = function (fn) {
    listeners.push(fn);
    return function () {
      const i = listeners.indexOf(fn);

  };

  };

  S.workout = function () {
    if (!S.state.workout) S.state.workout = { startedAt: Date.now(), order: [], sets: {} };
    return S.state.workout;
  };
  S.setsOf = function (exId) {
    const w = S.state.workout;
    return (w && w.sets[exId]) || [];
  };
  S.addSet = function (exId, set) {
    const w = S.workout();

    const w = S.state.workout;
    if (!w) return 0;
    return w.order.reduce((n, id) => n + w.sets[id].length, 0);
  };

    const w = S.state.workout;
    return w ? (Date.now() - w.startedAt) / 1000 : 0;
  };
})();

(function () {

  S.keep = function (k, v) {
    if (S.DATA === 'worst' && OWN[k]) k = 'worst.' + k;
    try {
      if (v === undefined) {
        const x = localStorage.getItem('sedulo.v34.' + k);
        return x == null ? null : JSON.parse(x);
      }
      localStorage.setItem('sedulo.v34.' + k, JSON.stringify(v));
    } catch (e) {}

  };
  // ---- the gym's machines ----------------------------------------------------------------------------------------
  const M = [
    ['leg-press', 'Leg press', 'legs'],
    ['chest-press', 'Chest press', 'chest'],
    ['lat-pulldown', 'Lat pulldown', 'back'],
    ['seated-row', 'Seated row', 'back'],
    ['leg-curl', 'Leg curl', 'legs'],
    ['shoulder-press', 'Shoulder press', 'shoulders'],
    ['leg-extension', 'Leg extension', 'legs'],
    ['butterfly', 'Butterfly', 'chest'],

  // free weights (his note, 15 Nov evening): a barbell and dumbbells; no tag and no stack sensor, so counted by a tap or
  // later by a sensor on the bar; their pictures are placeholders (the kind's picture)
  [

    ['squat', 'Squat', 'legs', 'barbell', 2.5],
    ['deadlift', 'Deadlift', 'back', 'barbell', 2.5],
    ['barbell-row', 'Barbell row', 'back', 'barbell', 2.5],
    ['db-curl', 'Dumbbell curl', 'arms', 'dumbbell', 1],
    ['db-press', 'Dumbbell press', 'shoulders', 'dumbbell', 1],
  ].forEach((f) => S.EXERCISES.push({ id: f[0], name: f[1], muscle: f[2], kind: f[3], step: f[4] }));
  // the member's own exercises (v18: add your own), kept on the phone

        '<span class="eyebrow">stronger. not a guess.</span><p class="hl2">' + esc(UI.name(sg.id)) + '</p><div class="pair">' + num('+' + S.wNum(sg.gain), S.unit()) + '<span class="lnchart">' + line(sg.series, 190, 70, recDates) + '</span></div>');
    } else {
      const v = Math.min(3, S.mostVisits());
      stronger = sec('s-strong ghost', '', '',
        '<span class="eyebrow">stronger</span><p class="hl2">three visits to one machine, and it shows here.</p><span class="dots3">' + [0, 1, 2].map((i) => '<i' + (i < v ? ' class="on"' : '') + '></i>').join('') + '</span>');
    }
    const recs = S.records();
    const m0 = S.iso(monthStart(0));
    const recMonth = recs.filter((r) => r.date >= m0).length;
    const week = S.inWeek(S.monday(S.TODAY));
    const halves =
      '<div class="halves">' + sec('s-half', 'bests', 'New bests this month, ' + recMonth, '<span class="eyebrow acc">new bests</span>' + num(recMonth, 'this month')) +
      (n ? sec('s-half', 'month', 'Lifted this week, ' + tonnes(S.lifted(week)) + ' ' + tUnit(), '<span class="eyebrow">lifted this week</span>' + num(tonnes(S.lifted(week)), tUnit())) : sec('s-half', '', '', '<span class="eyebrow">lifted this week</span>' + num(0, tUnit()))) + '</div>';
    const doors =
      '<ul class="links">' +
      '<li><button class="lk" data-go="exercises"><span class="rn">exercises</span><span class="rv">' + S.EXERCISES.length + '</span>' + UI.ICON.chev + '</button></li>' +
      (n ? '<li><button class="lk" data-go="history"><span class="rn">history</span><span class="rv">' + n + (n === 1 ? ' workout' : ' workouts') + '</span>' + UI.ICON.chev + '</button></li>' : '') +
      '</ul>';
    const html = '<header class="title"><span class="eyebrow">' + (n ? 'since ' + S.sinceText() + ' ' + n + (n === 1 ? ' workout' : ' workouts') : 'nothing yet') + '</span><h1>progress.</h1></header>' + weekly + stronger + halves + doors;
    let grown = false;
    return {
      html: html,
      // the bars grow once, the first time the page is seen (a chart that grows every time would tire)
      shown: function (el) {
        if (grown || S.reduced()) return;
        grown = true;
        el.querySelectorAll('.bars i').forEach((b, i) => b.animate([{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: 520, delay: 60 + i * 28, easing: EASE, fill: 'backwards' }));
        el.querySelectorAll('.spark .ln').forEach(function (p) {
          const L = p.getTotalLength ? p.getTotalLength() : 400;
          p.style.strokeDasharray = L;
          p.animate([{ strokeDashoffset: L }, { strokeDashoffset: 0 }], { duration: 700, delay: 120, easing: EASE, fill: 'backwards' }).onfinish = () => (p.style.strokeDasharray = '');
        });
      },
    };
  };

  // ---- History: the month and every workout in it -----------------------------------------------------------------
  UI.PAGES.history = function (arg) {
    const off = Math.max(0, Number(arg || 0));
    const first = monthStart(off);
    const days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    const list = inMonth(first);
    const trained = new Set(list.map((w) => w.date));
    const recDays = new Set(S.records().map((r) => r.date));
    let cells = '';
    const lead = (first.getDay() + 6) % 7;
    for (let i = 0; i < lead; i++) cells += '<span class="cd empty"></span>';
    for (let d = 1; d <= days; d++) {
      const iso = S.iso(new Date(first.getFullYear(), first.getMonth(), d, 12));
      const w = list.find((x) => x.date === iso);
      cells += w
        ? '<button class="cd on' + (iso === S.TODAY ? ' today' : '') + '" data-go="workout:' + w.id + '" aria-label="' + esc(S.shortDate(iso)) + (recDays.has(iso) ? ', a new best' : '') + '">' + d + (recDays.has(iso) ? '<i class="rdot"></i>' : '') + '</button>'
        : '<span class="cd' + (iso === S.TODAY ? ' today' : '') + (iso > S.TODAY ? ' future' : '') + '">' + d + '</span>';
    }
    const older = S.HISTORY.length && S.HISTORY[0].date < S.iso(first);
    const month = tile('wide month', '',
      '<span class="mhead"><span class="lab">' + MON[first.getMonth()] + '</span>' +
        '<span class="mnav"><button class="circle sm" data-mon="1" aria-label="Earlier month"' + (older ? '' : ' disabled') + '>' + UI.ICON.back + '</button><button class="circle sm fwd" data-mon="-1" aria-label="Later month"' + (off ? '' : ' disabled') + '>' + UI.ICON.back + '</button></span></span>' +
        big(list.length, list.length === 1 ? 'workout' : 'workouts') +
        '<span class="cal"><span class="wd">M</span><span class="wd">T</span><span class="wd">W</span><span class="wd">T</span><span class="wd">F</span><span class="wd">S</span><span class="wd">S</span>' + cells + '</span>');
    const rows = list
      .slice()
      .reverse()
      .map((w) => row({ go: 'workout:' + w.id, nm: esc(S.planName(w) || 'Workout'), val: esc(S.shortDate(w.date)) }))
      .join('');
    return {
      title: 'History',
      html: '<div class="grid">' + month + (rows ? tile('wide rows', '', rows) : '') + '</div>',
      bind: function (el) {
        el.querySelectorAll('[data-mon]').forEach((b) =>
          b.addEventListener('click', function () {
            const dir = Number(b.dataset.mon);
            el._arg = String(off + dir);
            UI.rebuild(el);
            if (!S.reduced()) el.querySelectorAll('.tile').forEach((t) => t.animate([{ opacity: 0, transform: 'translateX(' + -14 * dir + 'px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: EASE }));
            UI.glassSoon();
          })
        );
      },
    };
  };

  // ---- one workout, beside last time (v16; his view of v14's drawn summary: he did not know what it was telling him,
  // it felt childish; the data must be serious, readable at first glance, still in the app's light look). The plan's
  // own words (CLAUDE.md, the five screens): "Summary: each exercise beside last time". So: four plain numbers at the
  // top, one line on volume against the last time this plan was done, then every exercise as a small table, set by set,
  // today beside last time with the difference; a best gets the coral dot, next time's weight where it is earned.
  const AR = {
    up: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 10V2.5M2.8 5.5 6 2.3l3.2 3.2"/></svg>',
    down: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2v7.5M2.8 6.5 6 9.7l3.2-3.2"/></svg>',
  };
  function lastWith(w, id) {
    const before = S.HISTORY.filter((x) => x.date < w.date || (x.date === w.date && x.id < w.id));
    for (let i = before.length - 1; i >= 0; i--) {
      const e = before[i].exercises.find((x) => x.id === id);
      if (e) return { w: before[i], e: e };
    }
    return null;
  }
  function lastOf(w, id) {
    const l = lastWith(w, id);
    return l ? l.e : null;
  }
  // like for like (v19): today's volume against last time's, only the exercises done both times, only as many sets as today
  function likeForLike(w) {
    let now = 0;
    let prev = 0;
    w.exercises.forEach(function (e) {
      const last = lastOf(w, e.id);
      if (!last) return;
      const n = Math.min(e.sets.length, last.sets.length);
      now += S.volume(e.sets.slice(0, n));
      prev += S.volume(last.sets.slice(0, n));
    });
    return { now: now, prev: prev };
  }
  // one exercise against last time, one pill only when it changed: heavier or lighter, else more or fewer reps over the
  // same number of sets; nothing when it is the same (no "=" sign, his view: too crowded)
  function cmpOf(w, e) {
    const last = lastOf(w, e.id);
    if (!last) return '';
    const tw = Math.max.apply(null, e.sets.map((q) => q.w));
    const lw = Math.max.apply(null, last.sets.map((q) => q.w));
    if (tw !== lw) return '<span class="dlt ' + (tw > lw ? 'up' : 'dn') + '">' + (tw > lw ? '+' : '&minus;') + S.wNum(Math.abs(tw - lw)) + ' ' + S.unit() + '</span>';
    const n = Math.min(e.sets.length, last.sets.length);
    const tr = e.sets.slice(0, n).reduce((a, q) => a + q.reps, 0);
    const lr = last.sets.slice(0, n).reduce((a, q) => a + q.reps, 0);
    return tr === lr ? '' : '<span class="dlt ' + (tr > lr ? 'up' : 'dn') + '">' + (tr > lr ? '+' : '&minus;') + Math.abs(tr - lr) + (Math.abs(tr - lr) === 1 ? ' rep' : ' reps') + '</span>';
  }
  // ---- sharing a workout (v19): a card worth posting (the plan, the day, three numbers, the three biggest exercises, the
  // bests), then the phone's own share sheet
  UI.shareSheet = function (w) {
    const name = S.planName(w) || (w.exercises.length === 1 ? UI.name(w.exercises[0].id) : 'Workout'); // as the page's title
    const vol = S.lifted([w]);
    const sets = w.exercises.reduce((a, e) => a + e.sets.length, 0);
    const nb = S.records().filter((r) => r.date === w.date && w.exercises.some((e) => e.id === r.id)).length;
    const tm = w.minutes < 60 ? w.minutes + '<i>min</i>' : Math.floor(w.minutes / 60) + ':' + String(w.minutes % 60).padStart(2, '0') + '<i>h</i>';
    const top = w.exercises.slice().sort((a, b) => S.volume(b.sets) - S.volume(a.sets)).slice(0, 3);
    // v31: the share card is the brand's motif with the person's own number: a photograph, the subtitle saying what they
    // would have said and what it really was, the four numbers under it, the wordmark. (A stand-in photo for now; in the
    // real app, the person's own or the polaroid evening's.)
    const repsAll = w.exercises.reduce((a, e) => a + e.sets.reduce((b, q) => b + q.reps, 0), 0);
    // v33: no photograph: the card is the website's red with the brand's line and the person's own number set big
    const card =
      '<div class="shcard sh-type">' +
      '<span class="sh-d">' + esc(name) + '. ' + esc(S.dayName(w.date) + ' ' + S.dayMonth(w.date)) + '</span>' +
      '<span class="sh-q">you&rsquo;d have said about ten.</span><span class="sh-big">' + repsAll + '.</span><span class="sh-r">reps, counted. exactly.</span>' +
      '<span class="sh-n"><span><b>' + tm + '</b><em>time</em></span><span><b>' + sets + '</b><em>sets</em></span><span><b>' + tonnes(vol) + '<i>' + tUnit() + '</i></b><em>lifted</em></span></span>' +
      (nb ? '<span class="sh-b"><i class="mk"></i>' + nb + (nb === 1 ? ' new best. a real one.' : ' new bests. real ones.') + '</span>' : '') +
      '<span class="sh-m">about ten.</span></div>';
    UI.sheet('share the real number', card + LG('button', 'capsule pro wide-btn sh-go', '', '<span>share</span>'), function (sh) {
      // v24: the card rises and turns toward you; Share sends it up and away
      const cd = sh.querySelector('.shcard');
      // choreograph: the sheet carries the card (one entrance); the card only settles its tilt with the sheet's timing
      if (cd && !S.reduced()) cd.animate([{ transform: 'perspective(900px) rotateX(12deg)' }, { transform: 'none' }], { duration: 500, easing: S.UI.EASE.drawer });
      sh.querySelector('.sh-go').addEventListener('click', function () {
        const text = 'you\'d have said about ten. it was ' + repsAll + '. ' + name.toLowerCase() + ', ' + S.dayMonth(w.date).toLowerCase() + '. counted by about ten.';
        UI.snd.whoosh(true);
        if (cd && !S.reduced()) cd.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-60px) scale(0.92)' }], { duration: 260, easing: 'cubic-bezier(0.23, 1, 0.32, 1)', fill: 'forwards' });
        setTimeout(function () {
          UI.closeSheet();
          if (navigator.share) navigator.share({ title: name, text: text }).catch(() => {});
          else UI.toast('the share sheet opens here.');
        }, S.reduced() ? 0 : 240);
      });
    });
  };
  // set by set, today beside last time (a sheet: the detail, one tap below the calm list)
  function setsSheet(w, e) {
    const l = lastWith(w, e.id);
    const rows = e.sets
      .map(function (q, i) {
        const p = l && l.e.sets[i];
        const d = !p ? '' : q.w > p.w || (q.w === p.w && q.reps > p.reps) ? ' up' : q.w < p.w || (q.w === p.w && q.reps < p.reps) ? ' dn' : '';
        return '<li class="cs' + d + '"><span class="n">' + (i + 1) + '</span><span class="t">' + S.wNum(q.w) + ' &times; ' + q.reps + '</span><span class="p">' + (p ? S.wNum(p.w) + ' &times; ' + p.reps : '&ndash;') + '</span></li>';
      })
      .join('');
    UI.sheet(UI.name(e.id),
      '<ol class="cmp"><li class="ch"><span class="n"></span><span class="t">' + esc(S.dayMonth(w.date)) + '</span><span class="p">' + (l ? esc(S.dayMonth(l.w.date)) : 'Last time') + '</span></li>' + rows + '</ol>' +
        LG('button', 'capsule ghost wide-btn cmp-all', '', '<span>All of ' + esc(UI.name(e.id)) + '</span>'),
      (sh) => sh.querySelector('.cmp-all').addEventListener('click', () => (UI.closeSheet(), setTimeout(() => UI.push('exercise', e.id), 320))));
  }
  UI.PAGES.workout = function (wid) {
    const w = S.HISTORY.find((x) => x.id === wid) || S.lastWorkout();
    if (!w) return { title: 'Workout', html: '' };
    const fresh = S.summaryFresh === w.id;
    const plan = S.planOf(w.plan);
    const recs = S.records().filter((r) => r.date === w.date && w.exercises.some((e) => e.id === r.id));
    const recIds = new Set(recs.map((r) => r.id));
    const sets = w.exercises.reduce((a, e) => a + e.sets.length, 0);
    const vol = S.lifted([w]);
    // the last time this plan (or these machines) was done
    const idx = S.HISTORY.indexOf(w);
    let prevSame = null;
    for (let i = idx - 1; i >= 0 && !prevSame; i--) if (S.HISTORY[i].plan === w.plan) prevSame = S.HISTORY[i];
    const pv = prevSame ? S.lifted([prevSame]) : 0;
    const pct = pv ? Math.round(((vol - pv) / pv) * 100) : null;
    // v19, his call on the worst case: too crowded. The first glance is calm: three numbers (time, sets, volume), the
    // change in volume only when there is one, each exercise as its sets and top weight with a pill only where it changed;
    // set by set beside last time is one tap deeper (a sheet). Comparisons are like for like: only the exercises done today
    // and only as many sets as today has, so a short workout is never measured against a whole plan.
    const like = likeForLike(w);
    const pctL = like.prev ? Math.round(((like.now - like.prev) / like.prev) * 100) : 0;
    // v31: the summary in the brand. Just finished: a red band, "exactly.", and the line the brand is built on (you'd have
    // said about ten; here is the real number). Then four numbers, what a guess wouldn't tell you (each with what to do
    // next time), the score with its three parts, each machine's sets, and a way to share the real number.
    const repsAll = w.exercises.reduce((a, e) => a + e.sets.reduce((b, q) => b + q.reps, 0), 0);
    const tm = w.minutes < 60 ? [w.minutes, 'min'] : [Math.floor(w.minutes / 60) + ':' + String(w.minutes % 60).padStart(2, '0'), 'h'];
    const stat = (v, u, l) => '<span class="st3"><span class="v"><b>' + v + '</b>' + (u ? '<i>' + u + '</i>' : '') + '</span><span class="k">' + l + '</span></span>';
    const pname = plan ? plan.name : S.planName(w) || (w.exercises.length === 1 ? UI.name(w.exercises[0].id) : 'workout');
    // v34: the report, after Ultrahuman's anatomy: the score as a ring with its band word (the reveal, red when just
    // finished, with the brand's line), the numbers, what made the score (its parts in points that add up), each machine
    // set by set against last time, what a guess wouldn't tell you
    const sc = S.score(w);
    const band = S.M.band(sc.value);
    const hero = '<section class="card sum-hero' + (fresh ? '' : ' quiet') + '">' + (fresh ? '<span class="eyebrow">' + esc(pname) + '. ' + S.dayName(w.date) + ' ' + S.dayMonth(w.date) + '</span>' : '') +
      '<div class="sh-ring">' + UI.ring(sc.value / 100, '<b>' + sc.value + '</b><i>' + band + '</i>', 'xl') + '</div>' +
      (fresh ? '<h2 class="hl">exactly.</h2><p class="sum-line">you\'d have said about ten. it was ' + repsAll + '.</p>' : '<p class="sum-line q">' + repsAll + ' reps, counted. ' + (recs.length ? recs.length + (recs.length === 1 ? ' new best.' : ' new bests.') : '') + '</p>') + '</section>';
    const head = '<section class="card sum-stats">' + stat(tm[0], tm[1], 'time') + stat(sets, '', sets === 1 ? 'set' : 'sets') + stat(repsAll, '', 'reps') + stat(tonnes(vol), tUnit(), 'lifted') + '</section>';
    const WT = [40, 35, 25];
    const parts = '<section class="card sum-parts"><span class="eyebrow">what made the ' + sc.value + '</span><ul>' + sc.parts.map(function (q, k) {
      const pts = Math.round(q.p * WT[k]);
      return '<li><span class="pn">' + q.name.toLowerCase() + '</span><span class="pb"><i style="width:' + Math.round(q.p * 100) + '%"></i></span><span class="po">' + q.of[0] + ' of ' + q.of[1] + '</span><b>' + pts + '<em>/' + WT[k] + '</em></b></li>';
    }).join('') + '</ul></section>';
    const ins = UI.insights(w, { like: like, pctL: pctL, recs: recs });
    const insights = ins.length ? '<section class="card sum-ins"><span class="eyebrow">what a guess wouldn\'t tell you</span><ul class="ins">' + ins.map((x) => '<li class="' + (x.acc ? 'acc' : '') + '"><b>' + x.t + '</b><span>' + x.d + '</span></li>').join('') + '</ul></section>' : '';
    const machBars = function (e) {
      const l = lastWith(w, e.id);
      const prev = l ? l.e.sets : [];
      const mx = Math.max.apply(null, e.sets.map((q) => q.reps).concat(prev.map((q) => q.reps)).concat([1]));
      const n = Math.max(e.sets.length, prev.length);
      const bw = 14, g = 8, H = 40;
      let out = '';
      for (let i = 0; i < n; i++) {
        const x = i * (bw + g);
        const p = prev[i];
        const q = e.sets[i];
        if (p) out += '<rect class="was" x="' + x + '" y="' + (H - (p.reps / mx) * H).toFixed(1) + '" width="' + bw + '" height="' + ((p.reps / mx) * H).toFixed(1) + '" rx="3"/>';
        if (q) out += '<rect class="' + (S.beats(q, p) ? 'up' : 'is') + '" x="' + (x + 3) + '" y="' + (H - (q.reps / mx) * H).toFixed(1) + '" width="' + (bw - 6) + '" height="' + ((q.reps / mx) * H).toFixed(1) + '" rx="2"/>';
      }
      return '<svg class="mbars" viewBox="0 0 ' + Math.max(1, n * (bw + g) - g) + ' ' + H + '" width="' + Math.max(1, n * (bw + g) - g) + '" height="' + H + '" aria-hidden="true">' + out + '</svg>';
    };
    const tables = '<section class="card sum-sets"><span class="eyebrow">set by set, against last time</span><ul>' + w.exercises.map(function (e, j) {
      const top = Math.max.apply(null, e.sets.map((q) => q.w));
      return '<li><button data-act="wset" data-j="' + j + '" aria-label="' + esc(UI.name(e.id)) + ', set by set"><span class="sn">' + esc(UI.name(e.id)) + (recIds.has(e.id) ? '<i class="mk" aria-label="New best"></i>' : '') + '<span class="sr">' + e.sets.map((q) => q.reps).join(' ') + ' ' + S.wNum(top) + ' ' + S.unit() + '</span></span>' + machBars(e) + UI.ICON.chev + '</button></li>';
    }).join('') + '</ul></section>';
    const share = '<div class="sum-share">' + LG('button', 'capsule ghost', ' data-share="' + w.id + '" aria-label="Share this workout"', '<span>share the real number</span>') + '</div>';
    return {
      head: LG('button', 'circle share', ' data-share="' + w.id + '" aria-label="Share this workout"', IC.export) + LG('button', 'capsule edit', ' data-go="editworkout:' + w.id + '" aria-label="Edit this workout"', '<span>Edit</span>'),
      refresh: (el) => UI.rebuild(el),
      // a workout without a plan: its one machine's name, or simply Workout (v24: it showed the weekday twice)
      title: pname + '.',
      sub: S.dayName(w.date) + ' ' + S.dayMonth(w.date),
      html: hero + head + parts + insights + tables + share,
      cta: fresh ? { label: 'done', icon: false, run: () => UI.finishDone() } : plan ? { label: 'again', act: 'plan:' + plan.id } : null,
      bind: function (el) {
        el.querySelectorAll('[data-act="wset"]').forEach((r) => r.addEventListener('click', () => setsSheet(w, w.exercises[Number(r.dataset.j)])));
        el.querySelectorAll('.sum-share [data-share]').forEach((b) => b.addEventListener('click', () => UI.shareSheet(w)));
        UI.shareFor = w; // the top bar's share button (outside the page) reads it
        if (!fresh) return;
        el._own = true;
        S.summaryFresh = null;
        // find-animation-opportunities: the very first workout is a rare moment: its own line, a fanfare, a ring
        const firstEver = S.HISTORY.length === 1;
        if (firstEver) {
          const hd = el.querySelector('.sum-line');
          if (hd) hd.textContent = 'your first one. counted, not guessed.';
          setTimeout(() => UI.snd.fanfare(), 260);
        } else UI.snd.chime();
        if (S.reduced()) return;
        // a short arrival: the numbers first, then each exercise in turn (Emil: one entrance per container, 60 ms apart)
        el.querySelectorAll('.st3').forEach((x, i) => x.animate([{ opacity: 0, transform: 'translateY(' + (12 - i * 3) + 'px)' }, { opacity: 1, transform: 'none' }], { duration: 380, delay: [100, 150, 185][i] || 200, easing: EASE, fill: 'backwards' }));
        setTimeout(() => UI.countUp(el.querySelector('.sum-stats')), 100);
        el.querySelectorAll('.ins li').forEach((x, i) => x.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 340, delay: 260 + i * 60, easing: EASE, fill: 'backwards' }));
        el.querySelectorAll('.rows .row').forEach((x, i) => i < 8 && x.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 300, delay: 300 + Math.round(42 * i - 2 * i * i), easing: EASE, fill: 'backwards' }));
        // a pill belongs to its row: it lands as its row settles (together), not on a clock of its own
        const rowsAll = Array.prototype.slice.call(el.querySelectorAll('.rows .row'));
        el.querySelectorAll('.dlt.up').forEach(function (x) {
          const k = Math.min(7, rowsAll.indexOf(x.closest('.row')));
          x.animate([{ transform: 'scale(0.6)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 240, delay: 300 + Math.round(42 * k - 2 * k * k) + 170, easing: EASE, fill: 'backwards' });
        });
      },
    };
  };

  // v31: what a guess wouldn't tell you (his rule of 16 Nov: after a workout always insights that explain why tracking
  // matters, each one with what to do next time). Only from what the app knows: reps and sets counted, weights typed,
  // the box's times. Never a jab: a drop is not shown as a failure, the same is just the same.
  UI.insights = function (w, o) {
    const out = [];
    const nm = (id) => esc(UI.name(id));
    const kg = (v) => S.wNum(v) + ' ' + S.unit();
    w.exercises.forEach(function (e) {
      const nw = S.nextWeight(e);
      if (nw != null && out.length < 4) out.push({ t: nm(e.id) + ': go up.', d: e.sets.map((q) => q.reps).join(' ') + ' at ' + kg(Math.max.apply(null, e.sets.map((q) => q.w))) + '. try ' + kg(nw) + ' next time.', acc: true });
    });
    (o.recs || []).slice(0, 2).forEach((r) => out.push({ t: 'new best. a real one.', d: nm(r.id) + ', ' + r.reps + ' at ' + kg(r.w) + '.', acc: true }));
    let flat = 0; // v34: one stalled machine is enough to say it
    w.exercises.forEach(function (e) {
      if (out.length >= 5 || flat) return;
      const se = S.series(e.id).filter((x) => x.date <= w.date).slice(-3);
      if (se.length === 3 && se.every((x) => x.w === se[0].w && x.reps === se[0].reps) && S.nextWeight(e) == null)
        (flat = 1), out.push({ t: nm(e.id) + ': the same, three times.', d: se[0].reps + ' at ' + kg(se[0].w) + ' each visit. one more rep next time, then go up.' });
    });
    if (o.pctL > 0 && out.length < 6) out.push({ t: o.pctL + ' % more than last time.', d: 'same machines, same sets, more lifted.' });
    const timed = w.exercises.map((e) => e.sets.filter((q) => q.at)).filter((a) => a.length > 1);
    if (timed.length) {
      let gap = 0, n = 0, plan = 0;
      w.exercises.forEach(function (e) {
        for (let i = 1; i < e.sets.length; i++) if (e.sets[i].at && e.sets[i - 1].at) { gap += (e.sets[i].at - e.sets[i - 1].at) / 1000 - e.sets[i].reps * 3; n++; plan += S.restOf(e.id); }
      });
      if (n) {
        const avg = Math.max(0, Math.round(gap / n)), pl = Math.round(plan / n);
        const mm = (sec) => Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
        if (avg > pl + 30) out.push({ t: 'rest ran over.', d: mm(avg) + ' between sets, ' + mm(pl) + ' planned. fine, if the set needed it.' });
      }
    }
    const m = S.monday(w.date);
    const thisW = S.inWeek(m).length, lastW = S.inWeek(S.addDays(m, -7)).length;
    if (thisW >= 2 && thisW > lastW) out.push({ t: thisW + ' workouts this week.', d: (lastW ? lastW + ' last week.' : 'none last week.') + ' that\'s how it adds up.' });
    if (!out.length) out.push({ t: 'counted, not guessed.', d: 'come back to the same machines and the next one will tell you more.' });
    return out.slice(0, 6);
  };

  // ---- every machine of the gym -------------------------------------------------------------------------------------------
  UI.PAGES.exercises = function () {

    const own = (e) => /^cx/.test(e.id);
    const groups = [['Machines', (e) => e.kind === 'machine' && !own(e)], ['Free weights', (e) => e.kind !== 'machine' && !own(e)], ['Your own', own]];
    const tiles = groups
      .map(function (g) {

        }).join('')) + '</div>';

  // ---- one machine: its best, its line, its rest and your note, its visits --------------------------------------------------
  UI.PAGES.exercise = function (id) {
    const ex = S.exercise(id);
    const s = S.series(id);
    const recs = S.records().filter((r) => r.id === id);
    let hero;
    if (s.length) {
      let heavy = s[0];
      s.forEach((v) => (v.w > heavy.w || (v.w === heavy.w && v.reps >= heavy.reps)) && (heavy = v));
      hero = tile('wide hero', '', '<span class="lab' + (recs.length ? ' acc"><i class="mk"></i>' : '">') + 'Best</span>' + big(S.wNum(heavy.w), S.unit()) + '<span class="det">' + S.reps(heavy.reps) + '</span>' + (/^cx/.test(id) ? '' : UI.pic(id, 'hero')));
    } else hero = tile('wide hero', '', '<span class="lab">First time</span><span class="det">Your sets will show here</span>' + UI.pic(id, 'hero'));
    const recDates = new Set(recs.map((r) => r.date));
    const chart = s.length >= 2
      ? tile('wide chartb', '', '<span class="lab">Weight</span>' + line(s, 340, 96, recDates) + '<span class="axis"><span>' + esc(S.axisDate(s[0].date, s[s.length - 1].date)) + '</span><span>' + esc(S.axisDate(s[s.length - 1].date, s[0].date)) + '</span></span>')
      : '';
    const yours = tile('wide rows yours', '',
      row({ icon: IC.clock, nm: 'Rest', right: '<span class="val rest-v">' + S.clock(S.restOf(id)) + '</span><span class="steps"><button class="stp" data-d="-15" aria-label="Rest shorter">' + UI.ICON.minus + '</button><button class="stp" data-d="15" aria-label="Rest longer">' + UI.ICON.plus + '</button></span>' }) +
        row({ act: 'note', icon: IC.edit, nm: 'Note', val: esc(S.noteOf(id) || 'Add'), chev: true }));
    const visits = s
      .slice(-3)
      .reverse()
      .map((v) => row({ go: 'workout:' + v.wid, nm: esc(S.shortDate(v.date)), val: S.wNum(v.w) + ' ' + S.unit() + ' &times; ' + v.reps }))
      .join('') + (s.length > 3 ? row({ go: 'visits:' + id, nm: 'All visits', val: String(s.length) }) : '');
    return {
      title: ex ? ex.name : 'Exercise',
      html: '<div class="grid">' + hero + chart + yours + (visits ? tile('wide rows', '', '<span class="lab">Visits</span>' + visits) : '') + '</div>' +
        (/^cx/.test(id) && ex ? '<div class="ewk-del">' + UI.holdBtn('Hold to delete exercise') + '</div>' : ''),
      cta: { label: 'Start', act: 'ex:' + id },
      bind: function (el) {
        const dh = el.querySelector('.ewk-del .hold');
        if (dh)
          UI.hold(dh, function () {
            const keepEx = JSON.parse(JSON.stringify(S.keep('customEx') || []));
            const keepPlans = JSON.parse(JSON.stringify(S.PLANS));
            const keepAt = S.EXERCISES.findIndex((x) => x.id === id);
            const names = S.keep('exNames') || {};
            names[id] = ex.name;
            S.keep('exNames', names); // its workouts keep its name
            S.keep('customEx', (S.keep('customEx') || []).filter((x) => x.id !== id));
            const i = S.EXERCISES.findIndex((x) => x.id === id);
            if (i >= 0) S.EXERCISES.splice(i, 1);
            S.PLANS.forEach((p) => (p.ids = p.ids.filter((x) => x !== id)));
            S.PLANS = S.PLANS.filter((p) => p.ids.length);
            S.keep('plans', S.PLANS);
            UI.renderRootsQuiet();
            UI.back();
            UI.toast('deleted.', false, {
              label: 'Undo',
              run: function () {
                S.keep('customEx', keepEx);
                if (!S.EXERCISES.some((x) => x.id === id)) S.EXERCISES.splice(Math.max(0, keepAt), 0, ex);
                S.PLANS = keepPlans;
                S.keep('plans', S.PLANS);
                UI.renderAll();
                UI.toast('it\'s back.');
              },
            });
          });
        el.querySelectorAll('.stp').forEach((b) =>
          UI.holdRepeat(b, function () {
            S.setRest(id, S.restOf(id) + Number(b.dataset.d));
            const v = el.querySelector('.rest-v');
            v.textContent = S.clock(S.restOf(id));
            S.haptic();
          })
        );
        el.querySelector('[data-act="note"]').addEventListener('click', function () {
          UI.sheet('Note', '<div class="fieldwrap"><input class="field" maxlength="40" value="' + esc(S.noteOf(id)) + '" placeholder="Seat, pads, grip" aria-label="Note" autocomplete="off" autocapitalize="sentences" enterkeyhint="done"></div><p class="hint">Only you see it.</p>', function (sh) {
            const inp = sh.querySelector('input');
            setTimeout(() => inp.focus(), 380);
            sh.querySelector('[data-done]').addEventListener('click', function () {
              const n = S.keep('notes') || {};
              n[id] = inp.value.trim();
              S.keep('notes', n);
              el.querySelector('[data-act="note"] .val').textContent = n[id] || 'Add';
            });
          }, { done: true });
        });
      },
    };
  };

  // ================================ Plans ============================================================================================
  UI.ROOTS.plans = function () {
    // v19, his view of nine big blocks: a toy. Now as a serious list: the next plan is the one block (its machines, Start),
    // every plan a row with what it holds, how long it takes and when it was done last
    const next = UI.nextPlan();
    // v31: plans as the website lists things: each plan a serif name with what it holds and when it was done; the next one
    // first, marked, with its own start
    const meta = (p) => { const l = S.lastOfPlan(p.id); return p.ids.length + (p.ids.length === 1 ? ' machine' : ' machines') + ' ' + S.planTime(p) + (l ? ' last time ' + S.relDay(l.date) : ' not done yet'); };
    const order = next ? [next].concat(S.PLANS.filter((p) => p.id !== next.id)) : S.PLANS.slice();
    // v34: each plan a card with its muscles and the average score of its last three workouts (a ring), Ultrahuman-style
    const avg3 = (p) => { const ws = S.HISTORY.filter((w) => w.plan === p.id).slice(-3); return ws.length ? Math.round(ws.reduce((a, w) => a + S.score(w).value, 0) / ws.length) : null; };
    const groups = (p) => Array.from(new Set(p.ids.map((id) => (S.exercise(id) || {}).muscle).filter(Boolean)));
    const rows = order.map(function (p, k) {

        (av != null ? '<span class="pl-sc">' + UI.ring(av / 100, '<b>' + av + '</b>', 'sm') + '<em>avg score</em></span>' : '') + '</button>' +
        (k === 0 && next ? '<button class="go st" data-start="plan:' + p.id + '" aria-label="Start ' + esc(p.name) + '">start</button>' : '') + '</li>';
    }).join('');
    const empty = S.PLANS.length ? '' : '<section class="sec s-empty">' + '<p class="hl2">no plans yet.</p><p class="meta">make one from the machines you use. or just start and tap in.</p></section>';
    return {
      html: '<header class="title"><span class="eyebrow">' + (S.PLANS.length ? S.PLANS.length + (S.PLANS.length === 1 ? ' plan' : ' plans') : 'nothing yet') + '</span><h1>plans.</h1></header>' +
        (rows ? '<ul class="plist">' + rows + '</ul>' : '') + empty +
        '<div class="newplan">' + LG('button', 'capsule ghost', ' data-go="editplan" aria-label="New plan"', UI.ICON.plus + '<span>new plan</span>') + '</div>',
      // a plan just made or changed arrives in the list instead of appearing (rare)

        if (!id) return;
        S.justSaved = null;
        const t = el.querySelector('[data-go="plan:' + id + '"]');

      },

  };

  // a new plan (or an edit): a name, then tap the machines in the order you train them
  UI.PAGES.editplan = function (id) {
    const p = id ? S.planOf(id) : null;
    const sel = p ? p.ids.slice() : [];
    const grid = S.EXERCISES.map((e) => {
      const i = sel.indexOf(e.id);
      return '<button class="pk" data-id="' + e.id + '" aria-pressed="' + (i >= 0) + '" aria-label="' + esc(e.name) + '">' + UI.pic(e.id) + '<span class="nm">' + esc(e.name) + '</span><b class="badge">' + (i >= 0 ? i + 1 : '') + '</b></button>';
    }).join('');
    const spec = {
      title: p ? 'Edit plan' : 'New plan',
      html:
        '<div class="grid">' + tile('wide namef', '', '<input class="field" maxlength="24" value="' + esc(p ? p.name : '') + '" placeholder="Name" aria-label="Name" autocomplete="off" autocapitalize="sentences" enterkeyhint="done">') + '</div>' +
        '<h3 class="gl ordh"' + (sel.length ? '' : ' hidden') + '>Order</h3>' + tile('wide rows ordl', sel.length ? '' : ' hidden', '') +
        '<h3 class="gl">Machines</h3>' + UI.searchBox('Search') + '<div class="pgrid">' + grid + '</div>' + (p ? '<div class="ewk-del">' + UI.holdBtn('Hold to delete plan') + '</div>' : ''),
      cta: { label: 'Save', icon: false, disabled: !sel.length || !p, run: null },
      bind: function (el) {
        const inp = el.querySelector('.field');
        const ok = () => sel.length > 0 && inp.value.trim().length > 0;
        const sync = function () {
          spec.cta.disabled = !ok();
          UI.refreshCta();
        };
        inp.addEventListener('input', sync);
        UI.bindSearch(el, () => el.querySelectorAll('.pgrid .pk'), (b) => b.dataset.id);
        const badges = () =>
          el.querySelectorAll('.pk').forEach(function (k) {
            const j = sel.indexOf(k.dataset.id);
            k.setAttribute('aria-pressed', String(j >= 0));
            k.querySelector('.badge').textContent = j >= 0 ? j + 1 : '';
          });
        // the order: one row per machine picked, dragged by its grip (as iOS reorders a list)
        const ord = el.querySelector('.ordl');
        const drawOrder = function () {
          ord.hidden = !sel.length;
          el.querySelector('.ordh').hidden = !sel.length;
          ord.querySelector('.l').innerHTML = sel
            .map((x, i) => '<div class="row ordr" data-id="' + x + '"><span class="on">' + (i + 1) + '</span>' + UI.pic(x, 'rp') + '<span class="tx"><span class="nm">' + esc(UI.name(x)) + '</span></span><button class="grip" aria-label="Move ' + esc(UI.name(x)) + '"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h14M5 15h14"/></svg></button></div>')
            .join('');
          if (UI.glassSoon) UI.glassSoon();
        };
        drawOrder();
        let dragging = false;
        ord.addEventListener('pointerdown', function (e) {
          const g = e.target.closest('.grip');
          if (!g || dragging) return; // emil-design-eng: one finger drags; another touch is ignored
          dragging = true;
          e.preventDefault();
          const r = g.closest('.ordr');
          const rows = Array.prototype.slice.call(ord.querySelectorAll('.ordr'));
          const from = rows.indexOf(r);
          const k = app.getBoundingClientRect().width / app.offsetWidth || 1;
          const h = r.offsetHeight;
          const y0 = e.clientY;
          let to = from;
          try {
            g.setPointerCapture(e.pointerId);
          } catch (err) {} // a pointer the browser no longer tracks: the drag still works on the grip
          r.classList.add('lifting');
          UI.snd.pick();
          S.haptic();
          const lo = -from * h;
          const hi = (rows.length - 1 - from) * h;
          const band = (o) => (o * h * 0.55) / (h + 0.55 * Math.abs(o)); // apple-design: resist past the ends, never a wall
          let dyNow = 0;
          const move = function (ev) {
            let dy = (ev.clientY - y0) / k;
            if (dy < lo) dy = lo + band(dy - lo);
            else if (dy > hi) dy = hi + band(dy - hi);
            dyNow = dy;
            r.style.transform = 'translateY(' + dy + 'px) scale(1.02)';
            const t = Math.max(0, Math.min(rows.length - 1, from + Math.round(dy / h)));
            if (t !== to) (to = t), UI.snd.tick(true);
            rows.forEach(function (x, i) {
              if (x === r) return;
              const sh = from < to && i > from && i <= to ? -h : from > to && i < from && i >= to ? h : 0;
              x.style.transform = sh ? 'translateY(' + sh + 'px)' : '';
            });
          };
          const up = function () {
            dragging = false;
            g.removeEventListener('pointermove', move);
            g.removeEventListener('pointerup', up);
            g.removeEventListener('pointercancel', up);
            r.classList.remove('lifting');
            rows.forEach((x) => (x.style.transform = ''));
            if (to === from) return;
            sel.splice(to, 0, sel.splice(from, 1)[0]);
            UI.snd.drop();
            S.haptic('light');
            badges();
            drawOrder();
            sync();
            // the row settles into its slot from where the finger left it (position handed on, no jump)
            const moved = ord.querySelectorAll('.ordr')[to];
            if (moved && !S.reduced()) moved.animate([{ transform: 'translateY(' + (dyNow - (to - from) * h) + 'px) scale(1.02)' }, { transform: 'none' }], { duration: 320, easing: S.UI.EASE.drawer });
          };
          g.addEventListener('pointermove', move);
          g.addEventListener('pointerup', up);
          g.addEventListener('pointercancel', up);
        });
        el.querySelectorAll('.pk').forEach(function (b) {

// Sedulo v18: the pages that were missing (15 Nov 2026, web/src40; his call: build them, and walk the app for more).
// Edit a finished workout (each set, add or delete a set, delete the workout), your own exercise (a name, a kind, a
// placeholder picture), About. Problem sheets live in app40.js (UI.problem); the Lift's added set and discard in lift40.js.
(function () {
  'use strict';
  const S = window.S;
  const UI = S.UI;
  const LG = UI.LG;
  const esc = S.esc;
  const H = UI.h;
  // ---- edit a finished workout ------------------------------------------------------------------------------------------
  UI.PAGES.editworkout = function (wid) {
    const orig = S.HISTORY.find((x) => x.id === wid);
    if (!orig) return { title: 'Edit workout', html: '' };
    const w = JSON.parse(JSON.stringify(orig));
    const draw = function (el) {
      el.querySelector('.ewk-list').innerHTML = w.exercises
        .map((e, j) =>
          H.tile('wide rows ewk', '',
            '<span class="exh">' + UI.pic(e.id, 'rp') + '<span class="nm">' + esc(UI.name(e.id)) + '</span>' + LG('button', 'capsule ghost ewk-add', ' data-ex="' + j + '" aria-label="Add a set"', UI.ICON.plus + '<span>Set</span>') + '</span>' +
              e.sets.map((q, i) => H.row({ act: 'ewset', attrs: ' data-ex="' + j + '" data-i="' + i + '"', nm: 'Set ' + (i + 1), val: S.wNum(q.w) + ' ' + S.unit() + ' &times; ' + q.reps, chev: true })).join('')))
        .join('');
      UI.wire(el.querySelector('.ewk-list'));
    };
    const spec = {
      title: 'Edit workout',
      sub: S.dayName(w.date) + ' ' + S.dayMonth(w.date),
      html: '<div class="grid ewk-list"></div><div class="ewk-del">' + UI.holdBtn('Hold to delete workout') + '</div>',
      cta: { label: 'Save', icon: false, run: null },
      bind: function (el) {
        draw(el);
        el.addEventListener('click', function (ev) {
          const add = ev.target.closest('.ewk-add');
          if (add) {
            const e = w.exercises[Number(add.dataset.ex)];
            const last = e.sets[e.sets.length - 1] || { w: 20, reps: 10 };
            e.sets.push({ w: last.w, reps: last.reps });
            UI.snd.pop();
            draw(el);
            // v24: the new set rises into its place
            const rowsJ = el.querySelectorAll('[data-act="ewset"][data-ex="' + add.dataset.ex + '"]');
            const nr = rowsJ[rowsJ.length - 1];
            if (nr && !S.reduced()) nr.animate([{ opacity: 0, transform: 'translateY(-8px)', maxHeight: '0px' }, { opacity: 1, transform: 'none', maxHeight: '60px' }], { duration: 300, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
            return;
          }
          const r = ev.target.closest('[data-act="ewset"]');
          if (!r) return;
          const e = w.exercises[Number(r.dataset.ex)];
          const i = Number(r.dataset.i);
          const q = e.sets[i];
          const step = (S.exercise(e.id) || { step: 5 }).step;
          UI.sheet('Set ' + (i + 1), UI.stepper('reps', 'Reps', 'reps') + UI.stepper('w', 'Weight', S.unit()) + '<button class="danger-link" data-act="delset">Delete set</button>', function (sh) {
            const vr = sh.querySelector('[data-v="reps"]');
            const vw = sh.querySelector('[data-v="w"]');
            const paint = () => ((vr.textContent = q.reps), (vw.textContent = S.wNum(q.w)));
            paint();
            sh.querySelectorAll('.stepper .circle').forEach((b) =>
              UI.holdRepeat(b, function () {
                const d = Number(b.dataset.d);
                if (b.dataset.k === 'reps') q.reps = Math.max(1, q.reps + d);
                else q.w = Math.max(0, Math.round((q.w + d * step) * 10) / 10);
                paint();
              })
            );
            sh.querySelector('[data-act="delset"]').addEventListener('click', function () {
              UI.closeSheet();
              // v24: the set folds away, then the list closes the gap
              const row = el.querySelector('[data-act="ewset"][data-ex="' + r.dataset.ex + '"][data-i="' + i + '"]');
              UI.snd.thud();

// (wt-design-research/workout-score/ULTRAHUMAN-SCORE-STUDY.md): one word of advice with its reason and its action, three
// numbers as rings (the last workout's score, the rhythm of the last seven days, the load), what to do next time with
// its evidence, then the trends (strength, load, muscles). Trends replaces Progress: every chart over 8 weeks or 6
// months. Every number comes from what the box counts (reps, sets, rest) and the weights typed; nothing is invented.
(function () {
  'use strict';
  const S = window.S;
  const UI = S.UI;
  const esc = S.esc;
  const EASE = 'cubic-bezier(0.23, 1, 0.32, 1)';
  const DAY = 864e5;
  const daysBetween = (a, b) => Math.round((S.dateOf(b) - S.dateOf(a)) / DAY);
  const tonnes = (kg) => (S.unit() === 'lb' ? String(Math.round((kg * 2.20462) / 100) / 10) : String(Math.round(kg / 100) / 10));
  const tU = () => (S.unit() === 'lb' ? 'k lb' : 't');
  const kgs = (v) => S.wNum(v) + ' ' + S.unit();
  const nm = (id) => esc(UI.name(id));

  // ---- the numbers ----------------------------------------------------------------------------------------------------
  const M = (S.M = {});
  // the score's band words, as Ultrahuman names its states (the study's bands: Full 90+, Solid 75+, Partial 50+)
  M.band = (v) => (v >= 90 ? 'full' : v >= 75 ? 'solid' : v >= 50 ? 'partial' : 'light');
  M.inDays = (from, to) => S.HISTORY.filter((w) => w.date > from && w.date <= to);
  // the last seven days against the four weeks before them (Oura and Ultrahuman compare with your own normal)
  M.rhythm = function () {
    const now = M.inDays(S.addDays(S.TODAY, -7), S.TODAY).length;
    const before = M.inDays(S.addDays(S.TODAY, -35), S.addDays(S.TODAY, -7)).length;
    const usual = before ? Math.max(1, Math.round(before / 4)) : 3;
    return { now: now, usual: usual, frac: Math.min(1, now / usual), word: now >= usual ? (now > usual ? 'ahead' : 'on track') : now ? 'behind' : 'not yet' };
  };
  M.load = function () {
    const now = S.lifted(M.inDays(S.addDays(S.TODAY, -7), S.TODAY));
    const before = S.lifted(M.inDays(S.addDays(S.TODAY, -35), S.addDays(S.TODAY, -7))) / 4;
    const pct = before ? Math.round((now / before) * 100) : null;
    return { now: now, usual: before, pct: pct, frac: pct == null ? (now ? 1 : 0) : Math.min(1, pct / 100), word: pct == null ? (now ? 'first weeks' : 'not yet') : pct >= 115 ? 'heavier' : pct >= 85 ? 'usual' : now ? 'lighter' : 'rested' };
  };
  // strength: every machine's strength estimate (Epley) against its own first visit, averaged; 100 = where you began
  M.strengthAt = function (iso) {
    let sum = 0;
    let n = 0;
    S.EXERCISES.forEach(function (ex) {
      const s = S.series(ex.id);
      if (s.length < 2) return;
      const upto = s.filter((x) => x.date <= iso);
      if (!upto.length) return;
      const best = Math.max.apply(null, upto.map((x) => x.e1));
      sum += best / s[0].e1;
      n++;
    });
    return n ? Math.round((sum / n) * 1000) / 10 : null;
  };
  M.strength = function (weeks) {
    const pts = [];
    for (let k = weeks; k >= 0; k--) {
      const iso = S.addDays(S.TODAY, -7 * k);
      const v = M.strengthAt(iso);
      if (v != null) pts.push({ date: iso, v: v });
    }
    const first = pts[0];
    const last = pts[pts.length - 1];
    return { pts: pts, change: first && last && pts.length > 1 ? Math.round(((last.v - first.v) / first.v) * 1000) / 10 : null };
  };
  M.weekly = function (weeks, fn) {
    const m = S.monday(S.TODAY);
    const out = [];
    for (let k = weeks - 1; k >= 0; k--) {

  M.actions = function () {
    const out = [];
    const lastOf = {};
    S.HISTORY.forEach((w) => w.exercises.forEach((e) => (lastOf[e.id] = { e: e, date: w.date })));
    Object.keys(lastOf).forEach(function (id) {
      const e = lastOf[id].e;
      const nw = S.nextWeight(e);
      if (nw != null) out.push({ k: 0, t: nm(id) + ': go up.', d: e.sets.map((q) => q.reps).join(' ') + ' at ' + kgs(Math.max.apply(null, e.sets.map((q) => q.w))) + ' last time. try ' + kgs(nw) + '.', acc: true });
    });
    Object.keys(lastOf).forEach(function (id) {
      const se = S.series(id).slice(-3);
      if (se.length === 3 && se.every((x) => x.w === se[0].w && x.reps === se[0].reps) && S.nextWeight(lastOf[id].e) == null)
        out.push({ k: 1, t: nm(id) + ': the same three times.', d: se[0].reps + ' at ' + kgs(se[0].w) + ' each visit. one more rep next time.' });
    });
    const mus = M.muscles();
    const push = mus.chest.sets + mus.shoulders.sets;
    const pull = mus.back.sets;
    if (push + pull >= 10 && (push < pull * 0.6 || pull < push * 0.6))
      out.push({ k: 2, t: push < pull ? 'more pull than push.' : 'more push than pull.', d: 'chest and shoulders ' + push + ' sets, back ' + pull + ', in two weeks. ' + (push < pull ? 'one more push machine next time.' : 'one more pull machine next time.') });
    const recs = S.records();
    const r = recs.length && recs[recs.length - 1].date >= S.addDays(S.TODAY, -7) ? recs[recs.length - 1] : null;
    if (r) out.push({ k: 3, t: 'new best. a real one.', d: nm(r.id) + ', ' + r.reps + ' at ' + kgs(r.w) + '. keep the weight, add a rep.', acc: true });
    // at most two of a kind, so the list stays varied: two to go up, one that stalled, the balance, a best
    const cap = { 0: 2, 1: 1, 2: 1, 3: 1 };
    const seen = {};
    const pick = out.filter((x) => (seen[x.k] = (seen[x.k] || 0) + 1) <= cap[x.k]);
    pick.sort((a, b) => a.k - b.k);
    return pick.slice(0, 4);

    const bw = (W - g * (n - 1)) / n;
    const rects = vals.map(function (x, i) {
      const h = x.v ? Math.max(3, (x.v / mx) * (H - 6)) : 2;
      return '<rect class="' + (i === n - 1 ? 'now' : '') + (x.v ? '' : ' zero') + '" x="' + (i * (bw + g)).toFixed(1) + '" y="' + (H - h).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="' + Math.min(3, bw / 3).toFixed(1) + '"/>';
    }).join('');
    const avg = opts.avg ? '<line class="avg" x1="0" x2="' + W + '" y1="' + (H - (opts.avg / mx) * (H - 6)).toFixed(1) + '" y2="' + (H - (opts.avg / mx) * (H - 6)).toFixed(1) + '"/>' : '';
    return '<svg class="u-bars" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' + rects + avg + '</svg>';

  UI.lineChart = function (pts, opts) {

    const vs = pts.map((p) => p.v);
    let lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
    if (hi - lo < 1e-6) (lo -= 1), (hi += 1);
    const X = (i) => 4 + (i * (W - 8)) / (pts.length - 1);

    const end = '<circle class="end" cx="' + X(pts.length - 1).toFixed(1) + '" cy="' + Y(pts[pts.length - 1].v).toFixed(1) + '" r="4"/>';

      (acts.length ? card('u-acts', '', '<span class="eyebrow">next time</span><ul class="ins">' + acts.map((x) => '<li class="' + (x.acc ? 'acc' : '') + '"><b>' + x.t + '</b><span>' + x.d + '</span></li>').join('') + '</ul>') : '') +

    return {
      html: html,
      bind: function (el) {
        const seg = el.querySelector('.u-seg .seg');
        seg.querySelectorAll('button').forEach((b, i) =>

  // v31: the line above the number (which set, of how many) and the one under it (this set last time; during rest, what

  function drawNow() {

  function insertLap() {

      if (li.dataset.i === newest) {

        return;
      }

  // where the count stands on the screen (client px): the 3D digits' own box, or the soft count's box

  // the set's reps leave the big number and land in their new row (Emil Kowalski: spatial consistency; 560 ms on the
  // sheet curve, the row's number waits hidden until the flight lands)
  function fly(reps, from, cell) {
    if (!cell || !from || S.reduced()) return;
    const k = app.getBoundingClientRect().width / app.offsetWidth || 1;
    const base = app.getBoundingClientRect();
    const to = cell.getBoundingClientRect();
    const fs = Math.max(60, from.h / 0.72 / k);
    const f = document.createElement('div');
    f.className = 'flyer';
    f.textContent = reps;
    const w = fs * 0.64 * String(reps).length + 24;
    f.style.fontSize = fs + 'px';
    f.style.width = w + 'px';
    f.style.height = fs + 'px';
    f.style.left = (from.cx - base.left) / k - w / 2 + 'px';
    f.style.top = (from.cy - base.top) / k - fs / 2 + 'px';
    app.appendChild(f);
    cell.style.opacity = '0';
    const sc = parseFloat(getComputedStyle(cell).fontSize) / fs;

        { transform: 'scale(1)', opacity: 1, offset: 0.14 },

      ],
      { duration: 560, easing: EASE_SHEET }

    const end = function () {
      if (landed) return;
      landed = true;
      f.remove();
      cell.style.opacity = '';
    };
    a.onfinish = a.oncancel = end;
    setTimeout(end, 700);
  }

  // ---- a rep, a set, the rest ---------------------------------------------------------------------------------------------------
  function bestReps() {
    const w = weight();
    let best = null;
    const see = (x) => x.w >= w && (best == null || x.reps > best) && (best = x.reps);
    S.HISTORY.forEach((wk) => wk.exercises.forEach((e) => e.id === st.id && e.sets.forEach(see)));

  }
  function rep(by) {

    if (plain()) S.PLAIN.kick();
    else if (clean()) S.G.kick();
    else S.LENS.kick();
    S.BG.flow(0.18);
    if (((st.best != null && st.count > st.best) || (st.heavier && st.count === 1)) && !st.pr) {
      st.pr = true;
      SND.beat();
      UI.toast('new best. a real one.', true);
      st.anyPr = true;
      if (plain()) S.PLAIN.record();
      else if (!clean()) S.LENS.record();

  function startSet(by) {

  function land() {

    st.told = {};
    SND.close();
    voice.say('Set ' + S.setsOf(st.id).length + ', ' + S.reps(reps));
    UI.say('Set ' + S.setsOf(st.id).length + ', ' + S.reps(reps));
    const from = countRect();
    const cell = insertLap();
    S.BG.flow(0.7);

  let raf = 0;
  let lastT = 0;
  function startLoop() {

  }

  }

  function frame(t) {

    st.gone += dt * (st.fast ? 4 : 1) * (S.timeScale || 1);

    if (g3ready) S.G.ring(Math.max(0, 1 - st.gone / REST()), true);
    const left = REST() - st.gone;

    const glow = document.createElement('i');

  // ---- sheets: the weight, a set, the finish, picking a machine --------------------------------------------------------------
  function openWeight() {
    const e = ex();
    UI.sheet('Weight', UI.stepper('w', 'Weight', S.unit()), function (sh) {
      const r = S.roller(sh.querySelector('[data-v="w"]'), { dist: 0.4 });

      sh.querySelectorAll('.stepper .circle').forEach(function (b) {

    }, { done: true });
  }
  function openSet(i) {
    const s = S.setsOf(st.id)[i];

    const e = ex();
    UI.sheet('Set ' + (i + 1), UI.stepper('reps', 'Reps', 'reps') + UI.stepper('w', 'Weight', S.unit()) + '<button class="danger-link" data-act="delete">Delete set</button>', function (sh) {

  // a set by hand: its reps and weight, then the rest starts as after a counted set

  // ---- opening and closing: the Lift rises over Home, Home steps back (Emil Kowalski: in 420 ms, out faster) ----------------------
  function show(o) {
