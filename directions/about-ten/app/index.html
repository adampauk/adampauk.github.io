    if (st.phase === 'ready' || !running) {
      setPhase(st.phase === 'rest' && running ? 'rest' : 'ready');
      read(st.phase === 'rest' ? S.clock(Math.ceil(REST() - st.gone)) : '0', 0);
    }
    if (!S.reduced()) {
      const parts = [$('.lnav', lift), countEl, $('.sets', lift), $('.lbar', lift)];
      parts.forEach((p, i) => p.animate([{ opacity: 0, transform: 'translateY(' + (16 + i * 4) + 'px)' }, { opacity: 1, transform: 'none' }], { duration: 420, delay: 60 + i * 45, easing: EASE, fill: 'backwards' }));
    }
    S.BG.calm(1);
    S.BG.flow(0.9);
    if (!running) SND.go();
    UI.followGlass(700);

  }
  function hide(finished, fromDy) {
    if (!finished) SND.down(); // v24: the Lift goes down with one falling note
    // leaving in the middle of a set: the set is kept as it is (the sensor would end it the same way)
    if (!finished && st.phase === 'live') land();
    st.open = false;
    closeMenu();
    S.BG.calm(UI.baseCalm == null ? 0.35 : UI.baseCalm);
    // Home comes back (320 ms) while the Lift leaves (200 ms): one cross-fade, never an empty screen between them
    app.classList.remove('lifting');
    if (finished) {
      UI.renderAll();
      if (S.summaryFresh) {
        UI.tab('home');
        UI.push('workout', S.summaryFresh);
      }
    } else UI.renderRootsQuiet();
    UI.refreshCta();
    let once = false;
    const done = function () {
      if (once) return;
      once = true;
      lift.hidden = true;
      lift.style.transform = lift.style.opacity = '';
      S.LENS.visible(false);
      if (!finished && S.state.workout) outside();
      UI.followGlass(400);
    };
    if (S.reduced()) return done();
    const a = fromDy
      ? lift.animate([{ opacity: Number(lift.style.opacity || 1), transform: 'translateY(' + fromDy + 'px)' }, { opacity: 0, transform: 'translateY(' + Math.round(app.offsetHeight * 0.55) + 'px)' }], { duration: 260, easing: EASE })
      : lift.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(14px)' }], { duration: 200, easing: EASE });
    a.onfinish = done;
    setTimeout(done, 300); // the state never waits on an animation (a paused or hidden page)
    if (finished) S.BG.flow(1.2);
  }
  // ---- outside the Lift (minimised, or the phone locked): the Dynamic Island and the Lock Screen show the rest ----
  function outsideState() {
    const restLeft = Math.max(0, REST() - st.gone);
    return {
      id: st.id,
      name: ex().name,
      rest: st.phase === 'rest',
      frac: st.phase === 'rest' ? restLeft / REST() : 1,
      clock: st.phase === 'rest' ? S.clock(Math.ceil(restLeft)) : S.clock(S.elapsed()),
      last: lastSets().map((x) => x.reps),
      sets: S.setsOf(st.id).length,
    };
  }
  function outside() {
    if (UI.island) UI.island.show(outsideState());
    if (UI.lock) UI.lock.update(outsideState());
  }
  S.outsideState = outsideState;
  setInterval(function () {
    if (!st.open && S.state.workout) outside();
  }, 250);
  // ---- pull the Lift down to leave it: it follows the finger, a throw finishes it (Apple: projected, interruptible) ----
  (function pullDown() {
    let d = null;
    let back = null; // the return spring, if one is running
    let yNow = 0;
    lift.addEventListener('pointerdown', function (e) {
      if (!st.open || (e.button && e.button !== 0)) return;
      if (e.target.closest('button, .sets, .menu, .catch, .restc')) return;
      const k = app.getBoundingClientRect().width / app.offsetWidth || 1;
      // gestures: caught while it returns, the Lift continues from where it is (no jump to the finger)
      const from = back ? yNow : 0;
      if (back) back.stop(), (back = null);
      d = { id: e.pointerId, y0: e.clientY - from * k, k: k, hist: [], dy: from, on: from > 0 };
    });
    window.addEventListener('pointermove', function (e) {
      if (!d || e.pointerId !== d.id) return;
      let dy = (e.clientY - d.y0) / d.k;
      if (!d.on) {
        if (Math.abs(dy) < 10) return;
        if (dy < 0) return void (d = null);
        d.on = true;
      }
      if (dy < 0) dy = -((-dy * 30) / (30 + -dy));
      d.dy = dy;
      d.hist.push([performance.now(), dy]);
      if (d.hist.length > 6) d.hist.shift();
      lift.style.transform = 'translateY(' + dy.toFixed(1) + 'px)';
      lift.style.opacity = String(Math.max(0.45, 1 - dy / 800));
    });
    const end = function (e) {
      if (!d || e.pointerId !== d.id) return;
      const was = d;
      d = null;
      if (!was.on) return;
      const h = was.hist;
      const v = h.length > 1 ? ((h[h.length - 1][1] - h[0][1]) / Math.max(1, h[h.length - 1][0] - h[0][0])) * 1000 : 0;
      if (was.dy + ((v / 1000) * 0.998) / (1 - 0.998) > app.offsetHeight * 0.3) return hide(false, was.dy);
      // gestures: a drag applied force, so the return has a touch of bounce (damping 0.82); fast, seeded with the speed
      back = S.spring({
        from: was.dy, to: 0, velocity: v, response: S.reduced() ? 0.2 : 0.34, damping: S.reduced() ? 1 : 0.82, restDelta: 0.3, restSpeed: 5,
        onUpdate: (y) => ((yNow = y), (lift.style.transform = 'translateY(' + y.toFixed(1) + 'px)'), (lift.style.opacity = String(Math.max(0.45, 1 - Math.max(0, y) / 800)))),
        onDone: () => ((back = null), (yNow = 0), (lift.style.transform = lift.style.opacity = '')),
      });
    };
    window.addEventListener('pointerup', end);
    window.addEventListener('pointercancel', end);
  })();
  S.LIFT = {
    open: function (act, src, autoplay) {
      act = act || 'empty';
      if (act === 'resume' || (S.state.workout && act === 'empty')) return show(null);
      if (act === 'empty') return pick(false);
      const p = act.split(':');
      if (p[0] === 'plan') {
        const plan = S.planOf(p[1]);
        if (!plan) return;
        show({ ids: plan.ids, plan: plan.id });
      } else if (p[0] === 'ex') show({ ids: [p[1]], plan: null });
      if (autoplay) setTimeout(playSet, 700);
    },
    close: () => hide(false),
    pickMachine: () => pick(st.open),
    nudge: (dsec) => nudgeRest(dsec),
    count: function (c) {
      lift.dataset.count = c;
      if (!st.open) return;
      S.LENS.visible(c === 'soft');
      if (c === 'clean') ensure3D().then(() => g3ready && S.G.set(S.LENS.text() || '0', 0, kindOf()));
    },
    play: playSet,
    fast: (v) => (st.fast = !!v),
    rep: rep,
    land: land,
    st: st,
  };

  // ---- input -------------------------------------------------------------------------------------------------------------------------
  hit.addEventListener('pointerdown', function (e) {
    if (e.button && e.button !== 0) return;
    S.haptic();
    rep('hand');
  });
  hit.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      rep('hand');
    }
  });
  $('.lclose', lift).addEventListener('click', () => hide(false));
  $('.lex', lift).addEventListener('click', openMenu);
  $('.lw', lift).addEventListener('click', openWeight);
  $('.lnext', lift).addEventListener('click', next);
  $('.finish', lift).addEventListener('click', openFinish);
  $('.addset', lift).addEventListener('click', addByHand);
  $('.rminus', lift).addEventListener('click', () => nudgeRest(-15));
  $('.rplus', lift).addEventListener('click', () => nudgeRest(15));
  lapsEl.addEventListener('click', function (e) {
    const li = e.target.closest('li[data-i]');
    if (li) openSet(Number(li.dataset.i));
  });
  document.addEventListener('keydown', function (e) {
    if (!st.open) return;
    if (e.key === 'Escape' && menu.classList.contains('open')) closeMenu();
    if ((e.key === 'l' || e.key === 'L') && !app.classList.contains('sheet-open')) playSet();
  });
  // Home's Start button says so when a workout is running
  const homeRoot = UI.ROOTS.home;
  UI.ROOTS.home = function () {
    const r = homeRoot();
    if (S.state.workout) r.cta = { label: 'Back to workout', act: 'resume' };
    return r;
  };
  setPhase('ready');
  // the count's glass needs the painter: start the app, then the lens
  UI.start();
  if (!S.LENS.init(countEl)) countEl.classList.add('flat');
  S.PLAIN.init(countEl);
  if (UI.accent && S.LENS.accent) S.LENS.accent(UI.accent);
  S.LENS.set('0', 0);
})();

// Sedulo v24: the showcase (16 Nov 2026, his ask: every planned animation and every sound, in the previews). Two rows
// in the prototype panel: Sounds plays each sound of the kit on its own; Motion plays each moment where it lives, in
// the real screens, so it can be judged in any of the sixteen looks. The full list with what each one means is in
// docs/MOTION-SOUND.md.
(function () {
  'use strict';
  const S = window.S;
  const UI = S.UI;
  const proto = document.querySelector('.proto');
  if (!proto) return;
  const app = document.getElementById('app');
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const $ = (q) => app.querySelector(q);
  const tap = (el) => el && el.click();
  const home = async () => {
    if (S.LIFT && S.LIFT.st.open) S.LIFT.close();
    UI.closeSheet();
    await wait(350);
  };
  const SOUND_NAMES = {
    rep: 'Rep', beat: 'New best', close: 'Set saved', tick: 'Step', toggle: 'Switch', open: 'Sheet up', down: 'Sheet down',
    go: 'Start', chime: 'Done', sweep: 'Score', holdStart: 'Hold', thud: 'Hold lands', soon: 'Rest 10 s', restGo: 'Rest over',
    fault: 'Problem', tag: 'Tag read', pick: 'Pick up', drop: 'Put down', pop: 'Arrives', whoosh: 'Send', fanfare: 'Goal',
  };
  const play = function (k) {
    UI.snd.unlock();
    if (k === 'sweep') return UI.snd.sweep(1.2);
    if (k === 'holdStart') return (UI.snd.holdStart(), setTimeout(UI.snd.holdStop, 1100));
    if (k === 'tick') return UI.snd.tick(true);
    if (k === 'toggle') return UI.snd.toggle(true);
    return UI.snd[k] && UI.snd[k]();
  };
  const MOTION = [
    ['Open a block', 'A page opens out of the block you pressed, and closes back into it', async function () {
      await home();
      UI.tab('progress');
      await wait(500);
      tap($('.pg:not([hidden]) [data-go="exercises"]'));
      await wait(1800);
      UI.back();
    }],
    ['Numbers count', 'Numbers count up and lines draw when a page opens', async function () {
      await home();
      UI.tab('progress');
      await wait(400);
      const pg = app.querySelector('.pg.root:not([hidden])');
      UI.countUp(pg);
      UI.drawCharts(pg);
    }],
    ['Weight line', 'A machine\'s line draws itself', async function () {
      await home();
      UI.tab('progress');
      await wait(300);
      UI.push('exercise', 'leg-press');
    }],
    ['Rep', 'Each rep rolls the serif number up', async function () {
      await home();
      S.LIFT.open('ex:chest-press');
      await wait(900);
      S.LIFT.play();
    }],
    ['Rest', 'A set lands, the screen turns red, the rest runs fast: ten seconds left, then rest\'s over', async function () {
      await home();
      S.LIFT.open('ex:chest-press');
      await wait(900);
      S.LIFT.play();
      const f = proto.querySelector('[data-lift="fast"]');
      if (f && f.getAttribute('aria-pressed') !== 'true') f.click();
    }],
    ['Tag read', 'The phone reads a machine\'s tag: two pings and a ripple', async function () {
      await home();
      if (app.dataset.mode === 'mine') UI.setMode('gym');
      S.LIFT.open('empty');
      await wait(1300);
      tap(document.querySelector('.sheet .pk[data-id="leg-press"]'));
    }],
    ['Sheet', 'A sheet rises and falls', async function () {
      await home();
      UI.sheet('A sheet', '<p class="hint">It rises with one soft note and goes down with a falling one.</p>');
      await wait(1500);
      UI.closeSheet();
    }],
    ['Hold', 'Hold to confirm: the fill, the rising tone, the thud', async function () {
      await home();
      UI.tab('settings');
      await wait(300);
      UI.push('account');
      await wait(700);
      tap($('.pg:last-child [data-act="delete"]') || app.querySelector('[data-act="delete"]'));
      await wait(700);
      const h = document.querySelector('.sheet .hold');
      if (h) h.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
    }],
    ['Reorder', 'A machine picked up, moved and put down in a plan', async function () {
      await home();
      UI.tab('plans');
      await wait(300);
      const p = S.PLANS[0];
      if (!p) return;
      UI.push('editplan', p.id);
      await wait(800);
      const g = app.querySelector('.ordl .grip');
      if (!g) return;
      const r = g.getBoundingClientRect();
      const h = g.closest('.ordr').getBoundingClientRect().height;
      const o = { bubbles: true, pointerId: 9, clientX: r.left + r.width / 2 };
      g.dispatchEvent(new PointerEvent('pointerdown', Object.assign({ clientY: r.top + r.height / 2 }, o)));
      for (let i = 1; i <= 12; i++) {
        await wait(40);
        g.dispatchEvent(new PointerEvent('pointermove', Object.assign({ clientY: r.top + r.height / 2 + (h * 2 * i) / 12 }, o)));
      }
      await wait(250);
      g.dispatchEvent(new PointerEvent('pointerup', Object.assign({ clientY: r.top + r.height / 2 + h * 2 }, o)));
    }],
    ['Share', 'The card rises toward you; Share sends it away', async function () {
      await home();
      const w = S.lastWorkout();
      if (!w) return;
      UI.tab('progress');
      await wait(300);
      UI.push('workout', w.id);
      await wait(700);
      UI.shareSheet(w);
    }],
    ['Problem', 'Something went wrong: a calm sheet and two low notes', async function () {
      await home();
      UI.problem('sensor');
    }],
    ['Search', 'Rows leave and come back as you type', async function () {
      await home();
      UI.tab('progress');
      await wait(300);
      UI.push('exercises');
      await wait(700);
      const i = app.querySelector('.pg:last-child .srch input') || app.querySelector('.srch input');
      if (!i) return;
      for (const q of ['l', 'le', 'leg', 'le', 'l', '']) {
        i.value = q;
        i.dispatchEvent(new Event('input', { bubbles: true }));
        await wait(420);
      }
    }],
    ['Finish', 'A workout ends: the summary rises, then Home fills the day', async function () {
      await home();
      S.LIFT.open('ex:chest-press');
      await wait(900);
      for (let k = 0; k < 2; k++) {
        tap(app.querySelector('.addset'));
        await wait(600);
        tap(document.querySelector('.sheet [data-done]'));
        await wait(700);
      }
      tap(app.querySelector('.finish'));
      await wait(800);
      tap(document.querySelector('.sheet [data-act="end"]'));
    }],
  ];
  proto.insertAdjacentHTML('beforeend',
    '<span class="long plab">Sounds</span><div class="bgs snds">' + UI.SOUNDS.map((k) => '<button data-snd="' + k + '">' + (SOUND_NAMES[k] || k) + '</button>').join('') + '</div>' +
    '<span class="long plab">Motion</span><div class="bgs mots">' + MOTION.map((m, i) => '<button data-mot="' + i + '" title="' + m[1].replace(/"/g, '&quot;') + '">' + m[0] + '</button>').join('') + '</div>');
  proto.querySelectorAll('[data-snd]').forEach((b) => b.addEventListener('click', () => play(b.dataset.snd)));
  proto.querySelectorAll('[data-mot]').forEach((b) => b.addEventListener('click', () => MOTION[Number(b.dataset.mot)][2]()));
  UI.MOTION = MOTION;

  // ---- the menu (v25, his note: the panel did not work well: one long column of everything). Four tabs: Look (the
  // presets with a swatch each, then each switch), Motion (the moments and the Lift's controls), Sound, States (data,
  // mode, problems, screens); the tab is remembered; the panel is wider and its buttons larger
  const TABS = [
    ['look', 'Look', ['Look', 'Corners', 'Older looks']],
    ['motion', 'Motion', ['Motion', 'Lift']],
    ['sound', 'Sound', ['Sounds']],
    ['states', 'States', ['Data', 'Mode', 'Problems', 'Screens']],
  ];
  const head = document.createElement('div');
  head.className = 'ptabs';
  head.setAttribute('role', 'tablist');
  head.innerHTML = TABS.map((t) => '<button role="tab" data-ptab="' + t[0] + '">' + t[1] + '</button>').join('');
  const toggle = proto.querySelector('.proto-toggle');
  if (toggle) toggle.after(head);
  else proto.prepend(head);
  const panes = {};
  TABS.forEach(function (t) {
    const pane = document.createElement('div');
    pane.className = 'ppane';
    pane.dataset.pane = t[0];
    panes[t[0]] = pane;
    proto.appendChild(pane);
  });
  // each section is a label and its buttons: move both into their tab, in the tab's own order
  const labels = Array.prototype.slice.call(proto.querySelectorAll(':scope > .plab'));
  TABS.forEach(function (t) {
    t[2].forEach(function (name) {
      const lab = labels.find((l) => l.textContent.trim() === name);
      if (!lab) return;
      const grid = lab.nextElementSibling;
      panes[t[0]].appendChild(lab);
      if (grid && grid.classList.contains('bgs')) panes[t[0]].appendChild(grid);
    });
  });
  // whatever is left (a note, an older control) goes under States
  Array.prototype.slice.call(proto.children).forEach(function (el) {
    if (el === head || el === toggle || el.classList.contains('ppane')) return;
    panes.states.appendChild(el);
  });
  // a swatch on each preset: the background's tone and the colour
  const L = UI.LOOKS;
  if (L && L.PRESETS) {
    const hex = (c) => '#' + c.map((v) => Math.round(Math.min(1, v) * 255).toString(16).padStart(2, '0')).join('');
    proto.querySelectorAll('[data-combo]').forEach(function (b) {
      const p = L.PRESETS[Number(b.dataset.combo)];
      const th = L.THEME[p[1]];
      const bg = th.tone ? hex(th.mid) : '#cfe2fb';
      const ac = p[3] === 'classic' ? '#0071e3' : hex(L.COL[p[3]]);
      b.insertAdjacentHTML('afterbegin', '<i class="sw" style="background:' + bg + '"><i style="background:' + ac + '"></i></i>');
    });
  }
  const show = function (k) {
    TABS.forEach((t) => (panes[t[0]].hidden = t[0] !== k));
    head.querySelectorAll('[data-ptab]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.ptab === k)));
    try {
      localStorage.setItem('sedulo.v34.ptab', k);
    } catch (e) {}
  };
  head.addEventListener('click', (e) => e.target.closest('[data-ptab]') && show(e.target.closest('[data-ptab]').dataset.ptab));
  let first = 'look';
  try {
    first = localStorage.getItem('sedulo.v34.ptab') || 'look';
  } catch (e) {}
  show(TABS.some((t) => t[0] === first) ? first : 'look');
})();
</script>
