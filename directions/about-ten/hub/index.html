<!doctype html>
<html lang="en" data-brand="abten">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F1F0EE">
<title>about ten. Hub for gyms</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<script>if(/[?&]mode=app/.test(location.search))document.documentElement.setAttribute("data-mode","app")</script>
<style>
/* The package's shared kit: two brand looks (readout, about ten.), the shell, cards, figures, charts and motion.
   Rule for these screens: numbers and pictures first, labels of one or two words, no sentences. */
:root{--ease:cubic-bezier(.23,1,.32,1);--ease-io:cubic-bezier(.77,0,.175,1);--ease-drawer:cubic-bezier(.32,.72,0,1);--side:240px}
[data-brand="readout"]{--bg:#F5F5F2;--card:#fff;--ink:#17181A;--mute:#62666D;--mute2:#8B8D90;--line:#E3E4E0;--soft:#EEEEEB;
  --acc:#2747D6;--acc2:#1539F5;--accsoft:#EEF1FE;--good:#1F8A5B;--warn:#C26616;--amber:#C26616;--teal:#2B9C8F;
  --hero:radial-gradient(120% 140% at 15% 0%,#4A68EC 0%,#2747D6 26%,#16267A 62%,#0A1236 100%);
  --r0:#F0F2FB;--r1:#C9D3FF;--r2:#8CA2FF;--r3:#4C68E6;--r4:#2747D6;--r5:#13235E;
  --c1:#2747D6;--c2:#8CA2FF;--c3:#C26616;--c4:#2B9C8F;--c5:#17181A;
  --t:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--m:"Geist Mono",ui-monospace,Menlo,monospace;--d:"Geist",system-ui,sans-serif;
  --rad:22px;--radsm:14px;--shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.045)}
[data-brand="abten"]{--bg:#F1F0EE;--card:#fff;--ink:#0A0A0A;--mute:#66625C;--mute2:#8E8A83;--line:#E3E1DC;--soft:#F4F3F0;
  --acc:#D7201B;--acc2:#B3140F;--accsoft:#FBE3E1;--good:#2E7D4F;--warn:#C26616;--amber:#C26616;--teal:#2E7D6F;
  --hero:radial-gradient(120% 130% at 30% 10%,#C21A1B 0%,#8C0D10 48%,#350405 100%);
  --r0:#FBEDEC;--r1:#F6C9C6;--r2:#EE8C86;--r3:#D7201B;--r4:#A3120E;--r5:#4A0607;
  --c1:#D7201B;--c2:#F2A39F;--c3:#0A0A0A;--c4:#8E8A83;--c5:#6E0B09;
  --t:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--m:"Instrument Sans",system-ui,sans-serif;--d:"Instrument Serif","Times New Roman",serif;
  --rad:20px;--radsm:14px;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 30px -8px rgba(40,20,10,.08)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--t);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
p,h1,h2,h3,h4{margin:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* type */
.lab{font-family:var(--m);font-size:.68rem;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
[data-brand="abten"] .lab{font-size:.8rem;font-weight:600;letter-spacing:0;text-transform:lowercase}
.ttl{font-family:var(--d);font-weight:500;font-size:2rem;letter-spacing:-.035em;line-height:1.05}
[data-brand="abten"] .ttl{font-weight:400;font-size:2.8rem;letter-spacing:-.01em;line-height:.92;text-transform:lowercase}
.num{font-family:var(--d);font-weight:400;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
[data-brand="abten"] .num{letter-spacing:-.02em}
.mute{color:var(--mute)}
.smp{display:inline-flex;align-items:center;gap:6px;font-family:var(--m);font-size:.64rem;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:var(--card)}
[data-brand="abten"] .smp{font-size:.74rem;letter-spacing:0;text-transform:lowercase;font-weight:600}
.smp::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn)}

/* shell */
.app{min-height:100vh;display:grid;grid-template-columns:var(--side) minmax(0,1fr);align-content:start}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:16px;padding:22px 14px 18px;border-right:1px solid var(--line)}
.logo{display:inline-flex;flex-direction:column;gap:5px;text-decoration:none;padding:0 8px}
.logo b{font-weight:600;font-size:1.45rem;letter-spacing:-.045em;line-height:1}
.logo .ticks{display:flex;gap:3px;align-items:flex-end;height:10px}.logo .ticks i{width:1.5px;height:5px;background:#B9BBBE;border-radius:1px}.logo .ticks i.on{height:10px;background:var(--acc)}
[data-brand="abten"] .logo b{font-family:var(--d);font-style:italic;font-weight:400;font-size:1.9rem;letter-spacing:-.01em}
[data-brand="abten"] .logo .ticks{display:none}
.logo small{font-family:var(--m);font-size:.64rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
[data-brand="abten"] .logo small{font-size:.78rem;letter-spacing:0;text-transform:lowercase;font-weight:600}
.who{padding:0 8px;display:flex;gap:10px;align-items:center}
.who b{display:block;font-weight:600;font-size:.95rem}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:.86rem;background:var(--accsoft);color:var(--acc2)}
.av.lg{width:64px;height:64px;font-size:1.3rem}
[data-brand="abten"] .av{font-family:var(--d);font-weight:400;font-size:1.05rem}
[data-brand="abten"] .av.lg{font-size:1.7rem}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--mute);font-weight:500;font-size:.95rem;transition:background-color .15s ease,color .15s ease}
.nav a svg{flex:none}
.nav a .badge{margin-left:auto;min-width:22px;height:22px;border-radius:999px;background:var(--acc);color:#fff;font-size:.74rem;font-weight:600;display:grid;place-items:center;padding:0 6px}
.nav a[aria-current="page"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
[data-brand="abten"] .nav a{text-transform:lowercase}
@media (hover:hover) and (pointer:fine){.nav a:hover{color:var(--ink)}}
.sidefoot{margin-top:auto;padding:0 8px;display:grid;gap:8px}
.wk{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px}
.wk button{width:34px;height:34px;border:0;border-radius:10px;background:none;display:grid;place-items:center;transition:background-color .15s ease,transform .16s var(--ease)}
.wk button:active{transform:scale(.94)}.wk button:disabled{opacity:.3;cursor:default}
.wk div{text-align:center;line-height:1.2}.wk div b{display:block;font-weight:600;font-size:.92rem}.wk div span{font-size:.74rem;color:var(--mute)}
[data-brand="abten"] .wk div b{text-transform:lowercase}
.top,.tabbar{display:none}
main{min-width:0;padding:26px 34px 60px;max-width:1320px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:20px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* cards and controls */
.card{background:var(--card);border-radius:var(--rad);box-shadow:var(--shadow);padding:20px;min-width:0;position:relative}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.ch h3{font-weight:500;font-size:1rem;letter-spacing:-.01em}
[data-brand="abten"] .ch h3{font-family:var(--d);font-weight:400;font-size:1.55rem;line-height:1;text-transform:lowercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:9px 16px;border:1px solid var(--line);background:var(--card);font-weight:500;font-size:.88rem;text-decoration:none;white-space:nowrap;transition:transform .16s var(--ease),background-color .2s ease,border-color .2s ease,color .2s ease}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
[data-brand="readout"] .btn.p{background:var(--ink);border-color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:.82rem}
[data-brand="abten"] .btn{text-transform:lowercase}
@media (hover:hover) and (pointer:fine){.btn:hover{border-color:var(--mute2)}.btn.p:hover{filter:brightness(1.12)}}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.76rem;font-weight:500;background:var(--soft);color:var(--mute);white-space:nowrap}
[data-brand="abten"] .chip{text-transform:lowercase}
.chip.on{background:var(--ink);color:#fff}
.chip.a{background:var(--accsoft);color:var(--acc2)}
.chip.g{background:#E3F4EA;color:var(--good)}
.chip.w{background:#FFF1DE;color:#94500F}
.chip svg{flex:none}
.seg{display:inline-flex;gap:3px;background:var(--soft);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 13px;font-weight:500;font-size:.84rem;color:var(--mute);transition:background-color .2s ease,color .2s ease}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
[data-brand="abten"] .seg button{text-transform:lowercase}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:.8rem;font-weight:600;font-variant-numeric:tabular-nums;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--mute)}
.delta.up{background:#E3F4EA;color:var(--good)}.delta.down{background:#FCE9E3;color:#B5480E}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.rows2{grid-row:span 2}

/* figures */
.fig{display:grid;gap:6px;align-content:start}
.fig .num{font-size:2.3rem}
.fig.big .num{font-size:clamp(2.6rem,4.6vw,3.8rem)}
.hero .fig.big .num{font-size:clamp(2rem,3vw,3rem)}
[data-brand="abten"] .hero .fig.big .num{font-size:clamp(2.4rem,3.6vw,3.6rem)}
.hb.wide div{grid-template-columns:minmax(0,1.6fr) minmax(40px,1fr) 40px}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}

/* hero band */
.hero{position:relative;overflow:hidden;border-radius:calc(var(--rad) + 4px);background:var(--hero);color:#fff;padding:24px 26px}
.hero .lab{color:rgba(255,255,255,.72)}
.hero .num{color:#fff}
.hero .delta{background:rgba(255,255,255,.16);color:#fff}
.hero .mute{color:rgba(255,255,255,.7)}
.hero h1{font-family:var(--d);font-weight:500;font-size:clamp(1.9rem,3.4vw,2.8rem);letter-spacing:-.04em;line-height:1}
[data-brand="abten"] .hero h1{font-weight:400;font-size:clamp(2.6rem,5vw,4.2rem);letter-spacing:-.01em;text-transform:lowercase;line-height:.9}
.glow{position:absolute;inset:auto -20% -60% 30%;height:120%;background:radial-gradient(closest-side,rgba(255,255,255,.18),rgba(255,255,255,0));pointer-events:none;animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-12%,-6%) scale(1.08)}}

/* charts */
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;padding:7px 10px;font-size:.8rem;line-height:1.3;box-shadow:0 8px 20px rgba(0,0,0,.2);opacity:0;transform:translateY(4px);transition:opacity .12s ease,transform .12s ease;white-space:nowrap}
.tip.on{opacity:1;transform:none}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:.76rem;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hb{display:grid;gap:9px}
.hb div{display:grid;grid-template-columns:minmax(0,1fr) minmax(60px,1.4fr) minmax(44px,auto);gap:10px;align-items:center;font-size:.86rem}
.hb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb i{height:8px;border-radius:4px;background:var(--soft);position:relative;overflow:hidden}
.hb i u{position:absolute;inset:0 auto 0 0;background:var(--acc);border-radius:4px;transform-origin:left}
.hb em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}

/* motion: things arrive once, then numbers and bars move when the week changes */
.m-in{animation:min .6s var(--ease) both}
@keyframes min{from{opacity:0;transform:translateY(10px)}}
.gb{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(var(--s,1));transition:transform .75s var(--ease) var(--dl,0ms)}
.gx{transform-origin:left;transform:scaleX(var(--s,1));transition:transform .8s var(--ease) var(--dl,0ms)}
.dr{stroke-dasharray:1;stroke-dashoffset:var(--o,0);transition:stroke-dashoffset 1.2s var(--ease) var(--dl,0ms)}
.hc{transform-box:fill-box;transform-origin:center;opacity:var(--op,1);transform:scale(var(--sc,1));transition:opacity .4s ease var(--dl,0ms),transform .5s var(--ease) var(--dl,0ms)}
.pop{transform-box:fill-box;transform-origin:center;transform:scale(var(--sc,1));opacity:var(--op,1);transition:transform .6s var(--ease) var(--dl,0ms),opacity .3s ease var(--dl,0ms)}
.rg{transition:stroke-dasharray 1.1s var(--ease) var(--dl,0ms)}
.pulse{animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.55}70%{transform:scale(2.2);opacity:0}100%{opacity:0}}
.lift{transition:transform .2s var(--ease),box-shadow .2s ease}
@media (hover:hover) and (pointer:fine){.lift:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(0,0,0,.05),0 18px 36px rgba(0,0,0,.08)}}
.lift:active{transform:scale(.98)}

/* drawer, toast */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(10,10,12,.28);opacity:0;pointer-events:none;transition:opacity .3s ease}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:80;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);box-shadow:-20px 0 60px rgba(0,0,0,.18);transform:translateX(102%);transition:transform .32s var(--ease-io);overflow-y:auto;overscroll-behavior:contain;visibility:hidden}
.drawer.on{transform:none;visibility:visible;transition:transform .5s var(--ease-drawer)}
.dhead{position:sticky;top:0;z-index:2;background:var(--bg);padding:18px 20px 12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line)}
.dhead h2{font-weight:600;font-size:1.6rem;letter-spacing:-.035em;line-height:1.1}
[data-brand="abten"] .dhead h2{font-family:var(--d);font-weight:400;font-size:2.4rem;letter-spacing:-.01em;line-height:.95;text-transform:lowercase}
.dbody{padding:16px 20px 40px;display:grid;gap:14px}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none;transition:transform .16s var(--ease)}
.x:active{transform:scale(.94)}
.toast{position:fixed;z-index:96;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:.9rem;box-shadow:0 12px 30px rgba(0,0,0,.25);transition:transform .35s var(--ease),opacity .25s ease;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{font-family:var(--m);font-weight:500;font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
[data-brand="abten"] th{font-size:.78rem;letter-spacing:0;text-transform:lowercase;font-weight:600}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer;transition:background-color .12s ease}
@media (hover:hover) and (pointer:fine){tbody tr.click:hover{background:var(--soft)}}
.n{text-align:right}
.tblwrap{overflow-x:auto}

/* the iPad frame for the app view */
.ipad-stage{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(90% 80% at 50% 30%,#FFFFFF,var(--bg))}
.ipad-stage > div{width:100%;display:grid;justify-items:center}
.ipad{position:relative;width:min(1180px,calc((100vh - 120px) * 1.44),calc(100vw - 56px));aspect-ratio:1180/820;border-radius:44px;padding:16px;background:linear-gradient(155deg,#dcdcdf,#a9abb0 30%,#e8e8ea 55%,#9fa1a6 80%,#cfd0d3);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7),inset 0 0 0 5px rgba(0,0,0,.12),0 2px 4px rgba(0,0,0,.18),0 40px 90px -30px rgba(0,0,0,.45)}
.ipad::before{content:"";position:absolute;inset:6px;border-radius:38px;background:#08090a}
.ipad iframe{position:relative;z-index:1;width:100%;height:100%;border:0;border-radius:26px;background:var(--bg);display:block}
.ipad .cam{position:absolute;z-index:2;left:50%;top:9px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#2b3550,#05070c)}
.under{margin-top:18px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}

/* responsive */
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.figs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:980px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.span3{grid-column:1/-1}.fgrid{grid-template-columns:1fr!important}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{display:flex;position:sticky;top:0;z-index:40;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .top .wk{grid-template-columns:30px auto 30px;padding:3px;border-radius:12px}.top .wk button{width:30px;height:30px}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px max(8px,env(safe-area-inset-bottom))}
  .tabbar a{display:grid;justify-items:center;gap:3px;font-size:.68rem;font-weight:500;color:var(--mute);text-decoration:none;padding:4px 0}
  [data-brand="abten"] .tabbar a{text-transform:lowercase}
  .tabbar a[aria-current="page"]{color:var(--acc)}
  main{padding:18px 16px 110px}
  .drawer{width:100%;top:auto;height:92vh;border-radius:22px 22px 0 0;transform:translateY(102%)}
  .g2,.g3{grid-template-columns:1fr}.span2,.span3{grid-column:auto}
}
@media (max-width:900px){.hero > .grid{grid-template-columns:1fr!important}}
@media (max-width:560px){.hero .figs{grid-template-columns:repeat(2,minmax(0,1fr))!important}.hero .fig.big .num,[data-brand="abten"] .hero .fig.big .num{font-size:2.1rem}
.g4,.figs{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fig .num{font-size:1.9rem}.ttl{font-size:1.7rem}[data-brand="abten"] .ttl{font-size:2.3rem}.card{padding:16px}.hide-s{display:none!important}}
/* the app mode: big touch targets, a tab bar, no sidebar, the way it sits on an iPad */
[data-mode="app"] .app{grid-template-columns:1fr}
[data-mode="app"] .side{display:none}
[data-mode="app"] .top{display:flex;position:sticky;top:0;z-index:40;align-items:center;justify-content:space-between;gap:10px;padding:14px 22px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
[data-mode="app"] .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 24px max(10px,env(safe-area-inset-bottom))}
[data-mode="app"] .tabbar a{display:grid;justify-items:center;gap:3px;font-size:.72rem;font-weight:500;color:var(--mute);text-decoration:none;padding:4px 0}

function spark(vals,o){o=o||{};var w=o.w||120,h=o.h||32,max=Math.max.apply(null,vals),min=Math.min.apply(null,vals),rg=Math.max(1,max-min),d='';
  vals.forEach(function(v,i){var x=i*(w-4)/(vals.length-1)+2,y=h-4-(v-min)/rg*(h-8);d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)});
  var ly=h-4-(vals[vals.length-1]-min)/rg*(h-8);
  return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" aria-hidden="true"><path class="dr" pathLength="1" d="'+d+'" fill="none" stroke="'+(o.color||'var(--acc)')+'" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle class="pop" style="--dl:700ms" cx="'+(w-2)+'" cy="'+ly.toFixed(1)+'" r="2.8" fill="'+(o.color||'var(--acc)')+'"/></svg>'}
function heat(cells,rows,cols,o){o=o||{};var cw=o.cw||30,ch=o.ch||24,g=3,lw=o.lw===undefined?40:o.lw,w=lw+cols.length*(cw+g),h=18+rows.length*(ch+g),max=0,s='';
  cells.forEach(function(r){r.forEach(function(v){if(v>max)max=v})});
  cols.forEach(function(c,j){if(c!=='')s+='<text x="'+(lw+j*(cw+g)+cw/2)+'" y="11" text-anchor="middle" font-size="10.5" fill="var(--mute)" font-family="var(--t)">'+c+'</text>'});
  cells.forEach(function(r,i){if(lw)s+='<text x="0" y="'+(18+i*(ch+g)+ch/2+4)+'" font-size="11" fill="var(--mute)" font-family="var(--t)">'+rows[i]+'</text>';
    r.forEach(function(v,j){s+='<rect class="hc" style="--dl:'+((i+j)*16)+'ms" x="'+(lw+j*(cw+g))+'" y="'+(18+i*(ch+g))+'" width="'+cw+'" height="'+ch+'" rx="'+Math.min(5,ch/4)+'" fill="'+(v?ramp(v,max):'var(--soft)')+'"'+(o.tip?' data-tip="'+esc(o.tip(i,j,v))+'"':'')+'/>'})});
  return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(o.label||'')+'">'+s+'</svg>'}
function ring(f,o){o=o||{};var sz=o.size||64,sw=o.sw||6,r=(sz-sw)/2-1,c=2*Math.PI*r,p=Math.max(0,Math.min(1,f));
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 '+sz+' '+sz+'" aria-hidden="true" style="flex:none"><circle cx="'+sz/2+'" cy="'+sz/2+'" r="'+r+'" fill="none" stroke="'+(o.track||'var(--line)')+'" stroke-width="'+sw+'"/><circle class="rg" style="--dl:'+(o.dl||0)+'ms" cx="'+sz/2+'" cy="'+sz/2+'" r="'+r+'" fill="none" stroke="'+(o.color||'var(--acc)')+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+(c*p).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 '+sz/2+' '+sz/2+')"/>'+(o.text?'<text x="50%" y="50%" dy=".35em" text-anchor="middle" font-family="var(--d)" font-size="'+(o.fs||sz*.3)+'" fill="'+(o.tc||'var(--ink)')+'">'+o.text+'</text>':'')+'</svg>'}
function scale(f,o){o=o||{};var n=o.n||31,lit=Math.round(Math.max(0,Math.min(1,f))*(n-1)),s='',col=o.color||'var(--acc)';
  for(var i=0;i<n;i++){var x=i*7+1,on=i<=lit,maj=i%5===0,rd=i===lit,hh=rd?26:(maj?16:11);s+='<rect class="gb" style="--dl:'+(i*14)+'ms" x="'+(x-1)+'" y="'+(26-hh)+'" width="2" height="'+hh+'" rx="1" fill="'+(on?col:(o.light?'rgba(255,255,255,.25)':'var(--line)'))+'"/>'}
  return '<svg class="chart" viewBox="0 -8 '+(n*7)+' 36" aria-hidden="true">'+s+'<circle class="pop" style="--dl:'+(lit*14+200)+'ms" cx="'+(lit*7)+'" cy="-3" r="4" fill="'+(o.light?'#fff':'var(--card)')+'" stroke="'+(o.light?'#fff':'var(--ink)')+'" stroke-width="2"/></svg>'}
function gauge(f,o){return AB?ring(f,Object.assign({size:52,sw:5},o||{})):'<div style="width:100%;max-width:220px">'+scale(f,o)+'</div>'}
function donut(parts,o){o=o||{};var sz=o.size||180,sw=o.sw||22,r=(sz-sw)/2,c=2*Math.PI*r,tot=parts.reduce(function(a,p){return a+p.v},0)||1,acc=0,s='';
  parts.forEach(function(p,i){var f=p.v/tot,len=Math.max(0,c*f-3);s+='<circle class="rg" style="--dl:'+(i*90)+'ms" cx="'+sz/2+'" cy="'+sz/2+'" r="'+r+'" fill="none" stroke="'+p.color+'" stroke-width="'+sw+'" stroke-dasharray="'+len.toFixed(1)+' '+c.toFixed(1)+'" transform="rotate('+(-90+acc*360)+' '+sz/2+' '+sz/2+')" data-tip="<b>'+esc(p.label)+'</b><br>'+fmt(p.v)+' ('+Math.round(f*100)+'%)"/>';acc+=f});
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 '+sz+' '+sz+'" role="img" aria-label="'+esc(o.label||'')+'">'+s+(o.center?'<text x="50%" y="48%" text-anchor="middle" font-family="var(--d)" font-size="'+sz*.17+'" fill="var(--ink)">'+o.center+'</text><text x="50%" y="62%" text-anchor="middle" font-family="var(--t)" font-size="11" fill="var(--mute)">'+(o.sub||'')+'</text>':'')+'</svg>'}

/* ---- shell and router ---- */
var CFG,cur;
function mount(o){CFG=o;var ticks='<span class="ticks" aria-hidden="true">'+'<i></i>'.repeat(8)+'<i class="on"></i><i></i><i></i></span>';
  document.body.innerHTML='<div class="app"><aside class="side" aria-label="'+esc(o.logo)+'"><a class="logo" href="#'+o.def+'"><b>'+esc(o.logo)+'</b>'+ticks+'<small>'+esc(o.sub)+'</small></a>'
   +(o.who?'<div class="who"><span class="av">'+esc(o.who.init)+'</span><div><b>'+esc(o.who.name)+'</b><span class="smp">Sample data</span></div></div>':'')
   +'<div id="sidex"></div><nav class="nav" id="nav" aria-label="Sections"></nav><div class="sidefoot" id="sidefoot"></div></aside>'
   +'<header class="top"><a class="logo" href="#'+o.def+'"><b>'+esc(o.logo)+'</b>'+ticks+'</a><div id="topx" style="display:flex;gap:8px;align-items:center"></div></header>'
   +'<main id="view" tabindex="-1"></main><nav class="tabbar" id="tabbar" aria-label="Sections"></nav></div>'
   +'<div class="scrim" id="scrim"></div><aside class="drawer" id="drawer" role="dialog" aria-modal="true"></aside><div class="tip" id="tip" role="tooltip"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>';
  initFloating();window.addEventListener('hashchange',function(){closeDrawer();render(true)});render(true)}
function chrome(){var o=CFG;document.getElementById('sidex').innerHTML=o.sidex?o.sidex():'';document.getElementById('topx').innerHTML=o.topx?o.topx():'';
  document.getElementById('sidefoot').innerHTML=o.foot?o.foot():'<span class="smp">Sample data</span>';
  var on=(o.parent&&o.parent[cur])||cur;var nav=function(tab){return o.nav.filter(function(n){return !n[3]}).map(function(n){var b=o.badge?o.badge(n[0]):0;return '<a href="#'+n[0]+'"'+(on===n[0]?' aria-current="page"':'')+'>'+ic(n[2],tab?22:20)+'<span>'+T(n[1])+'</span>'+(!tab&&b?'<span class="badge">'+b+'</span>':'')+'</a>'}).join('')};
  document.getElementById('nav').innerHTML=nav(false);document.getElementById('tabbar').innerHTML=nav(true)}
function render(animated,keep){var o=CFG,r=(location.hash||'#'+o.def).slice(1).split('/'),k=o.views[r[0]]?r[0]:o.def,y=scrollY;cur=k;
  var v=document.getElementById('view');v.innerHTML='<div'+(animated?' class="m-in"':'')+'>'+o.views[k](r.slice(1))+'</div>';chrome();
  document.title=T(o.nav.find(function(n){return n[0]===k})[1])+' | '+o.logo+' '+o.sub.toLowerCase();
  if(keep)window.scrollTo(0,y);else if(animated)window.scrollTo(0,0);animate(v);if(o.after)o.after(k,v)}
return {AB:AB,RED:RED,T:T,fmt:fmt,fmtN:fmtN,esc:esc,DAYS:DAYS,DAYL:DAYL,MON:MON,MONL:MONL,ic:ic,N:N,delta:delta,toast:toast,openDrawer:openDrawer,closeDrawer:closeDrawer,dhead:dhead,
  animate:animate,sd:sd,ramp:ramp,bars:bars,hbars:hbars,line:line,spark:spark,heat:heat,ring:ring,scale:scale,gauge:gauge,donut:donut,mount:mount,render:render,chrome:chrome};
})();

</script>
<script>
/* The owner hub, version 5: calmer and in liquid glass. The hero is the gym's week as a glass sculpture (wave.js),
   which works for every gym without a floor plan. Around it only five or six tiles. The week is picked from the title,
   no arrows or toggles. No names on the overview or today; elsewhere only members who agreed, never a "no name" row.
   No sentences, no advice. Data: the sample gym (gym.js), made up. */
(function(){
'use strict';
document.documentElement.setAttribute('data-hub','5');
var G=window.GYM,WKS=window.HUB.weeks,T=K.T,fmt=K.fmt,N=K.N,esc=K.esc,M=G.machines,NM=M.length,LAST=G.nwk-1,LOGO='about ten.';
var S={E:LAST,per:'week',sort:'most',grp:'all',nf:'all',mail:true,wp:false},QMIN=14,QMAX=49,TVT=null,TVS=null;
var DEF=innerWidth<900?'today':'week';
var GROUPS=[['upper push','Upper push'],['upper pull','Upper pull'],['lower push','Lower push'],['lower pull','Lower pull'],['core','Core']];
var HOURCOLS=G.hours.map(function(h,j){return j%3===0?String(h).padStart(2,'0'):''});
function pct(a,b){return b?(a-b)/b*100:0}
function hh(h){return String(h).padStart(2,'0')+':00'}
function dm(D){var d=G.dateOf(D);return d.getDate()+' '+K.MON[d.getMonth()]}
function d2(s){var d=new Date(s+'T00:00:00');return d.getDate()+' '+K.MON[d.getMonth()]}
function wkOf(D){return Math.floor(D/7)}
function wkLabel(w){var x=WKS[w],a=new Date(x.start+'T00:00:00'),b=new Date(x.end+'T00:00:00');return (a.getMonth()===b.getMonth()?a.getDate():a.getDate()+' '+K.MON[a.getMonth()])+'–'+b.getDate()+' '+K.MON[b.getMonth()]}
function rangeLabel(a,b){return d2(WKS[a].start)+'–'+d2(WKS[b].end)}
function span(){return S.per==='month'?4:1}
function range(E,n){var a=[];for(var w=Math.max(0,E-n+1);w<=E;w++)a.push(w);return a}
function route(){return (location.hash||'#'+DEF).slice(1).split('/')[0]}
function smp(){return '<span class="smp">Sample data</span>'}

/* ---- the numbers (as in version 3) ---- */
function P(E,n){var ws=range(E,n),o={ws:ws,ses:0,reps:0,recs:0,newM:0,mem:0,mu:[]};for(var i=0;i<NM;i++)o.mu.push(0);
  ws.forEach(function(w){var x=G.weeks[w];o.ses+=x.ses;o.reps+=x.reps;o.recs+=x.recs;o.newM+=x.newM;x.mu.forEach(function(v,i){o.mu[i]+=v})});
  o.mem=G.members.filter(function(m){return ws.some(function(w){return m.cnt[w]>0})}).length;return o}
function prevP(){var n=span();return S.E-2*n+1>=0?P(S.E-n,n):null}
function heatP(ws){var g=[];for(var d=0;d<7;d++){var row=[];for(var h=0;h<17;h++){var v=0;ws.forEach(function(w){v+=G.weeks[w].heat[d][h]});row.push(v/ws.length)}g.push(row)}return g}
var HMAX=0;G.weeks.slice(0,G.nwk).forEach(function(w){w.heat.forEach(function(r){r.forEach(function(v){if(v>HMAX)HMAX=v})})});
function peakOf(g){var hi={v:-1,d:0,h:0};g.forEach(function(r,d){r.forEach(function(v,h){if(v>hi.v)hi={v:v,d:d,h:h}})});return hi}
function quiet(T0){var out=[];G.members.forEach(function(m){var i=m.ds.length-1;while(i>=0&&m.ds[i]>T0)i--;if(i<0)return;var last=m.ds[i],since=T0-last;if(since<QMIN||since>QMAX)return;
  var prior=0;for(var j=i;j>=0&&m.ds[j]>last-56;j--)prior++;if(prior>=6)out.push({m:m,since:since,last:last,per:prior/8})});return out.sort(function(a,b){return a.since-b.since})}
function cohort(E){return G.members.filter(function(m){var jw=wkOf(m.joinD);return m.isNew&&jw>=E-5&&jw<=E}).sort(function(a,b){return a.joinD-b.joinD}).map(function(m){var jw=wkOf(m.joinD),c=[];
  for(var k=0;k<4;k++){var w=jw+k;c.push(w>E?-1:Math.min(2,m.cnt[w]))}return {m:m,c:c}})}
function kept(cols){var r=cols.filter(function(x){return x.c[3]!==-1});return {reached:r.length,kept:r.filter(function(x){return x.c[3]>0}).length}}
function stronger(E){var o={E:E,up:[],same:[],dn:[],n:0,two:0,g:0,gw:Math.min(12,E)};
  if(E>=5)G.members.forEach(function(m){if(m.cnt[E]+m.cnt[E-1]>0&&m.cnt[E-4]+m.cnt[E-5]>0){var c=(m.sw[E]/m.sw[E-4]-1)*100;(c>1.5?o.up:c<-1.5?o.dn:o.same).push({m:m,c:c})}});
  o.n=o.up.length+o.same.length+o.dn.length;o.up.sort(function(a,b){return b.c-a.c});
  var ws=range(E,4),a4=G.members.filter(function(m){return ws.some(function(w){return m.cnt[w]>0})});
  o.two=a4.length?a4.filter(function(m){return ws.reduce(function(a,w){return a+m.cnt[w]},0)/ws.length>=2}).length/a4.length*100:0;
  var b=o.gw?G.members.filter(function(m){return m.cnt[E]+(E>0?m.cnt[E-1]:0)>0&&m.cnt[E-o.gw]>0}):[];
  o.g=b.length?b.reduce(function(a,m){return a+(m.sw[E]/m.sw[E-o.gw]-1)},0)/b.length*100:0;return o}
function series(f){var a=[];for(var w=Math.max(0,S.E-11);w<=S.E;w++)a.push(f(w));return a}

/* ---- the frame: logo, glass tabs, two round buttons ---- */
function bar(k){var tabs=[['week','Overview'],['today','Today'],['members','Members'],['machines','Machines']];
  return '<div class="b5"><a class="l5" href="#week"><b>'+esc(LOGO)+'</b><small>'+T('Hub for gyms')+'</small></a><nav class="tb5 lg" aria-label="Sections">'+tabs.map(function(t){return '<a href="#'+t[0]+'"'+(k===t[0]?' aria-current="page"':'')+'>'+T(t[1])+'</a>'}).join('')+'</nav>'
   +'<div class="i5"><a class="ib5 lg" href="#tv" aria-label="Gym TV" data-tip="'+esc(T('Gym TV'))+'"'+(k==='tv'?' aria-current="page"':'')+'>'+K.ic('tv',18)+'</a><a class="ib5 lg" href="#email" aria-label="Monday e-mail" data-tip="'+esc(T('Monday e-mail'))+'"'+(k==='email'?' aria-current="page"':'')+'>'+K.ic('mail',18)+'</a></div></div>'}
function frame(inner,k){return bar(k)+inner+'<div class="fx5"><span class="vers"><span class="lab">'+T('Earlier')+'</span><a href="v1/">v1</a><a href="v2/">v2</a><a href="v3/">v3</a><a href="v4/">v4</a></span>'+smp()+'<span class="mute">'+T('Data')+' 22 Feb 2027, 18:10</span></div>'}

/* ---- the week is picked from the title ---- */
function wkTitle(){return S.per==='month'?T('Last 4 weeks'):(S.E===LAST?T('This week'):T('Week')+' '+WKS[S.E].n)}
function wkSub(){return S.per==='month'?rangeLabel(Math.max(0,S.E-3),S.E):wkLabel(S.E)}
function picker(){var rows=[];for(var w=LAST;w>=Math.max(0,LAST-7);w--)rows.push('<button type="button" class="pr5'+(S.per==='week'&&S.E===w?' on':'')+'" data-wk="'+w+'"><b>'+(w===LAST?T('This week'):T('Week')+' '+WKS[w].n)+'</b><span>'+wkLabel(w)+'</span><em>'+fmt(G.weeks[w].ses)+'</em></button>');
  return '<div class="pop5 lg" role="listbox" aria-label="Week"><button type="button" class="pr5'+(S.per==='month'?' on':'')+'" data-wk4><b>'+T('Last 4 weeks')+'</b><span>'+rangeLabel(LAST-3,LAST)+'</span><em>'+fmt(P(LAST,4).ses)+'</em></button>'+rows.join('')+'</div>'}
function title(over,extra){return '<div class="tt5"><span class="lab">'+over+'</span><div class="wpw"><button type="button" class="wp5" data-wp aria-expanded="'+S.wp+'"><span class="ttl5">'+wkTitle()+'</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 10l5 5 5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'+(S.wp?picker():'')+'</div><div class="st5"><span>'+wkSub()+'</span>'+(extra||'')+'</div></div>'}
document.addEventListener('click',function(e){var t;
  if((t=e.target.closest('[data-wp]'))){S.wp=!S.wp;K.render(false,true);return}
  if((t=e.target.closest('[data-wk]'))){S.E=+t.getAttribute('data-wk');S.per='week';S.wp=false;K.render(false,true);return}
  if((t=e.target.closest('[data-wk4]'))){S.E=LAST;S.per='month';S.wp=false;K.render(false,true);return}
  if(S.wp&&!e.target.closest('.pop5')){S.wp=false;K.render(false,true)}
  if((t=e.target.closest('[data-sort]'))){S.sort=t.getAttribute('data-sort');K.render(false,true);return}
  if((t=e.target.closest('[data-grp]'))){S.grp=t.getAttribute('data-grp');K.render(false,true);return}
  if((t=e.target.closest('[data-nf]'))){S.nf=t.getAttribute('data-nf');K.render(false,true);return}
  if((t=e.target.closest('[data-mail]'))){S.mail=!S.mail;t.setAttribute('aria-pressed',String(S.mail));K.toast(T(S.mail?'Monday e-mail on':'Monday e-mail off'));return}
  if((t=e.target.closest('[data-fs]'))){var p=document.getElementById('tvp');if(p&&p.requestFullscreen)p.requestFullscreen();return}
  if((t=e.target.closest('[data-mem]'))){memberDrawer(+t.getAttribute('data-mem'));return}
  if((t=e.target.closest('[data-m]'))){machineDrawer(+t.getAttribute('data-m'))}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.wp){S.wp=false;K.render(false,true)}});
/* the light on the glass follows the pointer */
document.addEventListener('pointermove',function(e){var el=e.target.closest&&e.target.closest('.lg');if(!el)return;var r=el.getBoundingClientRect();el.style.setProperty('--mx',((e.clientX-r.left)/r.width*100).toFixed(1)+'%');el.style.setProperty('--my',((e.clientY-r.top)/r.height*100).toFixed(1)+'%')},{passive:true});

/* ---- small parts ---- */
function hb(items,max,k,col){return '<div class="hb">'+items.map(function(x,i){return '<div'+(x.attr||'')+'><span>'+esc(x.label)+'</span><i><u class="gx" style="width:'+(max?x.v/max*100:0).toFixed(1)+'%;--dl:'+K.sd(i)+'ms'+(col?';background:'+col:'')+'"></u></i><em>'+N(x.v,{cls:'',k:k?k+i:null})+'</em></div>'}).join('')+'</div>'}
function bat(b){return '<span class="bat"><i><u style="width:'+Math.round(b*.155)+'px"></u></i>'+b+'%</span>'}
function cell(v){return v===2?'f':v===1?'h':v===-1?'n':''}
function tile(href,label,body,foot,cls){return '<a class="t5 lg'+(cls?' '+cls:'')+'" href="'+href+'"><span class="lab">'+label+'</span>'+body+'<div class="tf5">'+(foot||'')+'</div></a>'}
function big(v,k,o){return '<div class="bn5">'+N(v,Object.assign({k:k},o||{}))+'</div>'}
function ch(v,abs){return v===null||v===undefined?'':(abs?K.delta(v,{unit:'',dec:0}):K.delta(v))}
function sp(vals){return '<div class="sp5">'+K.spark(vals,{w:150,h:30})+'</div>'}

/* ---- the hero ---- */
function hourLabel(g){return function(d,h){return '<b>'+K.DAYS[d]+' '+hh(h+6)+'</b><span>'+Math.round(g[d][h])+' '+T('of')+' '+NM+' '+T('machines')+'</span>'}}
function waveCfg(k,glide){if(k==='today'){var g=heatP(range(LAST,4)),nowH=G.nowMin/60-6;
    return {values:g,max:HMAX,glide:glide,hourLabel:hourLabel(g),today:{d:0,h:Math.round(nowH)},nowLabel:'<b>'+T('Now')+'</b><span>'+G.busy.length+' '+T('of')+' '+NM+' '+T('in use')+'</span>'}}
  var g2=heatP(range(S.E,span())),pk=peakOf(g2);
  return {values:g2,max:HMAX,glide:glide,hourLabel:hourLabel(g2),peak:{d:pk.d,h:pk.h},peakLabel:'<b>'+T('Peak')+', '+K.DAYS[pk.d]+' '+hh(pk.h+6)+'</b><span>'+Math.round(pk.v)+' '+T('of')+' '+NM+' '+T('machines')+'</span>'}}
function mountWave(k,v){var el=document.getElementById('wv');if(!el||!window.WAVE)return;var glide=!!(v&&v.firstElementChild&&v.firstElementChild.classList.contains('m-in'));
  try{window.WAVE.mount(el,waveCfg(k,glide))}catch(err){el.innerHTML='<div class="tw-off">'+T('3D needs WebGL')+'</div>'}}
window.addEventListener('wave-ready',function(){mountWave(route(),null)});

/* ---- overview: the week ---- */
function week(){var n=span(),p=P(S.E,n),pp=prevP(),st=stronger(S.E),q=quiet(S.E*7+6),co=cohort(S.E),k=kept(co.slice(-24)),r=M.map(function(m,i){return i}).sort(function(a,b){return p.mu[b]-p.mu[a]}),u=st.n?Math.round(st.up.length/st.n*100):0;

   +tile('#members',T('Workouts'),big(p.ses,'w-ses'),ch(pp&&pct(p.ses,pp.ses))+sp(series(function(w){return G.weeks[w].ses})))

   +tile('#members',T('Stronger'),'<div class="bn5 rg5">'+K.ring(u/100,{size:58,sw:6})+N(u,{k:'w-up',suf:'%'})+'</div>','<span class="mute">'+Math.round(st.two)+'% '+T('train 2+ a week')+'</span>')

  all.forEach(function(x){var c=x.c;bins[c<-1.5?0:c<=1.5?1:c<=4?2:c<=8?3:4]++});var top=st.up.filter(function(x){return x.m.consent}).slice(0,4);

  var latest=function(x){for(var j=3;j>=0;j--)if(x.c[j]!==-1)return x.c[j];return 0},named=co.slice().reverse().filter(function(x){return x.m.consent}),list=named.filter(function(x){var v=latest(x);return S.nf==='all'||(S.nf==='training'?v>0:v===0)});

  var h='<section class="pg5">'+title(T('Members'),'<span class="ch5">'+G.members.length+' '+T('in the app')+'</span>');
  h+='<div class="g5 two5"><div class="c5 lg"><div class="h5"><h3>'+T('New members')+'</h3><span class="ch5">'+co.length+' '+T('joined')+'</span></div><div class="bn5">'+N(k.kept,{k:'m-k'})+'<span class="of5">/ '+k.reached+'</span></div><span class="mute">'+T('Training in week 4')+'</span>'+grid

   +'<div class="g5"><div class="c5 lg"><div class="h5"><h3>'+T('Gone quiet')+'</h3><span class="ch5">'+QMIN+'–'+QMAX+' '+T('days')+'</span></div><div class="bn5">'+N(q.length,{k:'m-q'})+'</div>'
   +'<div class="rw5">'+q.filter(function(x){return x.m.consent}).map(function(x){return '<button type="button" class="r5" data-mem="'+x.m.id+'"><span class="av">'+esc(x.m.init)+'</span><b>'+esc(x.m.name)+'</b><span class="mute">'+K.fmtN(x.per,1)+' '+T('a week before')+'</span><em>'+x.since+' '+T('d')+'</em></button>'}).join('')+'</div></div>'
   +strongCard(st)+'<div class="c5 lg"><div class="h5"><h3>'+T('How often')+'</h3><span class="ch5">'+T('A week')+'</span></div>'+K.bars(buck,['&lt;1','1','2','3','4+'],{h:130,values:true,label:'Members by workouts a week',tips:buck.map(function(v,i){return ['Under 1','1','2','3','4 or more'][i]+': '+v})})+'</div></div></div></section>';

function memberDrawer(id){var m=G.members[id];if(!m||!m.consent)return;var since=m.ds.length?G.today-m.ds[m.ds.length-1]:null,from=Math.max(0,wkOf(m.joinD)),wk=[],labs=[],str=[];
  for(var w=from;w<=G.nwk;w++){wk.push(m.cnt[w]);labs.push(w===G.nwk?T('Now'):'W'+WKS[w].n);str.push(Math.round((m.sw[w]/m.sw[from]-1)*1000)/10)}

function machineDrawer(i){var m=M[i],p=P(S.E,span()),rank=M.map(function(x,j){return j}).sort(function(a,b){return p.mu[b]-p.mu[a]}).indexOf(i)+1,vals=[],labs=[];

   +'<div class="card"><div class="ch"><h3>'+T('16 weeks')+'</h3><div class="legend"><span><i style="background:var(--ink);opacity:.5"></i>'+T('Average')+' '+avg+'</span></div></div>'+K.line([{vals:vals,area:true,dots:true}],labs,{hi:S.E,ref:avg,h:200,label:m.name+', 16 weeks'})+'</div>'
   +'<div class="card"><div class="ch"><h3>'+T('Hours')+'</h3><span class="lab">'+T('Last 4 weeks')+'</span></div>'+K.heat(G.machineHours[i],K.DAYS,HOURCOLS,{cw:20,ch:16,label:'Uses by hour',tip:function(a,b,x){return K.DAYS[a]+' '+hh(b+6)+': '+x}})+'</div></div>';
  K.openDrawer(h)}

/* ---- the gym TV (records only from members who agreed) and the Monday e-mail ---- */

   +'<div class="tv" id="tvp"><div class="tvtop"><span class="tvlogo">'+esc(LOGO)+'</span><span class="lab">'+T(K.DAYL[0])+' 18:10</span></div>'

   +'<div class="tvbot"><div><span class="lab">'+T('Reps today')+'</span><div class="tvmid">'+N(G.weeks[G.nwk].reps,{k:'tv-reps'})+'</div></div><div><span class="lab">'+T('In the gym')+'</span><div class="tvmid">'+N(G.inNow.length,{k:'tv-in'})+'</div></div><div><span class="lab">'+T('Workouts today')+'</span><div class="tvmid">'+N(G.todays.length,{k:'tv-w'})+'</div></div></div></div></section>','tv')}
function tick(){var tiles=document.querySelectorAll('[data-tvm]');if(!tiles.length)return;var on=[],off=[];tiles.forEach(function(t){(t.classList.contains('on')?on:off).push(t)});

function email(){var E=LAST,p=P(E,1),pp=P(E-1,1),k=kept(cohort(E)),st=stronger(E),q=quiet(E*7+6),g=heatP([E]),pk=peakOf(g),n=st.n||1,r=M.map(function(m,i){return i}).sort(function(a,b){return p.mu[b]-p.mu[a]});

   +'<div class="mail lg"><div class="mhead"><span class="mlogo">'+esc(LOGO)+'</span><span class="mute">'+T('Week')+' '+WKS[E].n+', '+wkLabel(E)+'</span></div><div class="mbody">'
   +'<div class="mfig">'+mf('Members',p.mem,K.delta(pct(p.mem,pp.mem)))+mf('Workouts',p.ses,K.delta(pct(p.ses,pp.ses)))+mf('Reps',p.reps,K.delta(pct(p.reps,pp.reps)))+mf('Records',p.recs,K.delta(p.recs-pp.recs,{unit:'',dec:0}))+mf('New',p.newM)+'</div>'
   +'<div><div class="ch" style="margin-bottom:8px"><span class="lab">'+T('Busy hours')+'</span><span class="mute msm">'+T('Peak')+' '+K.DAYS[pk.d]+' '+hh(pk.h+6)+'</span></div>'+K.heat(g,K.DAYS,HOURCOLS,{cw:24,ch:14,label:'Busy hours'})+'</div>'
   +'<div class="mfig m3"><div><span class="lab">'+T('New, week 4')+'</span><b class="num">'+k.kept+'<small> / '+k.reached+'</small></b></div><div><span class="lab">'+T('Stronger')+'</span><b class="num">'+Math.round(st.up.length/n*100)+'%</b></div><div><span class="lab">'+T('Gone quiet')+'</span><b class="num">'+q.length+'</b></div></div>'
   +'<div class="mfig m2"><div><span class="lab">'+T('Most used')+'</span>'+r.slice(0,3).map(ml).join('')+'</div><div><span class="lab">'+T('Least used')+'</span>'+r.slice(-3).reverse().map(ml).join('')+'</div></div>'

<script type="module">
/* The hero of the owner hub, version 5: the gym's week as a liquid glass sculpture. Seven days by seventeen hours,
   rising where the gym is busy and settling where it is quiet; it breathes slowly, the peak glows, pointing reads any
   hour. Works for every gym: it needs no floor plan and no names. Built from code (three.js), no downloaded models. */
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const css=getComputedStyle(document.documentElement),ACC=(css.getPropertyValue('--acc')||'#2747D6').trim(),accC=new THREE.Color(ACC);
const STILL=/[?&]still/.test(location.search)||matchMedia('(prefers-reduced-motion: reduce)').matches;
const NX=17,NZ=7,SX=6,SZ=6,VX=(NX-1)*SX+1,VZ=(NZ-1)*SZ+1,W=16.5,D=8.4,HM=3.3;
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
let R,scene,cam,host=null,lab=null,root,geo,mesh,skirt,lines,dot,glow,nowDot,nowGlow,hov,cfg={},cur=null,from=null,to=null,anim=null,t0=performance.now(),raf=0,camBase=null,ptr={x:0,y:0};

/* smooth heights between the hours and days (Catmull-Rom both ways) */
const cr=(a,b,c,d,t)=>.5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t*t+(-a+3*b-3*c+d)*t*t*t);
function sample(g,fx,fz){const v=(z,x)=>g[Math.max(0,Math.min(NZ-1,z))][Math.max(0,Math.min(NX-1,x))],x0=Math.floor(fx),z0=Math.floor(fz),tx=fx-x0,tz=fz-z0,row=[];
  for(let k=-1;k<3;k++)row.push(cr(v(z0+k,x0-1),v(z0+k,x0),v(z0+k,x0+1),v(z0+k,x0+2),tx));return Math.max(0,cr(row[0],row[1],row[2],row[3],tz))}
function heights(g,max){const out=new Float32Array(VX*VZ);for(let iz=0;iz<VZ;iz++)for(let ix=0;ix<VX;ix++)out[iz*VX+ix]=.12+sample(g,ix/SX,iz/SZ)/max*HM;return out}
const X=ix=>-W/2+ix*W/(VX-1),Z=iz=>-D/2+iz*D/(VZ-1);

function build(){root=new THREE.Group();scene.add(root);
  geo=new THREE.BufferGeometry();const pos=new Float32Array(VX*VZ*3),col=new Float32Array(VX*VZ*3),idx=[];
  for(let iz=0;iz<VZ;iz++)for(let ix=0;ix<VX;ix++){const i=iz*VX+ix;pos[i*3]=X(ix);pos[i*3+1]=.12;pos[i*3+2]=Z(iz)}
  for(let iz=0;iz<VZ-1;iz++)for(let ix=0;ix<VX-1;ix++){const a=iz*VX+ix,b=a+1,c=a+VX,d=c+1;idx.push(a,c,b,b,c,d)}
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('color',new THREE.BufferAttribute(col,3));geo.setIndex(idx);
  const glass=new THREE.MeshPhysicalMaterial({color:0xffffff,vertexColors:true,roughness:.2,metalness:0,transmission:.3,thickness:1.2,ior:1.45,
    clearcoat:1,clearcoatRoughness:.05,iridescence:.22,iridescenceIOR:1.3,iridescenceThicknessRange:[150,400],specularIntensity:.85,envMapIntensity:1.05,side:THREE.DoubleSide});
  mesh=new THREE.Mesh(geo,glass);root.add(mesh);
  /* the sides, so it reads as one solid piece of glass */
  const sg=new THREE.BufferGeometry(),edge=[];for(let ix=0;ix<VX;ix++)edge.push([ix,VZ-1]);for(let iz=VZ-1;iz>=0;iz--)edge.push([VX-1,iz]);for(let ix=VX-1;ix>=0;ix--)edge.push([ix,0]);for(let iz=0;iz<VZ;iz++)edge.push([0,iz]);
  const sp=new Float32Array(edge.length*2*3),sc=new Float32Array(edge.length*2*3),si=[];edge.forEach((e,k)=>{sp[k*6]=X(e[0]);sp[k*6+2]=Z(e[1]);sp[k*6+3]=X(e[0]);sp[k*6+4]=0;sp[k*6+5]=Z(e[1])});
  for(let k=0;k<edge.length-1;k++){const a=k*2,b=a+1,c=a+2,d=a+3;si.push(a,b,c,c,b,d)}sg.setAttribute('position',new THREE.BufferAttribute(sp,3));sg.setAttribute('color',new THREE.BufferAttribute(sc,3));sg.setIndex(si);
  skirt=new THREE.Mesh(sg,glass);skirt.userData.edge=edge;root.add(skirt);
  /* a frosted base, the day lines and the hour lines */
  const baseM=new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:.35,transmission:.4,thickness:.6,clearcoat:.6,envMapIntensity:1});
  const plate=new THREE.Mesh(new THREE.BoxGeometry(W+.9,.16,D+.9),baseM);plate.position.y=-.09;root.add(plate);
  lines=new THREE.Group();root.add(lines);
  for(let d=0;d<NZ;d++){const g=new THREE.BufferGeometry().setFromPoints(new Array(VX).fill(0).map((_,ix)=>new THREE.Vector3(X(ix),0,Z(d*SZ))));
    const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:0x3a2c26,transparent:true,opacity:.24}));l.userData={kind:'day',iz:d*SZ};lines.add(l)}
  for(let h=0;h<NX;h+=3){const g=new THREE.BufferGeometry().setFromPoints(new Array(VZ).fill(0).map((_,iz)=>new THREE.Vector3(X(h*SX),0,Z(iz))));
    const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:0x3a2c26,transparent:true,opacity:.11}));l.userData={kind:'hour',ix:h*SX};lines.add(l)}
  /* the peak, now and the pointer */
  const orbT=orbTex();dot=new THREE.Mesh(new THREE.SphereGeometry(.12,24,16),new THREE.MeshBasicMaterial({color:accC}));glow=new THREE.Sprite(new THREE.SpriteMaterial({map:orbT,transparent:true,depthWrite:false}));glow.scale.set(1.9,1.9,1);
  nowDot=dot.clone();nowGlow=glow.clone();nowDot.visible=nowGlow.visible=false;
  hov=new THREE.Mesh(new THREE.SphereGeometry(.09,20,12),new THREE.MeshBasicMaterial({color:0x111111}));hov.visible=false;
  root.add(dot,glow,nowDot,nowGlow,hov);
  /* a soft floor and shadow so the glass has something to bend */
  const fl=new THREE.Mesh(new THREE.CircleGeometry(16,64),new THREE.MeshBasicMaterial({map:floorTex(),transparent:true,depthWrite:false}));fl.rotation.x=-Math.PI/2;fl.position.y=-.18;scene.add(fl)}
function orbTex(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64),r=Math.round(accC.r*255),gg=Math.round(accC.g*255),b=Math.round(accC.b*255);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.16,'rgba('+r+','+gg+','+b+',1)');g.addColorStop(.42,'rgba('+r+','+gg+','+b+',.4)');g.addColorStop(1,'rgba('+r+','+gg+','+b+',0)');x.fillStyle=g;x.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
function floorTex(){const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d'),r=Math.round(accC.r*255),g=Math.round(accC.g*255),b=Math.round(accC.b*255);
  let gr=x.createRadialGradient(256,256,0,256,256,256);gr.addColorStop(0,'rgba(40,30,25,.22)');gr.addColorStop(.45,'rgba(40,30,25,.08)');gr.addColorStop(1,'rgba(40,30,25,0)');x.fillStyle=gr;x.fillRect(0,0,512,512);
  gr=x.createRadialGradient(300,220,0,300,220,200);gr.addColorStop(0,'rgba('+r+','+g+','+b+',.22)');gr.addColorStop(1,'rgba('+r+','+g+','+b+',0)');x.fillStyle=gr;x.fillRect(0,0,512,512);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}

/* write heights into the surface, the sides, the lines and the colours */
const cream=new THREE.Color(0xf6efe9).lerp(accC,.06),tmp=new THREE.Color();
function apply(h,breath){const p=geo.attributes.position.array,c=geo.attributes.color.array;let mx=0;for(let i=0;i<h.length;i++)if(h[i]>mx)mx=h[i];
  for(let i=0;i<h.length;i++){const iz=Math.floor(i/VX),ix=i%VX,y=h[i]*(breath?1+.018*Math.sin(breath*1.05+ix*.11+iz*.23):1);p[i*3+1]=y;
    const t=Math.pow(Math.min(1,y/HM),.9);tmp.copy(cream).lerp(accC,Math.min(1,t*1.05));if(cfg.today&&Math.abs(iz-cfg.today.d*SZ)<=1)tmp.lerp(accC,.35);c[i*3]=tmp.r;c[i*3+1]=tmp.g;c[i*3+2]=tmp.b}
  geo.attributes.position.needsUpdate=true;geo.attributes.color.needsUpdate=true;geo.computeVertexNormals();
  const sp=skirt.geometry.attributes.position.array,sc=skirt.geometry.attributes.color.array;skirt.userData.edge.forEach((e,k)=>{const i=e[1]*VX+e[0];sp[k*6+1]=p[i*3+1];
    for(let q=0;q<2;q++){sc[k*6+q*3]=c[i*3]*.92;sc[k*6+q*3+1]=c[i*3+1]*.92;sc[k*6+q*3+2]=c[i*3+2]*.92}});
  skirt.geometry.attributes.position.needsUpdate=true;skirt.geometry.attributes.color.needsUpdate=true;skirt.geometry.computeVertexNormals();
  lines.children.forEach(l=>{const a=l.geometry.attributes.position.array;if(l.userData.kind==='day'){for(let ix=0;ix<VX;ix++)a[ix*3+1]=p[(l.userData.iz*VX+ix)*3+1]+.025}else{for(let iz=0;iz<VZ;iz++)a[iz*3+1]=p[(iz*VX+l.userData.ix)*3+1]+.025}l.geometry.attributes.position.needsUpdate=true});
  const pk=cfg.peak;if(pk){const i=pk.d*SZ*VX+pk.h*SX;dot.position.set(X(pk.h*SX),p[i*3+1]+.16,Z(pk.d*SZ));glow.position.copy(dot.position)}
  if(cfg.today){const fx=cfg.today.h*SX,ix=Math.round(fx),i=cfg.today.d*SZ*VX+ix;nowDot.position.set(X(ix),p[i*3+1]+.16,Z(cfg.today.d*SZ));nowGlow.position.copy(nowDot.position)}}

/* labels: days on the left, hours in front, the peak, now and the pointer */
function labels(){if(!lab)return;const r=R.domElement.getBoundingClientRect(),P=(v)=>{const q=v.clone();root.localToWorld(q);q.project(cam);return [(q.x*.5+.5)*r.width,(-q.y*.5+.5)*r.height]};
  const items=[],narrow=r.width<560;for(let d=0;d<NZ;d++)if(!narrow||d%2===0)items.push({k:'d'+d,cls:'ax',html:DAYS[d],p:P(new THREE.Vector3(-W/2-.75,.1,Z(d*SZ)))});
  for(let h=0;h<NX;h+=3)items.push({k:'h'+h,cls:'ax',html:String(6+h).padStart(2,'0'),p:P(new THREE.Vector3(X(h*SX),.1,D/2+.75))});
  if(cfg.peak&&cfg.peakLabel)items.push({k:'pk',cls:'pk',html:cfg.peakLabel,p:P(dot.position.clone().add(new THREE.Vector3(0,.35,0)))});
  if(cfg.today&&cfg.nowLabel)items.push({k:'now',cls:'pk now',html:cfg.nowLabel,p:P(nowDot.position.clone().add(new THREE.Vector3(0,.35,0)))});
  if(hov.visible&&hov.userData.html)items.push({k:'hv',cls:'hv',html:hov.userData.html,p:P(hov.position.clone().add(new THREE.Vector3(0,.25,0)))});
  const sig=items.map(i=>i.k+i.html).join('|');if(lab.__sig!==sig){lab.innerHTML=items.map(i=>'<div class="wl5 '+i.cls+'">'+i.html+'</div>').join('');lab.__sig=sig}
  items.forEach((it,k)=>{const el=lab.children[k];if(el)el.style.transform='translate('+it.p[0].toFixed(1)+'px,'+it.p[1].toFixed(1)+'px) translate(-50%,'+(it.cls==='ax'?'-50%':'-100%')+')'})}

/* pointing: read any hour */
const ray=new THREE.Raycaster(),v2=new THREE.Vector2();
function onMove(e){const r=R.domElement.getBoundingClientRect();ptr.x=((e.clientX-r.left)/r.width)*2-1;ptr.y=-((e.clientY-r.top)/r.height)*2+1;
  v2.set(ptr.x,ptr.y);ray.setFromCamera(v2,cam);const hit=ray.intersectObject(mesh,false)[0];if(!hit){hov.visible=false;R.domElement.style.cursor='';return}
  const lp=root.worldToLocal(hit.point.clone()),h=Math.max(0,Math.min(NX-1,Math.round((lp.x+W/2)/W*(NX-1)))),d=Math.max(0,Math.min(NZ-1,Math.round((lp.z+D/2)/D*(NZ-1))));
  const i=d*SZ*VX+h*SX,p=geo.attributes.position.array;hov.position.set(X(h*SX),p[i*3+1]+.1,Z(d*SZ));hov.visible=true;hov.userData.html=cfg.hourLabel?cfg.hourLabel(d,h):'';R.domElement.style.cursor='crosshair'}

function fit(){if(!host)return;const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;cam.aspect=w/h;cam.updateProjectionMatrix();
  const az=cfg.az===undefined?.36:cfg.az,el=cfg.el===undefined?.5:cfg.el,dir=new THREE.Vector3(Math.sin(az)*Math.cos(el),Math.sin(el),Math.cos(az)*Math.cos(el)),c=new THREE.Vector3(0,HM*.32,0),box=new THREE.Box3(new THREE.Vector3(-W/2-1.2,0,-D/2-1),new THREE.Vector3(W/2+.6,HM*1.05,D/2+1.2));
  let d=30;for(let k=0;k<3;k++){cam.position.copy(c).addScaledVector(dir,d);cam.lookAt(c);cam.updateMatrixWorld();const pr=new THREE.Box2();for(let i=0;i<8;i++){const p=new THREE.Vector3(i&1?box.max.x:box.min.x,i&2?box.max.y:box.min.y,i&4?box.max.z:box.min.z).project(cam);pr.expandByPoint(new THREE.Vector2(p.x*w/2,p.y*h/2))}
    const s=pr.getSize(new THREE.Vector2());d*=Math.max(s.x/(w*(cfg.fw||.97)),s.y/(h*(cfg.fh||.9)))}
  camBase={c,dir,d};cam.position.copy(c).addScaledVector(dir,d);cam.lookAt(c)}
function frame(now){raf=requestAnimationFrame(frame);if(!host||!host.isConnected||document.hidden)return;const t=(now-t0)/1000;
  if(anim){const p=Math.min(1,(now-anim.t)/anim.ms),e=anim.ease(p),h=new Float32Array(to.length);for(let i=0;i<h.length;i++)h[i]=from[i]+(to[i]-from[i])*e;cur=h;if(p>=1)anim=null}
  apply(cur,STILL?0:t);if(!STILL){root.rotation.y=Math.sin(t*.13)*.05;const k=1+Math.sin(t*1.7)*.08;glow.scale.set(1.9*k,1.9*k,1);nowGlow.scale.set(2.2*k,2.2*k,1);
    if(camBase){const off=new THREE.Vector3(ptr.x*.6,ptr.y*.3,0);cam.position.copy(camBase.c).addScaledVector(camBase.dir,camBase.d).add(off);cam.lookAt(camBase.c)}}
  R.render(scene,cam);labels()}
function init(){R=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});R.setPixelRatio(Math.min(2,devicePixelRatio||1));R.outputColorSpace=THREE.SRGBColorSpace;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=.98;
  scene=new THREE.Scene();scene.environment=new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(),.035).texture;
  scene.add(new THREE.HemisphereLight(0xffffff,0xe9ddd2,.42));const key=new THREE.DirectionalLight(0xffffff,2.3);key.position.set(-12,13,6);scene.add(key);const rim=new THREE.DirectionalLight(accC,1.3);rim.position.set(10,5,-12);scene.add(rim);const fill=new THREE.DirectionalLight(0xffffff,.5);fill.position.set(8,4,12);scene.add(fill);
  cam=new THREE.PerspectiveCamera(27,1,.5,300);build();
  R.domElement.addEventListener('pointermove',onMove);R.domElement.addEventListener('pointerleave',()=>{hov.visible=false;ptr.x=ptr.y=0});
  new ResizeObserver(()=>{if(!host)return;R.setSize(host.clientWidth,host.clientHeight,false);R.domElement.style.width='100%';R.domElement.style.height='100%';fit()}).observe(document.body);
  raf=requestAnimationFrame(frame)}
function setValues(g,o){o=o||{};Object.assign(cfg,o);const max=cfg.max||Math.max(1,...g.flat());const target=heights(g,max);
  if(!cur||STILL||o.instant){cur=target;anim=null}else{from=cur;to=target;anim={t:performance.now(),ms:o.rise?1500:750,ease:o.rise?(p=>1-Math.pow(1-p,4)):(p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2)}}
  nowDot.visible=nowGlow.visible=!!cfg.today;apply(cur,0)}
function mount(el,o){if(!R)init();host=el;cfg=Object.assign({},o||{});el.innerHTML='';el.appendChild(R.domElement);lab=document.createElement('div');lab.className='wlay5';el.appendChild(lab);
  R.setSize(el.clientWidth,el.clientHeight,false);R.domElement.style.width='100%';R.domElement.style.height='100%';fit();
  const g=cfg.values;if(cfg.glide!==false&&!STILL){cur=heights(g.map(r=>r.map(()=>0)),1);setValues(g,{rise:true})}else if(cur&&!STILL){setValues(g,{})}else{cur=null;setValues(g,{instant:true})}el.classList.add('ready')}
window.WAVE={mount,setValues};window.dispatchEvent(new Event('wave-ready'));

</script>
