<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B2B e-mails</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/pearl.css">
<!--
  The three B2B e-mails (adampauk.github.io/emails), copied from the workout-tracker repo's docs/team/emails/b2b. Each is shown
  as it lands in the inbox (sender, subject, preview text) and then opened, at phone or desktop width, with the merge
  fields filled with sample values or left as they are. The images load from img/, exactly as the e-mails reference them.
-->
<style>
  .intro { max-width:760px; margin:0 auto; padding:44px 16px 8px; }
  .intro h1 { font-size:clamp(34px, 6vw, 48px); }
  .intro .sub { margin-top:10px; font-size:17px; color:var(--ink3); }
  .bar { max-width:760px; margin:0 auto; padding:18px 16px 0; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .seg { display:inline-flex; max-width:100%; overflow-x:auto; scrollbar-width:none; padding:3px; border-radius:12px; background:rgba(255,255,255,.45); box-shadow:inset 0 0 0 1px rgba(255,255,255,.7); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); }
  .seg button { appearance:none; border:0; background:transparent; font:inherit; font-size:14px; font-weight:600; color:var(--ink3);
                padding:8px 14px; border-radius:9px; cursor:pointer; white-space:nowrap; }
  .seg button[aria-pressed="true"] { background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(29,29,31,.12); }
  .seg button:focus-visible { outline:2px solid var(--ink); outline-offset:1px; }
  .spacer { flex:1; }
  main { max-width:760px; margin:0 auto; padding:22px 16px 60px; display:flex; flex-direction:column; align-items:center; }
  .inbox { width:100%; max-width:var(--w); background:rgba(255,255,255,.86); border-radius:16px; padding:14px 18px 15px; box-shadow:0 1px 2px rgba(29,29,31,.05);
           display:grid; grid-template-columns:auto 1fr auto; column-gap:12px; row-gap:2px; align-items:baseline; }
  .dot { grid-row:1 / span 3; width:9px; height:9px; border-radius:5px; background:#0A84FF; align-self:start; margin-top:7px; }
  .from { font-size:16px; font-weight:600; }
  .time { font-size:13px; color:var(--ink3); }
  .subj { grid-column:2 / span 2; font-size:15px; font-weight:500; color:var(--ink); }
  .pre { grid-column:2 / span 2; font-size:14px; line-height:1.4; color:var(--ink3); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .cap { width:100%; max-width:var(--w); margin:22px 0 8px; font-size:13px; font-weight:600; color:var(--ink3); }
  iframe { display:block; width:var(--w); max-width:100%; border:0; border-radius:20px; background:var(--page);
           box-shadow:0 1px 2px rgba(29,29,31,.05), 0 24px 60px rgba(54,62,92,.14); }
  .note { max-width:760px; margin:0 auto; padding:0 16px 40px; font-size:13px; line-height:1.55; color:var(--ink3); text-align:center; }
</style>
</head>
<body>
<header class="site"><a class="mark" href="/blog/">Every set seen.</a><nav aria-label="Site"><a href="/blog/">Blog</a><a href="/calendar/">Content calendar</a><a href="/flows/">E-mail flows</a><a href="/emails/" aria-current="page">E-mails</a></nav></header>
<div class="intro">
  <h1 class="display">B2B e-mails</h1>
  <div class="sub">How each e-mail lands in the inbox, and how it reads once opened.</div>
</div>
<div class="bar">
  <div class="seg" id="mail" role="group" aria-label="E-mail">
    <button data-v="1">After the floor walk</button><button data-v="2">Weekly report</button><button data-v="3">Book your read-out</button>
  </div>
  <div class="spacer"></div>
  <div class="seg" id="width" role="group" aria-label="Width">
    <button data-v="phone">Phone</button><button data-v="desktop">Desktop</button>
  </div>
  <div class="seg" id="fill" role="group" aria-label="Merge fields">
    <button data-v="sample">Sample values</button><button data-v="raw">Merge fields</button>
  </div>
</div>
<main id="stage">
  <div class="inbox" aria-label="Inbox row">
    <span class="dot"></span><span class="from" id="from"></span><span class="time">09:12</span>
    <span class="subj" id="subj"></span><span class="pre" id="pre"></span>
  </div>
  <div class="cap">Opened</div>
  <iframe id="frame" title="E-mail preview"></iframe>
</main>
<div class="note">Sample values are invented for the preview. In the real e-mails the fields like {{first_name}} are filled by the e-mail tool.</div>
<script>
const FILES = { 1: '01_after-the-floor-walk.html', 2: '02_weekly-report.html', 3: '03_book-your-read-out.html' };
const FROM = { 1: 'Adam', 2: 'Every set seen.', 3: 'Adam' };
const SAMPLE = { first_name: 'Daan', gym_name: 'Gym Centrum', machine: 'leg press', trial_end: 'Friday 31 October', week: '2',
  slot_1_day: 'Tuesday 28 October', slot_1_time: '10:00 to 10:30', slot_2_day: 'Wednesday 29 October', slot_2_time: '14:00 to 14:30',
  slot_3_day: 'Thursday 30 October', slot_3_time: '17:30 to 18:00', consent_place: 'your gym', consent_date: '14 October',
  company_name: 'Company name', company_address: 'Street 1, Amsterdam', headline: 'the hip abduction went quiet' };
const WIDTH = { phone: 390, desktop: 680 };
const state = { mail: '1', width: 'phone', fill: 'sample' };
try { Object.assign(state, JSON.parse(localStorage.getItem('b2b-preview') || '{}')); } catch (e) { /* private window */ }
const h = new URLSearchParams(location.hash.slice(1));
for (const k of ['mail', 'width', 'fill']) if (h.get(k)) state[k] = h.get(k);
const cache = {};
const frame = document.getElementById('frame');
const fill = (s) => state.fill === 'sample' ? s.replace(/\{\{(\w+)\}\}/g, (m, k) => SAMPLE[k] ?? m) : s;

function fit() {
  try { frame.style.height = Math.ceil(frame.contentDocument.body.getBoundingClientRect().height) + 'px'; } catch (e) { frame.style.height = '2400px'; }   // the body's own height, so a shorter e-mail shrinks the frame
}
frame.addEventListener('load', () => {
  fit();
  for (const img of frame.contentDocument.images) if (!img.complete) img.addEventListener('load', fit, { once: true });
  setTimeout(fit, 300);
});
addEventListener('resize', fit);

async function show() {
  for (const g of ['mail', 'width', 'fill']) for (const b of document.querySelectorAll('#' + g + ' button')) b.setAttribute('aria-pressed', String(b.dataset.v === state[g]));
  document.getElementById('stage').style.setProperty('--w', WIDTH[state.width] + 'px');
  const file = FILES[state.mail];
  cache[file] ??= await (await fetch(file, { cache: 'no-store' })).text();
  const html = fill(cache[file]);
  const doc = new DOMParser().parseFromString(html, 'text/html');
  document.getElementById('from').textContent = FROM[state.mail];
  document.getElementById('subj').textContent = doc.title;
  const pre = doc.querySelector('body > div[style*="display:none"]');
  document.getElementById('pre').textContent = pre ? pre.textContent.replace(/[‌\s]+$/u, '').trim() : '';
  frame.srcdoc = html;   // relative img/ paths resolve against this page, so the images load from img/
  const q = new URLSearchParams(state).toString();
  history.replaceState(null, '', '#' + q);
  try { localStorage.setItem('b2b-preview', JSON.stringify(state)); } catch (e) { /* private window */ }
}
for (const g of ['mail', 'width', 'fill']) document.getElementById(g).addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return; state[g] = b.dataset.v; show();
});
addEventListener('keydown', (e) => { if (['1', '2', '3'].includes(e.key) && !e.metaKey && !e.ctrlKey) { state.mail = e.key; show(); } });
show();
</script>
</body>
</html>
